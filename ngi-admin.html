<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGI | Executive Master Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg: #050505; --card: #111; --border: #222;
            --gold: #D4AF37; --gold-dim: #8A6D1D; --white: #FFFFFF;
            --red: #FF4B2B; --green: #00E676; --blue: #2979FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--white); display: flex; height: 100vh; overflow: hidden; }

        /* Navigation */
        #sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 30px; }
        .logo { font-weight: 800; font-size: 22px; color: var(--gold); margin-bottom: 40px; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        .nav-link { padding: 14px; color: #777; cursor: pointer; border-radius: 8px; margin-bottom: 5px; font-weight: 600; transition: 0.2s; }
        .nav-link:hover { background: #1a1a1a; color: var(--white); }
        .nav-link.active { background: var(--gold); color: #000; }

        /* Layout Area */
        #main { flex: 1; padding: 40px; overflow-y: auto; }
        .section { display: none; animation: slideUp 0.4s ease; }
        .section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Components */
        .glass-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; margin-bottom: 24px; }
        h1 { font-size: 28px; margin-bottom: 20px; font-weight: 800; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: var(--gold); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid var(--border); padding: 14px; border-radius: 10px; color: #fff; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); }
        .btn { background: var(--gold); color: #000; padding: 14px 28px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); background: var(--white); }
        .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold); margin-top: 10px; width: 100%; }

        /* Ledger Table Styling */
        .table-wrap { overflow-x: auto; margin-top: 20px; border-radius: 12px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: #0a0a0a; text-align: left; padding: 18px; color: var(--gold); font-size: 11px; text-transform: uppercase; }
        td { padding: 18px; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
        .status-paid { color: var(--green); font-weight: 800; }
        .status-due { color: var(--red); font-weight: 800; }

        @media print {
            #sidebar, .btn, .scheduler-form { display: none !important; }
            #main { padding: 0; }
            .glass-card { border: none; }
            body { background: white; color: black; }
            th { color: black; border-bottom: 2px solid black; }
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div class="logo">NGI EXECUTIVE</div>
        <div class="nav-link active" onclick="tab('ledger')">📊 Master Ledger</div>
        <div class="nav-link" onclick="tab('meetings')">📅 Schedule Call</div>
        <div class="nav-link" onclick="tab('polls')">🗳️ Create Poll</div>
        <div class="nav-link" onclick="tab('comms')">📢 Broadcast</div>
        <div style="flex:1"></div>
        <div class="nav-link" style="color:var(--red)" onclick="firebase.auth().signOut()">🚪 Logout</div>
    </nav>

    <main id="main">
        <section id="ledger" class="section active">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h1>Weekly Contribution Ledger</h1>
                <div>
                    <button class="btn" style="background:var(--white)" onclick="window.print()">📥 Export PDF Report</button>
                </div>
            </div>
            
            <div class="glass-card">
                <div class="table-wrap">
                    <table id="ledgerTable">
                        <thead>
                            <tr>
                                <th>Member ID</th>
                                <th>Full Name</th>
                                <th>Week 1</th>
                                <th>Week 2</th>
                                <th>Week 3</th>
                                <th>Week 4</th>
                                <th>Month Total</th>
                                <th>Arrears</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="meetings" class="section">
            <h1>Schedule Executive Meeting</h1>
            <div class="glass-card scheduler-form" style="max-width:600px;">
                <div class="form-group">
                    <label>Meeting Agenda</label>
                    <input type="text" id="m-title" placeholder="e.g. Q2 Investment Strategy">
                </div>
                <div class="form-group">
                    <label>Date & Time</label>
                    <input type="datetime-local" id="m-date">
                </div>
                <div class="form-group">
                    <label>Agora Channel Name</label>
                    <input type="text" id="m-channel" value="ngi_main_room">
                </div>
                <button class="btn" onclick="scheduleMeeting()">🚀 Push to All Devices</button>
            </div>
        </section>

        <section id="polls" class="section">
            <h1>Dynamic Poll Architect</h1>
            <div class="glass-card" style="max-width:600px;">
                <div class="form-group">
                    <label>The Question</label>
                    <textarea id="p-question" rows="2" placeholder="Should we purchase land in Kitengela?"></textarea>
                </div>
                <div id="p-options-container">
                    <label>Choices</label>
                    <input type="text" class="p-option" placeholder="Option 1" style="margin-bottom:10px;">
                    <input type="text" class="p-option" placeholder="Option 2" style="margin-bottom:10px;">
                </div>
                <button class="btn btn-outline" onclick="addPollOption()">+ Add More Choices</button>
                <button class="btn" style="width:100%; margin-top:20px;" onclick="launchPoll()">🔥 Launch Governance Poll</button>
            </div>
        </section>

        <section id="comms" class="section">
            <h1>Executive Broadcast</h1>
            <div class="glass-card" style="max-width:600px;">
                <label>Message</label>
                <textarea id="b-msg" rows="5" placeholder="Attention members: Monthly contributions are now due."></textarea>
                <button class="btn" style="width:100%; margin-top:10px;" onclick="sendBroadcast()">Send Global Notification</button>
            </div>
        </section>
    </main>

    <script>
        // 🚨 YOUR SECURE FIREBASE CONFIG 🚨
        const firebaseConfig = {
            apiKey: "AIzaSyCMJdzsgYU5KgJ0T-7JTKJTqnpvEaFB2Zs",
            authDomain: "n-g-i-761b1.firebaseapp.com",
            projectId: "n-g-i-761b1",
            storageBucket: "n-g-i-761b1.firebasestorage.app",
            messagingSenderId: "375248351958",
            appId: "1:375248351958:web:9b45197e1a1dadeaaa0f77"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function tab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        /* ─── THE MASTER LEDGER ENGINE ─── */
        async function loadLedger() {
            const usersSnap = await db.collection("users").get();
            const transSnap = await db.collection("wallet_transactions").where("type","==","CONTRIBUTION").get();
            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = '';

            usersSnap.forEach(uDoc => {
                const user = uDoc.data();
                const userId = uDoc.id;
                let w1=0, w2=0, w3=0, w4=0;

                transSnap.docs.forEach(tDoc => {
                    const t = tDoc.data();
                    if(t.uid === userId) {
                        const day = new Date(t.timestamp).getDate();
                        if(day <= 7) w1 += t.amount;
                        else if(day <= 14) w2 += t.amount;
                        else if(day <= 21) w3 += t.amount;
                        else w4 += t.amount;
                    }
                });

                const total = w1+w2+w3+w4;
                const fmt = (amt) => amt >= 125 ? `<span class="status-paid">${amt}/=</span>` : `<span class="status-due">${amt}/=</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td style="color:var(--gold); font-weight:bold">${user.ngiId || 'NEW'}</td>
                        <td><b>${user.name}</b></td>
                        <td>${fmt(w1)}</td>
                        <td>${fmt(w2)}</td>
                        <td>${fmt(w3)}</td>
                        <td>${fmt(w4)}</td>
                        <td style="background:#1a1a1a"><b>${total}/=</b></td>
                        <td><span style="color:var(--red)">${(500 - total) > 0 ? (500 - total) + '/=' : 'CLEARED'}</span></td>
                    </tr>
                `;
            });
        }
        loadLedger();

        /* ─── MEETING SCHEDULER ─── */
        async function scheduleMeeting() {
            const title = document.getElementById('m-title').value;
            const date = new Date(document.getElementById('m-date').value).getTime();
            const channel = document.getElementById('m-channel').value;

            if(!title || !date) return alert("Fill all details");

            await db.collection("meetings").add({
                title: title,
                date: date,
                channelName: channel,
                status: "Scheduled",
                timestamp: Date.now()
            });
            alert("Meeting Broadcasted Successfully!");
        }

        /* ─── DYNAMIC POLL ARCHITECT ─── */
        function addPollOption() {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'p-option';
            input.placeholder = `Option ${document.querySelectorAll('.p-option').length + 1}`;
            input.style.marginBottom = '10px';
            document.getElementById('p-options-container').appendChild(input);
        }

        async function launchPoll() {
            const question = document.getElementById('p-question').value;
            const optionInputs = document.querySelectorAll('.p-option');
            let choices = [];

            optionInputs.forEach(input => {
                if(input.value.trim() !== "") {
                    choices.push({ id: Math.random().toString(36).substr(2, 9), text: input.value, votes: [] });
                }
            });

            if(!question || choices.length < 2) return alert("Needs question and 2 options");

            await db.collection("polls").add({
                question: question,
                choices: choices,
                status: "Active",
                createdAt: Date.now()
            });
            alert("Poll Published Live!");
        }

        async function sendBroadcast() {
            const msg = document.getElementById('b-msg').value;
            await db.collection("announcements").add({
                message: msg,
                timestamp: Date.now(),
                title: "Executive Update"
            });
            alert("Broadcast Fired!");
        }
    </script>
</body>
</html>
