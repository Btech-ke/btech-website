<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH PLUS | Premium Apparel | Professional E-Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #ffffff;
            --accent-color: #3b82f6;
            --accent-dark: #1e40af;
            --accent-light: #60a5fa;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--gray-50) 0%, var(--gray-100) 100%);
            color: var(--gray-900);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: var(--secondary-color);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 500;
            transition: all 0.3s ease;
        }

        header.scrolled {
            box-shadow: var(--shadow-lg);
        }

        .header-wrapper {
            padding: 1rem 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Sora', sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        /* Hero and Grids */
        .hero {
            background: linear-gradient(135deg, var(--primary-color) 0%, #1a2847 100%);
            color: white;
            padding: 4rem 0;
            text-align: center;
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .product-card {
            background: white;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: transform 0.3s ease;
        }

        .product-card:hover { transform: translateY(-8px); }

        .product-image {
            width: 100%;
            aspect-ratio: 1/1.2;
            overflow: hidden;
            background: #f3f4f6;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info { padding: 1.5rem; }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: var(--radius-lg);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        /* Notification Styling */
        .notification {
            position: fixed;
            top: 2rem;
            right: 1.25rem;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            color: white;
            z-index: 2000;
            box-shadow: var(--shadow-lg);
        }
        .notification.success { background: var(--success-color); }

        /* Hidden Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-xl);
            max-width: 500px;
            width: 90%;
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="container">
            <div class="header-wrapper">
                <div class="header-top">
                    <div class="logo">BTECH PLUS</div>
                    <div class="header-icons">
                        <button class="btn" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i> <span id="cartBadge">0</span></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Engineered Elegance</h1>
        <p>Premium Quality Limited Edition Series</p>
    </section>

    <div class="container">
        <div class="products-container" id="productsGrid"></div>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <button class="btn btn-primary" onclick="toggleCart()">Close</button>
        </div>
    </div>

    <script>
        // UPDATED PRODUCTS DATABASE
        // Using relative paths: images/filename.jpg
        const products = [
            {
                id: 1,
                name: "Black Edition Classic",
                category: "men",
                price: 1500,
                sizes: ["S", "M", "L", "XL"],
                image: "images/black-shirt.jpg", 
                fallback: "https://via.placeholder.com/300x400?text=Black+Shirt",
                description: "Premium black cotton shirt",
                stock: 25
            },
            {
                id: 2,
                name: "White Edition Premium",
                category: "women",
                price: 1500,
                sizes: ["S", "M", "L"],
                image: "images/white-shirt.jpg",
                fallback: "https://via.placeholder.com/300x400?text=White+Shirt",
                description: "Elegant white premium shirt",
                stock: 18
            },
            {
                id: 3,
                name: "Black Edition Premium",
                category: "women",
                price: 1300,
                sizes: ["M", "L"],
                image: "images/black-premium.jpg",
                fallback: "https://via.placeholder.com/300x400?text=Black+Premium",
                description: "Luxury black silk blend",
                stock: 12
            }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById("productsGrid");
            grid.innerHTML = "";

            products.forEach(product => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-image">
                            <img src="${product.image}" onerror="this.src='${product.fallback}'" alt="${product.name}">
                        </div>
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <p><strong>KES ${product.price}</strong></p>
                            <button class="btn btn-primary" onclick="addToCart(${product.id})">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            document.getElementById("cartBadge").innerText = cart.length;
            showNotification(`${product.name} added!`, "success");
        }

        function toggleCart() {
            document.getElementById("cartModal").classList.toggle("active");
        }

        function showNotification(msg, type) {
            const n = document.createElement("div");
            n.className = `notification ${type}`;
            n.innerText = msg;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }

        // Initialize
        renderProducts();
    </script>
</body>
</html>
