<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH Earning Network | Professional Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            position: relative;
            overflow-x: hidden;
            padding-bottom: 70px;
        }
        
        /* Background Effects */
        .animated-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
            background: radial-gradient(ellipse at top, #1e3a8a 0%, transparent 50%),
                        radial-gradient(ellipse at bottom, #7c3aed 0%, transparent 50%);
            opacity: 0.4;
        }
        
        .star {
            position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .content-wrapper { position: relative; z-index: 1; }
        
        /* Cards */
        .ultra-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 8px 32px -8px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .ultra-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px -12px rgba(99, 102, 241, 0.25);
        }

        .task-card {
            transition: all 0.3s ease;
        }

        .task-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px -12px rgba(99, 102, 241, 0.2) !important;
        }
        
        /* Header */
        .glass-header {
            background: rgba(10, 14, 39, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Buttons */
        .btn-premium {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            box-shadow: 0 8px 24px -6px rgba(99, 102, 241, 0.55);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -6px rgba(99, 102, 241, 0.7);
        }

        .btn-premium:active {
            transform: translateY(0);
        }
        
        /* Stats cards */
        .stats-card {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%) !important;
            color: white !important;
            box-shadow: 0 8px 28px -8px rgba(99, 102, 241, 0.5);
        }
        
        /* Mobile Nav */
        .mobile-nav {
            background: rgba(10, 14, 39, 0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4);
            z-index: 50;
        }
        
        .nav-item {
            color: #9ca3af;
            transition: color 0.2s, background-color 0.2s;
            flex: 1 1 0%;
            text-align: center;
            border-radius: 10px;
        }

        .nav-item.active {
            color: #818cf8;
            background: rgba(99, 102, 241, 0.12);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 3px; }

        /* Difficulty Badges — clearer contrast */
        .difficulty-easy   { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
        .difficulty-medium { background: #fef3c7; color: #78350f; border: 1px solid #fcd34d; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
        .difficulty-hard   { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }

        /* Status Badges */
        .status-pending_verification { background: #fef3c7; color: #78350f; border: 1px solid #fcd34d; font-weight: 700; font-size: 11px; }
        .status-in_progress          { background: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; font-weight: 700; font-size: 11px; }
        .status-completed            { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; font-weight: 700; font-size: 11px; }
        .status-rejected             { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; font-weight: 700; font-size: 11px; }

        /* Progress bar */
        .progress-bar {
            height: 6px;
            background: #e5e7eb;
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 99px;
            transition: width 0.6s ease;
        }

        /* Filter inputs */
        select, input[type="text"] {
            outline: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15) !important;
        }

        /* Notification dropdown — fixed position on all screens */
        #notifications-dropdown {
            position: fixed;
            top: 76px;
            right: 16px;
            left: auto;
            z-index: 100;
        }

        /* Alert — fixed top right, never goes full width on desktop */
        #status-alert {
            position: fixed;
            top: 76px;
            right: 16px;
            left: auto;
            max-width: 360px;
            width: calc(100vw - 32px);
            z-index: 100;
        }

        /* Modal icon */
        #action-modal {
            backdrop-filter: blur(6px);
        }

        /* Pulse animation for daily task badge */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .pulse { animation: pulse 2s ease-in-out infinite; }

        /* Fade in animation for cards */
        .fade-in-up {
            animation: fadeInUp 0.4s ease both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Achievement badge spacing */
        .achievement-badge { position: relative; }

        /* Line clamp */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive: tighter padding on very small screens */
        @media (max-width: 380px) {
            .ultra-card { border-radius: 14px; }
            main { padding-left: 12px !important; padding-right: 12px !important; }
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="animated-bg"></div>
    <div class="stars" id="stars-container"></div>
    
    <div class="content-wrapper">
        <header class="glass-header sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                            <i data-lucide="zap" class="w-7 h-7 text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-xl md:text-2xl font-black text-white">BTECH PRO</h1>
                            <p class="text-xs text-gray-300 font-medium">Earning Network</p>
                        </div>
                    </div>
                    
                    <nav class="hidden md:flex items-center space-x-6">

                            <i data-lucide="users" class="w-4 h-4"></i><span>Affiliate</span>

        </header>

        <div id="notifications-dropdown" class="hidden">
            <div class="ultra-card p-4">
                <h3 class="font-bold text-gray-800 mb-3 flex items-center justify-between">
                    <span>Notifications</span>

                <div class="space-y-3">
                    <div class="p-3 bg-blue-50 rounded-lg">

                    </div>
                    <div class="p-3 bg-green-50 rounded-lg">

                    </div>
                    <div class="p-3 bg-purple-50 rounded-lg">

                        <p class="text-xs text-gray-600 mt-1">You've completed 10 tasks</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="status-alert" class="hidden" role="alert">
            <div class="ultra-card p-4">
                <div class="flex items-center space-x-3">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" id="alert-icon-bg">
                        <i data-lucide="check-circle" class="w-6 h-6" id="alert-icon"></i>

        <main class="max-w-7xl mx-auto px-4 py-6">

        </main>

        <nav class="mobile-nav fixed bottom-0 left-0 right-0 z-40 md:hidden">
            <div class="flex justify-around items-center py-2 px-2 text-white">
                <button onclick="setRoute('tasks')" class="nav-item flex flex-col items-center space-y-1 py-1 px-2 rounded-xl transition" id="nav-tasks">
                    <i data-lucide="briefcase" class="w-6 h-6"></i>

                </button>
                <button onclick="setRoute('my-tasks')" class="nav-item flex flex-col items-center space-y-1 py-1 px-2 rounded-xl transition" id="nav-my-tasks">

                <button onclick="setRoute('achievements')" class="nav-item flex flex-col items-center space-y-1 py-1 px-2 rounded-xl transition" id="nav-achievements">

    <div id="action-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="ultra-card p-8 max-w-md w-full text-center">
            <div class="w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center" id="modal-icon-bg">
                <i id="modal-icon" data-lucide="check-circle" class="w-12 h-12"></i>

            <h3 id="modal-title" class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Success!</h3>
            <p id="modal-message" class="text-gray-600 text-sm md:text-base mb-6 leading-relaxed">Your action was completed successfully!</p>
            <button onclick="closeModal()" class="btn-premium text-white font-bold py-4 px-8 rounded-2xl w-full">
                Continue

<script>
    // ============================================
    // GLOBAL CONFIGURATION & STATE
    // ============================================
    const BACKEND_URL = "https://btech-earning-api.onrender.com/api";
    const FORMSPREE_SURVEY_URL = "https://formspree.io/f/mblolava";
    const REFERRAL_BONUS = 200.00;
    const LINKEDIN_PROFILE_URL = "https://linkedin.com/in/liam-lee-245a9736a";
    
    let AUTH_TOKEN;
    let cachedTasks = [];
    let userStats = {
        totalEarned: 0,
        availableBalance: 0,
        pendingEarnings: 0,
        tasksCompleted: 0,
        activeTasks: 0
    };
    let userProfile = {};
    let cache = {
        profileLoaded: false,
        statsLoaded: false
    };
    let currentFilters = {
        category: 'all',
        difficulty: 'all',
        search: ''
    };

    // Mock Task Definitions (Used as fallback/placeholders)
    const MOCK_TASK_DEFINITIONS = [
        { id: 1501, title: 'PRO Task: Executive Network Outreach (Liam Lee Profile)', description: 'Establish a professional connection with our Lead Strategist, Liam Lee, on LinkedIn to unlock future executive tasks. This requires genuine outreach and following specific profile guidelines.', category: 'Professional Networking & Outreach', payment: 250.00, estimatedTime: '10 minutes', difficulty: 'Easy', requiresVerification: true, deadline: '2025-12-31', tasksAvailable: 50, completionRate: 90, clientName: 'BTECH HR', featured: true, submission_type: 'IMAGE_URL', submission_guide: `1. Visit Liam Lee's LinkedIn: ${LINKEDIN_PROFILE_URL} | 2. Send Connection Request | 3. Upload screenshot of 'Request Pending' page.`, requires_admin_action: true },
        { id: 1502, title: 'WeChat Account Acquisition: KES 1,000 Payout', description: 'Sell us a valid, existing, or new WeChat account. Instant KES 1,000 credited upon successful validation by the admin.', category: 'Account Procurement', payment: 1000.00, estimatedTime: '5 minutes', difficulty: 'Easy', requiresVerification: true, deadline: '2025-12-31', tasksAvailable: 20, completionRate: 80, clientName: 'BTECH Acquisitions', submission_type: 'TEXT', submission_guide: 'Submit the account phone number and password separated by a newline.', requires_admin_action: true }
    ];

    // ============================================
    // GOOGLE AUTH HANDLER (Must be in global scope)
    // ============================================
    
    async function handleCredentialResponse(response) {
        if (response.credential) {
            showAlert('Google Sign-In successful. Syncing account...', true);
            
            try {
                const apiResponse = await fetch(`${BACKEND_URL}/auth/provision`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${response.credential}`
                    }
                });

                const data = await apiResponse.json();

                if (apiResponse.ok && data.success) {
                    showAlert(`Welcome, ${data.user.fullName || data.user.email}!`, true);
                    location.reload();
                } else {
                    showAlert(data.error || 'Account provisioning failed.', false);
                }
            } catch (error) {
                showAlert('Network error during provisioning.', false);
                console.error("Provisioning error:", error);
            }
        }
    }


    // ============================================
    // CORE UTILITIES (Must be defined early)
    // ============================================
    
    // Function required by initializeApp to run immediately
    function createStarField() {
        const container = document.getElementById('stars-container');
        if (!container) return;
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            container.appendChild(star);
        }
    }

    // Function required by HTML onclicks
    function showAlert(message, isSuccess = true) {
        const statusAlert = document.getElementById('status-alert');
        const iconBg = document.getElementById('alert-icon-bg');
        const icon = document.getElementById('alert-icon');
        const msg = document.getElementById('alert-message');
        
        iconBg.className = isSuccess ? 
            'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-green-100' : 
            'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-red-100';
        icon.className = isSuccess ? 'w-6 h-6 text-green-600' : 'w-6 h-6 text-red-600';
        icon.setAttribute('data-lucide', isSuccess ? 'check-circle' : 'alert-circle');
        
        msg.textContent = message;
        statusAlert.classList.remove('hidden');
        lucide.createIcons();
        
        setTimeout(() => {
            statusAlert.style.opacity = '0';
            setTimeout(() => {
                statusAlert.classList.add('hidden');
                statusAlert.style.opacity = '1';
            }, 300);
        }, 5000);
    }
    
    function closeAlert() { document.getElementById('status-alert').classList.add('hidden'); }
    
    function showModal(title, message, type = 'success') {
        const modal = document.getElementById('action-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalIconBg = document.getElementById('modal-icon-bg');
        const modalIcon = document.getElementById('modal-icon');
        
        modalTitle.textContent = title;
        modalMessage.textContent = message;
        
        let iconName = 'check-circle';
        let bgClass = 'bg-green-100';
        let iconClass = 'text-green-600';

        if (type === 'error') {
            iconName = 'alert-circle';
            bgClass = 'bg-red-100';
            iconClass = 'text-red-600';
        } else if (type === 'warning') {
            iconName = 'alert-triangle';
            bgClass = 'bg-yellow-100';
            iconClass = 'text-yellow-600';
        }
        
        modalIconBg.className = `w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center ${bgClass}`;
        modalIcon.className = `w-12 h-12 ${iconClass}`;
        modalIcon.setAttribute('data-lucide', iconName);
        
        modal.classList.remove('hidden');
        lucide.createIcons();
    }
    
    function closeModal() { document.getElementById('action-modal').classList.add('hidden'); }

    function simulateLogout(force = false) {
        localStorage.removeItem('btech_auth_token');
        if (force) {
            showAlert("Session expired. Please re-login.", false);
        } else {
            showAlert("Logged out successfully!", true);
        }
        setTimeout(() => window.location.reload(), 1500);
    }
    
    function updateMobileNav(route) {
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.classList.remove('active');
            item.querySelector('span').classList.remove('text-indigo-500');
        });
        
        const baseRoute = route.split('/')[0];
        const activeNav = document.getElementById(`nav-${baseRoute}`);
        if (activeNav) {
            activeNav.classList.add('active');
            activeNav.querySelector('span').classList.add('text-indigo-500');
        }
    }
    
    // --- Data Rendering Helpers ---
    function getCategoryIcon(category) {
        const icons = { 'Survey': 'clipboard-list', 'Professional Networking & Outreach': 'linkedin', 'Account Procurement': 'message-circle-code', 'Data Entry': 'database', 'Account Connection': 'link' };
        return icons[category] || 'briefcase';
    }

    function getTaskPayout(task) {
        const value = task.payment || task.payout;
        return typeof value === 'string' ? value : parseFloat(value || 0).toFixed(2);
    }

    function getTaskDifficulty(task) {
        return (task.difficulty || 'Easy').toLowerCase();
    }

    function showWithdrawalModal() {
        showModal('Withdrawal Request', 'Contact admin to process your withdrawal. Min amount: KES 500', 'warning');
    }


    // ============================================
    // API HELPERS & DATA FETCHING
    // ============================================
    
    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN) throw new Error('Authentication token missing.');

        const config = {
            method: options.method || 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${AUTH_TOKEN}`,
                ...options.headers
            },
            ...(options.body && { body: JSON.stringify(options.body) }),
        };

        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`, config);
            const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));
            
            if (!response.ok || !data.success) {
                if (response.status === 401 || response.status === 403) {
                    simulateLogout(true); 
                }
                throw new Error(data.error || `API Error: ${response.status}`);
            }
            return data;
        } catch (error) {
            console.error('API Error:', error.message);
            throw error;
        }
    }

    async function fetchUserProfile() {
        if (cache.profileLoaded) return;
        try {
            const result = await fetchData('/user/profile', { method: 'GET' });
            if (result.success && result.user) {
                userProfile = result.user;
                cache.profileLoaded = true;
            }
        } catch (error) {

    // Located in DASHBOARD.HTML
async function acceptTask(taskId) {
    try {
        showAlert('Accepting task...', true);
        const response = await fetchData(`/tasks/${taskId}/accept`, { method: 'POST' });
        
        // --- CRITICAL REDIRECTION LOGIC START ---
        
        if (response.message.includes('already in your active list')) {
            showModal('Task Already Active!', 'This task is already in your "My Tasks" list. We are refreshing to the detail screen.', 'warning');
        } else {
            showModal('Task Accepted!', 'You can now start working on this task. Loading details...', 'success');
        }
        
        // 1. Force the URL into the clean 'detail' state:
        // Clear both search and hash, then set the query parameter for the detail page.
        // This forces a complete re-initialization on reload.
        window.location.search = `?taskid=${taskId}`;
        window.location.hash = ''; 
        
        // 2. Schedule the reload after the modal closes.
        setTimeout(() => {
            closeModal();
            // Reloads the page, which triggers initializeApp() and hits the ?taskid= logic.
            window.location.reload(); 
        }, 2000);
        
        // --- CRITICAL REDIRECTION LOGIC END ---

    } catch (error) {
        // If the server returns a 402/error (e.g., Registration Fee Required)
        showAlert(error.message, false);
    }
}

    // Generic handler for TEXT, IMAGE_URL, and BOTH submissions
    async function submitGenericFileTask(taskId, type) {
        const textInput = document.getElementById(`submission-text-field-${taskId}`);
        const fileInput = document.getElementById(`submission-file-input-${taskId}`);
        const submitBtn = document.getElementById(`submit-btn-generic-${taskId}`);
        
        let accountsList = [];
        let commonPassword = '';
        
        // 1. Handle Text Input
        if (type === 'TEXT' || type === 'BOTH') {
            const textValue = textInput?.value?.trim();
            if (!textValue) {
                showAlert('Text submission field is required.', false);
                return;
            }
            // accountsList stores the visible submission (links, accounts)
            accountsList.push(textValue);
            if (type === 'TEXT') commonPassword = textValue; // Use text as payload ref for text-only
        }
        
        // 2. Handle File Input (Base64 conversion)
        if (type === 'IMAGE_URL' || (type === 'BOTH' && fileInput?.files.length > 0)) {
            if (!fileInput || !fileInput.files.length) {
                showAlert('Image/Screenshot proof is required.', false);
                return;
            }
            const file = fileInput.files[0];
            if (file.size > 5 * 1024 * 1024) {
                showAlert('File size must be less than 5MB.', false);
                return;
            }
            
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Uploading...</span>';
                lucide.createIcons();
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                commonPassword = e.target.result.split(',')[1]; // Base64 data (payload)
                if (type === 'IMAGE_URL') accountsList.push(`File Name: ${file.name}`);
                await sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn);
            };
            reader.onerror = (e) => {
                showAlert('Failed to read file.', false);
                if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Task for Review</span>'; lucide.createIcons(); }
            };
            reader.readAsDataURL(file);
            return;
        }

        // 3. Send Submission for Text-Only (or if BOTH with no file - though file check should prevent this)
        await sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn);
    }

    async function sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn) {
        try {
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Submitting...</span>';
                lucide.createIcons();
            }

            await fetchData(`/tasks/submit-gmail-accounts`, {
                method: 'POST',
                body: { taskId, accountsList, commonPassword }
            });

            showModal('Submission Sent!', 'Your task submission has been received and is under admin review.', 'success');
            
            setTimeout(() => {
                closeModal();
                setRoute('my-tasks');
            }, 2500);

        } catch (error) {
            showAlert(error.message, false);
        } finally {
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Task for Review</span>';
                lucide.createIcons();
            }
        }
    }

    async function submitDailySurvey(taskId) {
        const form = document.getElementById(`survey-form-${taskId}`);
        const formData = new FormData(form);
        const surveyData = Object.fromEntries(formData);
        
        if (!surveyData.satisfaction || !surveyData.ease_of_finding || !surveyData.suggestions) {
            showAlert('Please answer all questions.', false);
            return;
        }
        
        try {
            showAlert('Submitting survey...', true);
            
            // Send to Formspree for visibility (optional, data is also processed below)
            await fetch(FORMSPREE_SURVEY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

            });
            
            // Send to backend for credit
            const response = await fetchData(`/tasks/submit-daily-task`, {
                method: 'POST',

            });
            
            showModal('Survey Submitted!', response.message, 'success');

                closeModal();
                setRoute('tasks');
            }, 2500);
        } catch (error) {
            showAlert(error.message, false);
        }
    }

async function renderTaskDetail(taskId) {
    const numericTaskId = parseInt(taskId);
    let task = null;
    let userTaskStatus = null;

    // 1. Fetch "My Tasks" (Your accepted list)
    // We check here FIRST because if you are clicking "Continue", it's likely here.
    try {
        const myTasksData = await fetchData('/tasks/my-tasks');
        const myTaskEntry = myTasksData.tasks.find(t => t.taskId === numericTaskId);
        
        if (myTaskEntry) {
            // FOUND IN MY TASKS!
            // Map the API fields to the Dashboard fields
            task = {
                id: myTaskEntry.taskId,
                title: myTaskEntry.title,
                description: myTaskEntry.description, // Now available thanks to Step 1
                category: myTaskEntry.category,
                payment: myTaskEntry.payment,
                estimatedTime: myTaskEntry.estimatedTime,
                difficulty: myTaskEntry.difficulty,
                deadline: myTaskEntry.deadline,
                submission_type: myTaskEntry.submission_type,
                submission_guide: myTaskEntry.submission_guide,
                
                // Status info
                status: myTaskEntry.status,
                startedDate: myTaskEntry.startedDate
            };
            userTaskStatus = myTaskEntry.status;
            console.log("Found task in My Tasks history.");
        }
    } catch (e) {
        console.warn("Could not fetch user history:", e);
    }

    // 2. If NOT found in My Tasks, check "Available/Cached"
    if (!task) {
        task = cachedTasks.find(t => t.id === numericTaskId) || MOCK_TASK_DEFINITIONS.find(t => t.id === numericTaskId);
        
        if (!task) {
            // Try fetching available one last time
            try {
                const tasksData = await fetchData('/tasks/available');
                cachedTasks = tasksData.tasks;
                task = cachedTasks.find(t => t.id === numericTaskId);
            } catch (e) {}
        }
    }
    
    // 3. FINAL CHECK: If still missing, we really can't show it.
    if (!task || !task.title) {
        showAlert('Task details unavailable. It may have expired.', false);
        setRoute('tasks');
        return;
    }
    
    // 4. Render Logic (Same as before)
    const payoutText = typeof task.payment === 'string' ? task.payment : `KES ${getTaskPayout(task)}`;
    const statusClass = userTaskStatus ? `status-${userTaskStatus.toLowerCase()}` : 'bg-gray-400';
    const statusText = userTaskStatus ? userTaskStatus.replace('_', ' ') : 'NOT ACCEPTED';
    
    let submissionSection;
    if (userTaskStatus === 'COMPLETED') {
        submissionSection = `
            <div class="text-center py-8 text-gray-600 bg-green-50 rounded-xl border-2 border-green-200">
                <i data-lucide="check-circle" class="w-16 h-16 mx-auto mb-4 text-green-500"></i>
                <p class="font-bold text-green-800">Task Completed!</p>
                <p>You have successfully finished this task.</p>
            </div>`;
    } else if (userTaskStatus === 'PENDING_VERIFICATION') {
        submissionSection = `
            <div class="text-center py-8 text-gray-600 bg-yellow-50 rounded-xl border-2 border-yellow-200">
                <i data-lucide="clock" class="w-16 h-16 mx-auto mb-4 text-yellow-500"></i>
                <p class="font-bold text-yellow-800">Awaiting Review</p>
                <p>Your submission is being reviewed by the admin.</p>

    } else if (userTaskStatus === 'REJECTED') {
        submissionSection = `
            <div class="text-center py-8 text-gray-600 bg-red-50 rounded-xl border-2 border-red-200 mb-6">

function renderSubmissionForm(task) {
    // 1. CHECK IF TASK HAS BEEN ACCEPTED BY THE USER
    // If status is NOT IN_PROGRESS or REJECTED or PENDING_VERIFICATION, the user hasn't started yet.
    if (task.status !== 'IN_PROGRESS' && task.status !== 'REJECTED' && task.status !== 'PENDING_VERIFICATION') {
        return `
            <h3 class="text-xl md:text-2xl font-black text-gray-800 mb-6 flex items-center">
                <i data-lucide="play-circle" class="w-6 h-6 mr-3 text-indigo-600"></i>
                Start Task
            </h3>
            <div class="text-center py-8 text-gray-600">
                <p class="mb-4">Click below to reserve the slot and proceed to the submission form.</p>
                <button onclick="acceptTask(${task.id})" class="btn-premium text-white font-bold py-4 px-8 rounded-2xl">
                    Accept Task Now
                </button>
            </div>
        `;
    }

    // 2. DEFINE CORE PARAMETERS (ROBUST CHECK)
    // FIX: Check both snake_case (DB) and camelCase (API wrapper) to ensure we capture the type.
    let rawType = task.submission_type || task.submissionType || 'NONE';
    const type = (rawType !== 'NONE') ? rawType : 'NONE';
    
    const guide = task.submission_guide || task.submissionGuide || 'Please follow the instructions in the task description.';
    const taskId = task.id || task.taskId; // Handle ID variations too
    
    // 3. HANDLE SPECIAL CASE: SURVEYS/DAILY TASKS
    if (taskId == 1 || task.category === 'Survey') {
        return renderDailySurveyForm(taskId);
    }
    
    // 4. HANDLE EXPLICIT NON-SUBMISSION TASKS (type === 'NONE')
    if (type === 'NONE') {
        return `

    }

    // 5. RENDER GENERIC SUBMISSION FORM (TEXT, IMAGE_URL, or BOTH)
    let submissionHtml = '';
    // We pass the 'type' explicitly to the submit handler
    let formAction = `submitGenericFileTask(${taskId}, '${type}')`;
    
    // --- Render Text/Link Field ---
    if (type === 'TEXT' || type === 'BOTH') {
        const textLabel = (type === 'TEXT') ? '1.' : 'A.';
        submissionHtml += `
            <div class="mb-5 md:mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">${textLabel} Text/Link/Credential Submission:</label>

        const fileUploadBlock = `

    // ============================================
    // FILTERING & SEARCH LOGIC
    // ============================================
    
    function applyFilters() {
        const categoryFilter = document.getElementById('category-filter')?.value || 'all';
        const difficultyFilter = document.getElementById('difficulty-filter')?.value || 'all';
        const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
        
        currentFilters = { category: categoryFilter, difficulty: difficultyFilter, search: searchTerm };
        
        const filteredTasks = cachedTasks.filter(task => {
            const matchesCategory = categoryFilter === 'all' || task.category === categoryFilter;
            const matchesDifficulty = difficultyFilter === 'all' || getTaskDifficulty(task) === difficultyFilter.toLowerCase();
            const matchesSearch = searchTerm === '' || task.title.toLowerCase().includes(searchTerm) || task.description.toLowerCase().includes(searchTerm);
            
            return matchesCategory && matchesDifficulty && matchesSearch;
        });
        
        renderFilteredTasks(filteredTasks);
    }

    function renderFilteredTasks(tasks) {
        const container = document.getElementById('tasks-grid');
        if (!container) return;
        
        if (tasks.length === 0) {
            container.innerHTML = `
                <div class="ultra-card p-8 md:p-12 text-center lg:col-span-3">
                    <i data-lucide="search-x" class="w-16 h-16 md:w-20 md:h-20 text-gray-400 mx-auto mb-4"></i>
                    <h3 class="text-xl font-black text-gray-800">No Tasks Found</h3>
                    <p class="text-gray-600 text-sm mt-2">Try adjusting your filters or search terms.</p>
                    <button onclick="resetFilters()" class="btn-premium text-white font-semibold py-3 px-6 rounded-xl mt-4">
                        Reset Filters
                    </button>
                </div>
            `;
            lucide.createIcons();
            return;
        }
        
        container.innerHTML = tasks.map((task, i) => renderTaskCard(task, i)).join('');
        lucide.createIcons();
    }

    function resetFilters() {
        if (document.getElementById('category-filter')) document.getElementById('category-filter').value = 'all';
        if (document.getElementById('difficulty-filter')) document.getElementById('difficulty-filter').value = 'all';
        if (document.getElementById('search-input')) document.getElementById('search-input').value = '';
        applyFilters();
    }

    // Located in DASHBOARD.HTML

async function loadContent() {
    const appContainer = document.getElementById('app-container');
    appContainer.innerHTML = `
        <div class="flex items-center justify-center py-20">
            <div class="text-center">
                <i data-lucide="loader-2" class="w-12 h-12 md:w-16 md:h-16 text-white animate-spin mx-auto mb-4"></i>
                <p class="text-white font-bold text-sm md:text-base">Loading your dashboard...</p>
            </div>
        </div>
    `;
    lucide.createIcons();

    try {
        // A. ESSENTIAL PREREQUISITES: Fetch user profile, stats, and ALL available tasks first.
        const [profileData, statsData, tasksData, dailyTaskData] = await Promise.all([
            fetchUserProfile().catch(e => { console.warn("Profile load failed:", e); return null; }),
            fetchUserStats().catch(e => { console.warn("Stats load failed:", e); return null; }),
            fetchData('/tasks/available').catch(e => { // CRITICAL FETCH
                console.warn("Tasks fetch failed, using mock:", e.message);
                return { tasks: MOCK_TASK_DEFINITIONS, success: true };
            }),
            fetchDailyTask(),
        ]);

        // B. Populate Global Cache
        cachedTasks = tasksData.tasks;
        
        if (dailyTaskData && dailyTaskData.id) {
            localStorage.setItem('dailyTask', JSON.stringify(dailyTaskData));
        } else {
            localStorage.removeItem('dailyTask');
        }

        // C. ROUTE HANDLING: Now that cachedTasks is GUARANTEED to be populated, we route.
        const hash = window.location.hash.slice(1);
        const route = hash || 'tasks';

        if (route === 'tasks') {
            renderTasksList(cachedTasks, dailyTaskData);
        } else if (route === 'my-tasks') {
            const myTasksData = await fetchData('/tasks/my-tasks');
            renderMyTasks(myTasksData.tasks);
        } else if (route === 'earnings') {
            renderEarnings();
        } else if (route === 'affiliate') {
            renderAffiliateProfile();
        } else if (route === 'achievements') {
            renderAchievements();
        } else if (route.startsWith('tasks/')) {
            const taskId = route.split('/')[1];
            // Since cachedTasks is populated, this should successfully find the task details.
            await renderTaskDetail(taskId); 
        }
    } catch (error) {
        console.error("Critical Load Error:", error);
        if (!AUTH_TOKEN) return;
        
        // Fallback error UI
        appContainer.innerHTML = `
            <div class="ultra-card p-8 md:p-12 text-center mt-12">
                <i data-lucide="wifi-off" class="w-20 h-20 text-red-500 mx-auto mb-4"></i>
                <h3 class="text-2xl font-black text-red-600 mb-3">Connection Error</h3>
                <p class="text-gray-600 mb-6">Unable to load dashboard data. Please check your connection and try again.</p>
                <button onclick="location.reload()" class="btn-premium text-white font-bold py-4 px-8 rounded-xl">
                    <i data-lucide="refresh-cw" class="w-5 h-5 inline mr-2"></i>
                    Retry
                </button>
            </div>
        `;
        lucide.createIcons();
    }
}


    // Located in DASHBOARD.HTML
async function initializeApp() {
    createStarField();
    
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('token');
    
    // --- Authentication Logic ---
    if (urlToken) {
        AUTH_TOKEN = urlToken;
        localStorage.setItem('btech_auth_token', AUTH_TOKEN);
    } else if (localStorage.getItem('btech_auth_token')) {
        AUTH_TOKEN = localStorage.getItem('btech_auth_token');
    }
    
    if (!AUTH_TOKEN || AUTH_TOKEN.length < 100) {
        renderSignInScreen();
        return;
    }
    
    // --- Query Parameter Handling for Direct Task Detail ---
    const taskIdFromUrl = params.get('taskid');

    if (taskIdFromUrl) {
        // 1. Force navigation state update (removes the ?taskid= part)
        // We replace the state and ensure the page is clean before rendering.
        window.history.replaceState(null, null, window.location.pathname + window.location.hash);
        
        // 2. Set the navigation bar to 'tasks' for visual consistency
        updateMobileNav('tasks'); 
        
        // 3. Immediately render the specific task detail using the ID
        // The renderTaskDetail function is responsible for the necessary data fetches.
        await renderTaskDetail(taskIdFromUrl); 
        
        return; // STOP execution of the rest of the router
    }
    
    // --- Standard Hash Routing ---
    
    // Clean up old token parameters if present in search but no taskid was found
    if (window.location.search) {
        window.history.replaceState(null, null, window.location.pathname + window.location.hash);
    }

    const hash = window.location.hash.slice(1);
    updateMobileNav(hash || 'tasks');
    
    // Load content based on hash if no query parameter was present
    await loadContent();
}
