<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH Earning Network | Professional Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            position: relative;
            overflow-x: hidden;
            padding-bottom: 70px; /* Space for mobile nav */
        }
        
        /* --- Background Effects --- */
        .animated-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
            background: radial-gradient(ellipse at top, #1e3a8a 0%, transparent 50%),
                        radial-gradient(ellipse at bottom, #7c3aed 0%, transparent 50%);
            opacity: 0.4;
        }
        
        .star {
            position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .content-wrapper { position: relative; z-index: 1; }
        
        /* --- Enhanced Card Styles --- */
        .ultra-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        
        .ultra-card:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 25px 70px -15px rgba(99, 102, 241, 0.3);
        }

        .task-card {
            transition: all 0.3s ease;
        }

        .task-card:hover {
            transform: translateY(-5px);
        }
        
        .glass-header {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        /* --- Gradient Effects --- */
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            background-size: 200% 200%;
        }
        
        .btn-premium {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px -10px rgba(99, 102, 241, 0.8);
        }
        
        .stats-card {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            color: white !important;
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.6);
        }
        
        /* --- Mobile Navigation --- */
        .mobile-nav {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
            z-index: 50; /* Ensure it's above other content */
        }
        
        .nav-item {
            color: #9ca3af; /* Gray-400 */
            transition: color 0.2s, background-color 0.2s;
            flex: 1 1 0%;
            text-align: center;
        }

        .nav-item.active {
            color: #6366f1; /* Indigo-500 */
            background: rgba(99, 102, 241, 0.1);
        }

        /* --- Scrollbar Styling (Optimized) --- */
        ::-webkit-scrollbar {
            width: 8px; height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="animated-bg"></div>
    <div class="stars" id="stars-container"></div>
    
    <div class="content-wrapper">
        <header class="glass-header sticky top-0 z-50">

        <div id="notifications-dropdown" class="hidden fixed top-20 right-4 z-50 w-80 max-w-[calc(100vw-2rem)] fade-in-up">
            <div class="ultra-card p-4">
                <h3 class="font-bold text-gray-800 mb-3 flex items-center justify-between">
                    <span>Notifications</span>

                    <div class="p-3 bg-blue-50 rounded-lg">
                        <p class="text-sm font-semibold text-gray-800">New Task Available!</p>
                        <p class="text-xs text-gray-600 mt-1">A high-paying task just opened up</p>
                    </div>
                    <div class="p-3 bg-green-50 rounded-lg">
                        <p class="text-sm font-semibold text-gray-800">Payment Processed</p>
                        <p class="text-xs text-gray-600 mt-1">KES 500 added to your balance</p>
                    </div>
                    <div class="p-3 bg-purple-50 rounded-lg">
                        <p class="text-sm font-semibold text-gray-800">Achievement Unlocked!</p>

        <div id="status-alert" class="hidden fixed top-20 right-4 left-4 md:left-auto md:right-4 z-50 max-w-md fade-in-up" role="alert">
            <div class="ultra-card p-4">
                <div class="flex items-center space-x-3">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" id="alert-icon-bg">
                        <i data-lucide="check-circle" class="w-6 h-6" id="alert-icon"></i>
                    </div>
                    <p class="font-semibold text-gray-800 flex-1" id="alert-message"></p>
                    <button onclick="closeAlert()" class="text-gray-400 hover:text-gray-600">

        <main class="max-w-7xl mx-auto px-4 py-6">
            <div id="app-container"></div>
        </main>

        <nav class="mobile-nav fixed bottom-0 left-0 right-0 z-40 md:hidden">
            <div class="flex justify-around items-center py-2 px-2 text-white">
                <button onclick="setRoute('tasks')" class="nav-item flex flex-col items-center space-y-1 py-1 px-2 rounded-xl transition" id="nav-tasks">
                    <i data-lucide="briefcase" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Tasks</span>
                </button>

                    <i data-lucide="list-checks" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">My Tasks</span>
                </button>
                <button onclick="setRoute('earnings')" class="nav-item flex flex-col items-center space-y-1 py-1 px-2 rounded-xl transition" id="nav-earnings">
                    <i data-lucide="wallet" class="w-6 h-6"></i>

                    <i data-lucide="users" class="w-6 h-6"></i>

                </button>
                <button onclick="setRoute('achievements')" class="nav-item flex flex-col items-center space-y-1 py-1 px-2 rounded-xl transition" id="nav-achievements">

    <div id="action-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="ultra-card p-8 max-w-md w-full text-center fade-in-up">
            <div class="w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center" id="modal-icon-bg">
                <i id="modal-icon" data-lucide="check-circle" class="w-12 h-12"></i>
            </div>
            <h3 id="modal-title" class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Success!</h3>
            <p id="modal-message" class="text-gray-600 text-sm md:text-base mb-6 leading-relaxed">Your action was completed successfully!</p>
            <button onclick="closeModal()" class="btn-premium text-white font-bold py-4 px-8 rounded-2xl w-full">
                Continue
            </button>
        </div>
    </div>

<script>
    // ============================================
    // GLOBAL CONFIGURATION & STATE
    // ============================================
    const BACKEND_URL = "https://btech-earning-api.onrender.com/api";
    const FORMSPREE_SURVEY_URL = "https://formspree.io/f/mblolava";
    const REFERRAL_BONUS = 200.00;
    
    let AUTH_TOKEN;
    let cachedTasks = [];
    let userStats = {
        totalEarned: 0,
        availableBalance: 0,
        pendingEarnings: 0,
        tasksCompleted: 0,
        activeTasks: 0
    };
    let userProfile = {};
    let cache = {
        profileLoaded: false,
        statsLoaded: false
    };
    let currentFilters = {
        category: 'all',
        difficulty: 'all',
        search: ''
    };

    // Mock Task Definitions (Used as fallback/placeholders)
    const MOCK_TASK_DEFINITIONS = [
        { id: 1, title: 'Daily App Feedback Survey', description: 'Quick 2-minute feedback survey about your platform experience. Instant KES 50 reward.', category: 'Survey', payment: 50.00, estimatedTime: '2 minutes', difficulty: 'Easy', requiresVerification: false, deadline: '2025-11-30', tasksAvailable: 1, completionRate: 99, clientName: 'BTECH Internal', featured: true, submission_type: 'NONE', submission_guide: null },
        { id: 1501, title: 'LinkedIn Network Builder: Connect to Liam Lee', description: 'Connect your existing or new LinkedIn account to the specified target profile. Submission requires a screenshot of the sent request.', category: 'Account Connection', payment: 0.00, estimatedTime: '10 minutes', difficulty: 'Easy', requiresVerification: true, deadline: '2025-12-31', tasksAvailable: 50, completionRate: 90, clientName: 'BTECH HR', featured: true, submission_type: 'IMAGE_URL', submission_guide: 'Upload a screenshot of the sent connection request.' },
        { id: 1502, title: 'WeChat Account Acquisition: KES 1,000 Payout', description: 'Sell us a valid, existing, or new WeChat account. Instant KES 1,000 credited upon successful validation by the admin.', category: 'Account Procurement', payment: 1000.00, estimatedTime: '5 minutes', difficulty: 'Easy', requiresVerification: true, deadline: '2025-12-31', tasksAvailable: 20, completionRate: 80, clientName: 'BTECH Acquisitions', submission_type: 'TEXT', submission_guide: 'Submit the account phone number and password separated by a newline.' }
    ];

    // ============================================
    // API HELPERS & DATA FETCHING
    // ============================================
    
    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN) throw new Error('Authentication token missing.');

        const config = {
            method: options.method || 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${AUTH_TOKEN}`,
                ...options.headers
            },
            ...(options.body && { body: JSON.stringify(options.body) }),
        };

        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`, config);
            const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));
            
            if (!response.ok || !data.success) {
                if (response.status === 401 || response.status === 403) {
                    // Force re-login on token expiration
                    simulateLogout(true); 
                }
                throw new Error(data.error || `API Error: ${response.status}`);
            }
            return data;
        } catch (error) {
            console.error('API Error:', error.message);
            throw error;
        }
    }

    async function fetchUserProfile() {
        if (cache.profileLoaded) return;
        try {
            const result = await fetchData('/user/profile', { method: 'GET' });
            if (result.success && result.user) {
                userProfile = result.user;
                cache.profileLoaded = true;
            }
        } catch (error) {
            console.warn("Profile fetch failed:", error.message);
        }
    }
    
    async function fetchUserStats() {
        if (cache.statsLoaded) return;
        try {
            const earningsData = await fetchData('/earnings/summary');
            const myTasksData = await fetchData('/tasks/my-tasks');

            userStats.totalEarned = parseFloat(earningsData.earnings.totalEarnings || 0);
            userStats.availableBalance = parseFloat(earningsData.earnings.availableBalance || 0);
            userStats.pendingEarnings = parseFloat(earningsData.earnings.pendingEarnings || 0);
            userStats.tasksCompleted = parseInt(earningsData.earnings.completedTasks || 0);
            userStats.activeTasks = myTasksData.tasks.filter(t => 
                t.status === 'IN_PROGRESS' || t.status === 'PENDING_VERIFICATION'
            ).length;
            
            cache.statsLoaded = true;
        } catch (e) {
            console.warn("Stats fetch failed, using defaults:", e.message);
            userStats = { totalEarned: 0, availableBalance: 0, pendingEarnings: 0, tasksCompleted: 0, activeTasks: 0 };
        }
    }

    async function fetchDailyTask() {
        try {
            const data = await fetchData('/tasks/daily', { method: 'GET' });
            return data.task;
        } catch (error) {
            console.warn("Daily task fetch failed, using mock:", error.message);
            return MOCK_TASK_DEFINITIONS.find(t => t.id === 1) || null;
        }
    }

    // ============================================
    // UI UTILITIES
    // ============================================
    
    function showAlert(message, isSuccess = true) {
        // Implementation remains as in original code
        const statusAlert = document.getElementById('status-alert');
        const iconBg = document.getElementById('alert-icon-bg');
        const icon = document.getElementById('alert-icon');
        const msg = document.getElementById('alert-message');
        
        iconBg.className = isSuccess ? 
            'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-green-100' : 
            'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-red-100';
        icon.className = isSuccess ? 'w-6 h-6 text-green-600' : 'w-6 h-6 text-red-600';
        icon.setAttribute('data-lucide', isSuccess ? 'check-circle' : 'alert-circle');
        
        msg.textContent = message;
        statusAlert.classList.remove('hidden');
        lucide.createIcons();
        
        setTimeout(() => {
            statusAlert.style.opacity = '0';
            setTimeout(() => {
                statusAlert.classList.add('hidden');
                statusAlert.style.opacity = '1';
            }, 300);
        }, 5000);
    }
    
    function closeAlert() { document.getElementById('status-alert').classList.add('hidden'); }
    
    function showModal(title, message, type = 'success') {
        const modal = document.getElementById('action-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalIconBg = document.getElementById('modal-icon-bg');
        const modalIcon = document.getElementById('modal-icon');
        
        modalTitle.textContent = title;
        modalMessage.textContent = message;
        
        let iconName = 'check-circle';
        let bgClass = 'bg-green-100';
        let iconClass = 'text-green-600';

        if (type === 'error') {
            iconName = 'alert-circle';
            bgClass = 'bg-red-100';
            iconClass = 'text-red-600';
        } else if (type === 'warning') {
            iconName = 'alert-triangle';
            bgClass = 'bg-yellow-100';
            iconClass = 'text-yellow-600';
        }
        
        modalIconBg.className = `w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center ${bgClass}`;
        modalIcon.className = `w-12 h-12 ${iconClass}`;
        modalIcon.setAttribute('data-lucide', iconName);
        
        modal.classList.remove('hidden');
        lucide.createIcons();
    }
    
    function closeModal() { document.getElementById('action-modal').classList.add('hidden'); }

    function simulateLogout(force = false) {
        localStorage.removeItem('btech_auth_token');
        if (force) {
            showAlert("Session expired. Please re-login.", false);
        } else {
            showAlert("Logged out successfully!", true);
        }
        setTimeout(() => window.location.reload(), 1500);
    }
    
    function setRoute(path) {
        window.location.hash = `#${path}`;
        updateMobileNav(path);
        loadContent();
    }

    function updateMobileNav(route) {
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.classList.remove('active');
            item.querySelector('span').classList.remove('text-indigo-500');
        });
        
        const baseRoute = route.split('/')[0];
        const activeNav = document.getElementById(`nav-${baseRoute}`);
        if (activeNav) {
            activeNav.classList.add('active');
            activeNav.querySelector('span').classList.add('text-indigo-500');
        }
    }

    // --- Data Rendering Helpers ---
    function getCategoryIcon(category) {
        const icons = { 'Survey': 'clipboard-list', 'Account Connection': 'linkedin', 'Account Procurement': 'message-circle-code', 'Data Entry': 'database' };
        return icons[category] || 'briefcase';
    }

    function getTaskPayout(task) {
        const value = task.payment || task.payout;
        return typeof value === 'string' ? value : parseFloat(value || 0).toFixed(2);
    }

    function getTaskDifficulty(task) {
        return (task.difficulty || 'Easy').toLowerCase();
    }

    // ============================================
    // FILTERING & SEARCH LOGIC
    // ============================================
    
    function applyFilters() {
        const categoryFilter = document.getElementById('category-filter')?.value || 'all';
        const difficultyFilter = document.getElementById('difficulty-filter')?.value || 'all';
        const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
        
        currentFilters = { category: categoryFilter, difficulty: difficultyFilter, search: searchTerm };
        
        const filteredTasks = cachedTasks.filter(task => {
            const matchesCategory = categoryFilter === 'all' || task.category === categoryFilter;
            const matchesDifficulty = difficultyFilter === 'all' || getTaskDifficulty(task) === difficultyFilter.toLowerCase();
            const matchesSearch = searchTerm === '' || task.title.toLowerCase().includes(searchTerm) || task.description.toLowerCase().includes(searchTerm);
            
            return matchesCategory && matchesDifficulty && matchesSearch;
        });
        
        renderFilteredTasks(filteredTasks);
    }

    function renderFilteredTasks(tasks) {
        const container = document.getElementById('tasks-grid');
        if (!container) return;
        
        if (tasks.length === 0) {
            container.innerHTML = `
                <div class="ultra-card p-8 md:p-12 text-center lg:col-span-3">
                    <i data-lucide="search-x" class="w-16 h-16 md:w-20 md:h-20 text-gray-400 mx-auto mb-4"></i>
                    <h3 class="text-xl font-black text-gray-800">No Tasks Found</h3>
                    <p class="text-gray-600 text-sm mt-2">Try adjusting your filters or search terms.</p>
                    <button onclick="resetFilters()" class="btn-premium text-white font-semibold py-3 px-6 rounded-xl mt-4">
                        Reset Filters
                    </button>
                </div>
            `;
            lucide.createIcons();
            return;
        }
        
        container.innerHTML = tasks.map((task, i) => renderTaskCard(task, i)).join('');
        lucide.createIcons();
    }

    function resetFilters() {
        if (document.getElementById('category-filter')) document.getElementById('category-filter').value = 'all';
        if (document.getElementById('difficulty-filter')) document.getElementById('difficulty-filter').value = 'all';
        if (document.getElementById('search-input')) document.getElementById('search-input').value = '';
        applyFilters();
    }

    // ============================================
    // TASK ACTION HANDLERS
    // ============================================

    async function acceptTask(taskId) {
        try {
            showAlert('Accepting task...', true);
            await fetchData(`/tasks/${taskId}/accept`, { method: 'POST' });
            showModal('Task Accepted!', 'You can now start working on this task.', 'success');
            setTimeout(() => {
                closeModal();
                setRoute(`tasks/${taskId}`);
            }, 2000);
        } catch (error) {
            showAlert(error.message, false);
        }
    }

    function acceptAndNavigateToSurvey(taskId) {
        acceptTask(taskId);
    }

    // Generic handler for TEXT, IMAGE_URL, and BOTH submissions
    async function submitGenericFileTask(taskId, type) {
        const textInput = document.getElementById(`submission-text-field-${taskId}`);
        const fileInput = document.getElementById(`submission-file-input-${taskId}`);
        const submitBtn = document.getElementById(`submit-btn-generic-${taskId}`);
        
        let accountsList = [];
        let commonPassword = '';
        
        // 1. Handle Text Input
        if (type === 'TEXT' || type === 'BOTH') {
            const textValue = textInput?.value?.trim();
            if (!textValue) {
                showAlert('Text submission field is required.', false);
                return;
            }
            accountsList.push(textValue);
            if (type === 'TEXT') commonPassword = textValue; // Use text as payload ref for text-only
        }
        
        // 2. Handle File Input (Base64 conversion)
        if (type === 'IMAGE_URL' || (type === 'BOTH' && fileInput?.files.length > 0)) {
            if (!fileInput || !fileInput.files.length) {
                showAlert('Image/Screenshot proof is required.', false);
                return;
            }
            const file = fileInput.files[0];
            if (file.size > 5 * 1024 * 1024) {
                showAlert('File size must be less than 5MB.', false);
                return;
            }
            
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Uploading...</span>';
                lucide.createIcons();
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                commonPassword = e.target.result.split(',')[1]; // Base64 data (payload)
                accountsList.push(`File Name: ${file.name}`);
                await sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn);
            };
            reader.onerror = (e) => {
                showAlert('Failed to read file.', false);
                if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Task for Review</span>'; lucide.createIcons(); }
            };
            reader.readAsDataURL(file);
            return;
        }

        // 3. Send Submission for Text-Only (or if BOTH with no file)
        await sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn);
    }

    async function sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn) {
        try {
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Submitting...</span>';
                lucide.createIcons();
            }

            await fetchData(`/tasks/submit-gmail-accounts`, {
                method: 'POST',
                body: { taskId, accountsList, commonPassword }
            });

            showModal('Submission Sent!', 'Your task submission has been received and is under review.', 'success');
            
            setTimeout(() => {
                closeModal();
                setRoute('my-tasks');
            }, 2500);

        } catch (error) {
            showAlert(error.message, false);
        } finally {
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Task for Review</span>';
                lucide.createIcons();
            }
        }
    }

    async function submitDailySurvey(taskId) {
        const form = document.getElementById(`survey-form-${taskId}`);
        const formData = new FormData(form);
        const surveyData = Object.fromEntries(formData);
        
        if (!surveyData.satisfaction || !surveyData.ease_of_finding || !surveyData.suggestions) {
            showAlert('Please answer all questions.', false);
            return;
        }
        
        try {
            showAlert('Submitting survey...', true);
            
            // Log to Formspree (for admin logging/analytics)
            await fetch(FORMSPREE_SURVEY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(surveyData)
            });
            
            // Submit to backend for balance update
            const response = await fetchData(`/tasks/submit-daily-task`, {
                method: 'POST',
                body: { taskId: taskId }
            });
            
            showModal('Survey Submitted!', response.message, 'success');
            
            setTimeout(() => {
                closeModal();
                setRoute('tasks');
            }, 2500);
        } catch (error) {
            showAlert(error.message, false);
        }
    }

    // The main function to decide which content to display
    async function loadContent() {
        const appContainer = document.getElementById('app-container');
        appContainer.innerHTML = `

                <div class="text-center">
                    <i data-lucide="loader-2" class="w-12 h-12 md:w-16 md:h-16 text-white animate-spin mx-auto mb-4"></i>
                    <p class="text-white font-bold text-sm md:text-base">Loading your dashboard...</p>
                </div>
            </div>
        `;
        lucide.createIcons();

        try {
            await Promise.all([fetchUserProfile(), fetchUserStats()]);
            const [tasksData, dailyTaskData] = await Promise.all([
                fetchData('/tasks/available').catch(e => ({ tasks: MOCK_TASK_DEFINITIONS, success: true })),
                fetchDailyTask(),
            ]);

            // Cache daily task data in local storage
            if (dailyTaskData && dailyTaskData.id) {
                localStorage.setItem('dailyTask', JSON.stringify(dailyTaskData));
            } else {
                localStorage.removeItem('dailyTask');
            }
            
            cachedTasks = tasksData.tasks;
            const hash = window.location.hash.slice(1);
            const route = hash || 'tasks';
            
            // Route Handling
            if (route === 'tasks') {
                renderTasksList(cachedTasks, dailyTaskData);
            } else if (route === 'my-tasks') {
                const myTasksData = await fetchData('/tasks/my-tasks');
                renderMyTasks(myTasksData.tasks);
            } else if (route === 'earnings') {
                renderEarnings();
            } else if (route === 'affiliate') {
                renderAffiliateProfile();
            } else if (route === 'achievements') {
                renderAchievements();
            } else if (route.startsWith('tasks/')) {
                const taskId = route.split('/')[1];
                renderTaskDetail(taskId);
            }

        } catch (error) {
            console.error("Critical Load Error:", error);
            // Render error screen
            if (!AUTH_TOKEN) return;
            appContainer.innerHTML = `
                <div class="ultra-card p-8 md:p-12 text-center mt-12 fade-in-up">
                    <i data-lucide="wifi-off" class="w-20 h-20 text-red-500 mx-auto mb-4"></i>
                    <h3 class="text-2xl font-black text-red-600 mb-3">Connection Error</h3>
                    <p class="text-gray-600 mb-6">Unable to load dashboard data. Please check your connection and try again.</p>
                    <button onclick="location.reload()" class="btn-premium text-white font-bold py-4 px-8 rounded-xl">
                        <i data-lucide="refresh-cw" class="w-5 h-5 inline mr-2"></i>Retry
                    </button>
                </div>
            `;
            lucide.createIcons();
        }
    }

    async function initializeApp() {
        createStarField();

        const urlToken = params.get('token');
        
        if (urlToken) {
            AUTH_TOKEN = urlToken;
            localStorage.setItem('btech_auth_token', AUTH_TOKEN);
        } else if (localStorage.getItem('btech_auth_token')) {
            AUTH_TOKEN = localStorage.getItem('btech_auth_token');
        }
        
        if (!AUTH_TOKEN || AUTH_TOKEN.length < 100) {
            renderSignInScreen();
            return;
        }
        
        // Remove token from URL after successful capture
        if (window.location.search) {
            window.history.replaceState(null, null, window.location.pathname + window.location.hash);
        }

        const hash = window.location.hash.slice(1);
        updateMobileNav(hash || 'tasks'); // Set initial nav state
        
        // Load initial content
        await loadContent();
    }
