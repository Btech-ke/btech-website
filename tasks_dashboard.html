<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH Earning Network | Professional Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand:       #5b5ef4;
            --brand-light: #7c7ff7;
            --brand-dark:  #3f42d0;
            --accent:      #f97316;
            --success:     #10b981;
            --warning:     #f59e0b;
            --danger:      #ef4444;
            --bg-deep:     #07091a;
            --bg-mid:      #0d1030;
            --bg-card:     #111536;
            --border:      rgba(255,255,255,0.07);
            --text-1:      #f1f1fb;
            --text-2:      #9ba3c8;
            --text-3:      #5f6887;
            --glass:       rgba(17, 21, 54, 0.85);
        }

        * {
            font-family: 'DM Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        h1, h2, h3, h4, .display {
            font-family: 'Syne', sans-serif;
        }

        body {
            background: var(--bg-deep);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
            color: var(--text-1);
        }

        /* ── Background ── */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(91,94,244,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(91,94,244,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .bg-glow-1 {
            position: fixed; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(91,94,244,0.18) 0%, transparent 70%);
            top: -150px; left: -100px; z-index: 0; pointer-events: none;
            animation: driftA 18s ease-in-out infinite alternate;
        }
        .bg-glow-2 {
            position: fixed; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(249,115,22,0.10) 0%, transparent 70%);
            bottom: -100px; right: -80px; z-index: 0; pointer-events: none;
            animation: driftB 22s ease-in-out infinite alternate;
        }
        @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(60px, 40px); } }
        @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-50px, -30px); } }

        .star {
            position: fixed; width: 2px; height: 2px;
            background: white; border-radius: 50%;
            animation: twinkle 3s infinite;
            pointer-events: none;
        }
        @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.8; } }

        .content-wrapper { position: relative; z-index: 1; }

        /* ── Header ── */
        .site-header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(7,9,26,0.85);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }

        .logo-ring {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--brand), var(--accent));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 24px rgba(91,94,244,0.45);
        }

        /* ── Nav ── */
        .desktop-nav a, .desktop-nav button.nav-link {
            display: flex; align-items: center; gap: 6px;
            color: var(--text-2);
            font-size: 0.875rem; font-weight: 500;
            padding: 6px 14px; border-radius: 10px;
            transition: all 0.2s;
            text-decoration: none;
            background: transparent; border: none; cursor: pointer;
        }
        .desktop-nav a:hover, .desktop-nav button.nav-link:hover {
            color: var(--text-1);
            background: rgba(255,255,255,0.06);
        }

        .notif-btn {
            position: relative;
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-2); cursor: pointer; transition: all 0.2s;
        }
        .notif-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-1); }
        .notif-dot {
            position: absolute; top: -4px; right: -4px;
            width: 18px; height: 18px;
            background: var(--danger);
            border-radius: 50%; border: 2px solid var(--bg-deep);
            font-size: 9px; font-weight: 700; color: white;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-logout {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 10px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5; font-size: 0.875rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-logout:hover { background: rgba(239,68,68,0.22); }

        /* ── Mobile Nav ── */
        .mobile-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: rgba(7,9,26,0.95);
            backdrop-filter: blur(24px);
            border-top: 1px solid var(--border);
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
        }

        .mob-nav-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            padding: 6px 4px; border-radius: 12px;
            color: var(--text-3); font-size: 10px; font-weight: 600;
            letter-spacing: 0.02em; text-transform: uppercase;
            border: none; background: transparent; cursor: pointer;
            transition: all 0.2s;
        }
        .mob-nav-item.active {
            color: var(--brand-light);
            background: rgba(91,94,244,0.12);
        }
        .mob-nav-item svg { transition: transform 0.2s; }
        .mob-nav-item.active svg { transform: translateY(-2px); }

        /* ── Cards ── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .card:hover { border-color: rgba(91,94,244,0.25); }

        .card-glow:hover {
            box-shadow: 0 8px 40px rgba(91,94,244,0.15);
            transform: translateY(-3px);
        }

        /* ── Stat Cards ── */
        .stat-card {
            background: linear-gradient(135deg, var(--brand-dark) 0%, #2d1f6e 100%);
            border: 1px solid rgba(91,94,244,0.3);
            border-radius: 20px;
            position: relative; overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute; top: -30px; right: -30px;
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .stat-card.orange {
            background: linear-gradient(135deg, #92400e 0%, #78350f 100%);
            border-color: rgba(249,115,22,0.3);
        }
        .stat-card.green {
            background: linear-gradient(135deg, #065f46 0%, #064e3b 100%);
            border-color: rgba(16,185,129,0.3);
        }
        .stat-card.purple {
            background: linear-gradient(135deg, #4c1d95 0%, #3b0764 100%);
            border-color: rgba(139,92,246,0.3);
        }

        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 800; color: #fff; line-height: 1;
        }
        .stat-label {
            font-size: 0.72rem; font-weight: 600;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: rgba(255,255,255,0.6);
        }

        /* ── Task Cards ── */
        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            position: relative;
        }
        .task-card::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(91,94,244,0.04), transparent);
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .task-card:hover {
            border-color: rgba(91,94,244,0.4);
            transform: translateY(-5px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(91,94,244,0.15);
        }
        .task-card:hover::after { opacity: 1; }

        .featured-ribbon {
            position: absolute; top: 14px; left: 14px;
            background: linear-gradient(90deg, #f59e0b, #f97316);
            color: white; font-size: 10px; font-weight: 800;
            letter-spacing: 0.08em; text-transform: uppercase;
            padding: 3px 10px; border-radius: 20px;
            display: flex; align-items: center; gap: 4px;
        }

        /* ── Badges ── */
        .badge {
            display: inline-flex; align-items: center;
            padding: 3px 10px; border-radius: 20px;
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.05em; text-transform: uppercase;
        }
        .badge-easy   { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
        .badge-medium { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
        .badge-hard   { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
        .badge-featured { background: rgba(249,115,22,0.15); color: #fb923c; border: 1px solid rgba(249,115,22,0.25); }

        /* Status badges (for my-tasks) */
        .status-pending_verification { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
        .status-in_progress { background: rgba(91,94,244,0.15); color: #818cf8; border: 1px solid rgba(91,94,244,0.25); }
        .status-completed   { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
        .status-rejected    { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.25); }

        /* Difficulty badges (for task card header) */
        .difficulty-easy   { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
        .difficulty-medium { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
        .difficulty-hard   { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

        /* ── Payout text ── */
        .payout-text {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc, #fb923c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Buttons ── */
        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, var(--brand), var(--brand-light));
            color: white; font-weight: 700; border: none; cursor: pointer;
            border-radius: 14px; padding: 12px 20px;
            transition: all 0.25s;
            box-shadow: 0 6px 24px rgba(91,94,244,0.35);
            width: 100%;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(91,94,244,0.5); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-secondary {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            color: var(--text-1); font-weight: 600; cursor: pointer;
            border-radius: 14px; padding: 12px 20px; transition: all 0.2s; width: 100%;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }

        .btn-success {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white; font-weight: 700; border: none; cursor: pointer;
            border-radius: 14px; padding: 12px 20px; transition: all 0.25s; width: 100%;
            box-shadow: 0 6px 20px rgba(16,185,129,0.3);
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(16,185,129,0.45); }

        /* ── Inputs ── */
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 11px 16px;
            color: var(--text-1); font-size: 0.9rem;
            transition: all 0.2s;
            outline: none;
        }
        .form-input::placeholder { color: var(--text-3); }
        .form-input:focus { border-color: var(--brand); background: rgba(91,94,244,0.06); box-shadow: 0 0 0 3px rgba(91,94,244,0.15); }
        select.form-input option { background: var(--bg-mid); }

        .search-wrap { position: relative; }
        .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
        .search-wrap input { padding-left: 44px; }

        /* ── Progress bar ── */
        .progress-track {
            height: 5px; background: rgba(255,255,255,0.08);
            border-radius: 99px; overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--brand), var(--brand-light));
            border-radius: 99px;
            transition: width 0.6s ease;
        }

        /* ── Daily task highlight ── */
        .daily-task-card {
            background: linear-gradient(135deg, rgba(91,94,244,0.12), rgba(139,92,246,0.08));
            border: 1px solid rgba(91,94,244,0.3);
            border-radius: 20px;
            position: relative; overflow: hidden;
        }
        .daily-task-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--brand), var(--brand-light), var(--accent));
        }
        .pulse-dot {
            display: inline-block; width: 8px; height: 8px;
            background: var(--success); border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
            70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }

        /* ── Section headings ── */
        .section-label {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.4rem, 4vw, 1.9rem);
            font-weight: 800; color: var(--text-1);
            display: flex; align-items: center; gap: 12px;
        }
        .section-sub { font-size: 0.85rem; color: var(--text-2); font-weight: 400; margin-top: 4px; }

        /* ── Category icon container ── */
        .cat-icon {
            width: 44px; height: 44px; min-width: 44px;
            background: rgba(91,94,244,0.12);
            border: 1px solid rgba(91,94,244,0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--brand-light);
        }

        /* ── Alert / Toast ── */
        #status-alert {
            position: fixed; top: 76px; right: 16px; left: auto;
            z-index: 100; max-width: 360px; width: calc(100vw - 32px);
        }
        .toast-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .toast-icon { width: 36px; height: 36px; min-width: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .toast-success { background: rgba(16,185,129,0.15); color: #34d399; }
        .toast-error   { background: rgba(239,68,68,0.15);  color: #f87171; }

        /* ── Modal ── */
        #action-modal { background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px; text-align: center;
            max-width: 420px; width: calc(100vw - 32px);
        }
        .modal-icon-wrap {
            width: 72px; height: 72px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }

        /* ── Notifications dropdown ── */
        #notifications-dropdown {
            top: 72px; right: 16px;
        }
        .notif-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px; padding: 20px;
            width: 320px; max-width: calc(100vw - 32px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
        }
        .notif-item {
            padding: 12px 14px; border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(91,94,244,0.35); border-radius: 3px; }

        /* ── Animations ── */
        .fade-in-up {
            animation: fadeInUp 0.4s ease both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.10s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.20s; }

        /* ── Sign-in screen ── */
        .signin-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 48px 36px; text-align: center;
            max-width: 500px; margin: 48px auto;
        }
        .signin-stat { text-align: center; }
        .signin-stat .val {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem; font-weight: 800; color: var(--text-1);
        }
        .signin-stat .lbl { font-size: 0.75rem; color: var(--text-2); }

        /* ── Earnings page ── */
        .txn-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255,255,255,0.02);
            transition: all 0.2s;
        }
        .txn-row:hover { background: rgba(91,94,244,0.06); border-color: rgba(91,94,244,0.2); }
        .txn-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        /* ── Affiliate page ── */
        .referral-box {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(91,94,244,0.4);
            border-radius: 14px; padding: 16px;
        }
        .how-step { text-align: center; }
        .how-step .circle {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--brand), var(--brand-light));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 6px 20px rgba(91,94,244,0.35);
        }

        /* ── Achievements ── */
        .ach-card.locked { opacity: 0.45; filter: grayscale(0.6); }
        .ach-icon-wrap {
            width: 56px; height: 56px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        .ach-icon-wrap.unlocked { background: linear-gradient(135deg, var(--brand), var(--brand-light)); box-shadow: 0 6px 20px rgba(91,94,244,0.35); }
        .ach-icon-wrap.locked   { background: rgba(255,255,255,0.06); }

        /* ── Responsive helpers ── */
        @media (max-width: 640px) {
            .card, .task-card { border-radius: 16px; }
            .stat-card { border-radius: 16px; }
            .modal-card { border-radius: 20px; padding: 32px 20px; }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div id="stars-container" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></div>

    <div class="content-wrapper">

        <!-- ══ HEADER ══ -->
        <header class="site-header">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">

                <!-- Logo -->
                <div class="flex items-center gap-3 flex-shrink-0">
                    <div class="logo-ring">
                        <i data-lucide="zap" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <div class="font-bold text-white text-lg leading-none" style="font-family:Syne,sans-serif;">BTECH PRO</div>
                        <div class="text-xs" style="color:var(--text-3);">Earning Network</div>
                    </div>
                </div>

                <!-- Desktop Nav -->
                <nav class="desktop-nav hidden md:flex items-center gap-1 flex-1 justify-center">
                    <a href="javascript:void(0)" onclick="setRoute('tasks')">
                        <i data-lucide="briefcase" class="w-4 h-4"></i><span>Tasks</span>
                    </a>
                    <a href="javascript:void(0)" onclick="setRoute('my-tasks')">
                        <i data-lucide="list-checks" class="w-4 h-4"></i><span>My Tasks</span>
                    </a>
                    <a href="javascript:void(0)" onclick="setRoute('earnings')">
                        <i data-lucide="wallet" class="w-4 h-4"></i><span>Earnings</span>
                    </a>
                    <a href="javascript:void(0)" onclick="setRoute('affiliate')">

<script>
    // ============================================
    // GLOBAL CONFIGURATION & STATE  ← UNCHANGED
    // ============================================
    const BACKEND_URL = "https://btech-earning-api.onrender.com/api";
    const FORMSPREE_SURVEY_URL = "https://formspree.io/f/mblolava";
    const REFERRAL_BONUS = 200.00;
    const LINKEDIN_PROFILE_URL = "https://linkedin.com/in/liam-lee-245a9736a";
    
    let AUTH_TOKEN;
    let cachedTasks = [];
    let userStats = {
        totalEarned: 0,
        availableBalance: 0,
        pendingEarnings: 0,
        tasksCompleted: 0,
        activeTasks: 0
    };
    let userProfile = {};
    let cache = {
        profileLoaded: false,
        statsLoaded: false
    };
    let currentFilters = {
        category: 'all',
        difficulty: 'all',
        search: ''
    };

    const MOCK_TASK_DEFINITIONS = [
        { id: 1501, title: 'PRO Task: Executive Network Outreach (Liam Lee Profile)', description: 'Establish a professional connection with our Lead Strategist, Liam Lee, on LinkedIn to unlock future executive tasks. This requires genuine outreach and following specific profile guidelines.', category: 'Professional Networking & Outreach', payment: 250.00, estimatedTime: '10 minutes', difficulty: 'Easy', requiresVerification: true, deadline: '2025-12-31', tasksAvailable: 50, completionRate: 90, clientName: 'BTECH HR', featured: true, submission_type: 'IMAGE_URL', submission_guide: `1. Visit Liam Lee's LinkedIn: ${LINKEDIN_PROFILE_URL} | 2. Send Connection Request | 3. Upload screenshot of 'Request Pending' page.`, requires_admin_action: true },
        { id: 1502, title: 'WeChat Account Acquisition: KES 1,000 Payout', description: 'Sell us a valid, existing, or new WeChat account. Instant KES 1,000 credited upon successful validation by the admin.', category: 'Account Procurement', payment: 1000.00, estimatedTime: '5 minutes', difficulty: 'Easy', requiresVerification: true, deadline: '2025-12-31', tasksAvailable: 20, completionRate: 80, clientName: 'BTECH Acquisitions', submission_type: 'TEXT', submission_guide: 'Submit the account phone number and password separated by a newline.', requires_admin_action: true }
    ];

    // ============================================
    // GOOGLE AUTH HANDLER ← UNCHANGED
    // ============================================
    async function handleCredentialResponse(response) {
        if (response.credential) {
            showAlert('Google Sign-In successful. Syncing account...', true);
            try {
                const apiResponse = await fetch(`${BACKEND_URL}/auth/provision`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${response.credential}` }
                });
                const data = await apiResponse.json();
                if (apiResponse.ok && data.success) {
                    showAlert(`Welcome, ${data.user.fullName || data.user.email}!`, true);
                    location.reload();
                } else {
                    showAlert(data.error || 'Account provisioning failed.', false);
                }
            } catch (error) {
                showAlert('Network error during provisioning.', false);
            }
        }
    }

    // ============================================
    // CORE UTILITIES ← UNCHANGED LOGIC, UPDATED UI
    // ============================================
    function createStarField() {
        const container = document.getElementById('stars-container');
        if (!container) return;
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            star.style.opacity = Math.random() * 0.6;
            container.appendChild(star);
        }
    }

    function showAlert(message, isSuccess = true) {
        const statusAlert = document.getElementById('status-alert');
        const iconBg = document.getElementById('alert-icon-bg');
        const icon = document.getElementById('alert-icon');
        const msg = document.getElementById('alert-message');
        iconBg.className = isSuccess ? 'toast-icon toast-success' : 'toast-icon toast-error';
        icon.className = 'w-5 h-5';
        icon.setAttribute('data-lucide', isSuccess ? 'check-circle' : 'alert-circle');
        msg.textContent = message;
        statusAlert.classList.remove('hidden');
        lucide.createIcons();
        setTimeout(() => {
            statusAlert.style.opacity = '0';
            statusAlert.style.transition = 'opacity 0.3s';
            setTimeout(() => { statusAlert.classList.add('hidden'); statusAlert.style.opacity = '1'; }, 300);
        }, 5000);
    }

    function closeAlert() { document.getElementById('status-alert').classList.add('hidden'); }

    function showModal(title, message, type = 'success') {
        const modal = document.getElementById('action-modal');
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').textContent = message;
        const iconBg = document.getElementById('modal-icon-bg');
        const icon = document.getElementById('modal-icon');
        const configs = {
            success: { icon:'check-circle', bg:'rgba(16,185,129,0.15)', color:'#34d399' },
            error:   { icon:'alert-circle', bg:'rgba(239,68,68,0.15)',  color:'#f87171' },
            warning: { icon:'alert-triangle', bg:'rgba(245,158,11,0.15)', color:'#fbbf24' }
        };
        const cfg = configs[type] || configs.success;
        iconBg.style.background = cfg.bg;
        icon.style.color = cfg.color;
        icon.className = 'w-10 h-10';
        icon.setAttribute('data-lucide', cfg.icon);
        modal.classList.remove('hidden');
        lucide.createIcons();
    }

    function closeModal() { document.getElementById('action-modal').classList.add('hidden'); }

    function simulateLogout(force = false) {
        localStorage.removeItem('btech_auth_token');
        showAlert(force ? "Session expired. Please re-login." : "Logged out successfully!", !force);
        setTimeout(() => window.location.reload(), 1500);
    }

    function updateMobileNav(route) {
        document.querySelectorAll('.mob-nav-item').forEach(el => el.classList.remove('active'));
        const baseRoute = route.split('/')[0];
        const activeNav = document.getElementById(`nav-${baseRoute}`);
        if (activeNav) activeNav.classList.add('active');
    }

    function getCategoryIcon(category) {
        const icons = {
            'Survey': 'clipboard-list',
            'Professional Networking & Outreach': 'linkedin',
            'Account Procurement': 'message-circle-code',
            'Data Entry': 'database',
            'Account Connection': 'link'
        };
        return icons[category] || 'briefcase';
    }

    function getTaskPayout(task) {
        const value = task.payment || task.payout;
        return typeof value === 'string' ? value : parseFloat(value || 0).toFixed(2);
    }

    function getTaskDifficulty(task) {
        return (task.difficulty || 'Easy').toLowerCase();
    }

    function showWithdrawalModal() {
        showModal('Withdrawal Request', 'Contact admin to process your withdrawal. Min amount: KES 500', 'warning');
    }

    // ============================================
    // API HELPERS ← UNCHANGED
    // ============================================
    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN) throw new Error('Authentication token missing.');
        const config = {
            method: options.method || 'GET',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${AUTH_TOKEN}`, ...options.headers },
            ...(options.body && { body: JSON.stringify(options.body) }),
        };
        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`, config);
            const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));
            if (!response.ok || !data.success) {
                if (response.status === 401 || response.status === 403) simulateLogout(true);
                throw new Error(data.error || `API Error: ${response.status}`);
            }
            return data;
        } catch (error) {
            console.error('API Error:', error.message);
            throw error;
        }
    }

    async function fetchUserProfile() {
        if (cache.profileLoaded) return;
        try {
            const result = await fetchData('/user/profile', { method: 'GET' });
            if (result.success && result.user) { userProfile = result.user; cache.profileLoaded = true; }
        } catch (error) { console.warn("Profile fetch failed:", error.message); }
    }

    async function fetchUserStats() {
        if (cache.statsLoaded) return;
        try {
            const earningsData = await fetchData('/earnings/summary');
            const myTasksData = await fetchData('/tasks/my-tasks');
            userStats.totalEarned = parseFloat(earningsData.earnings.totalEarnings || 0);
            userStats.availableBalance = parseFloat(earningsData.earnings.availableBalance || 0);
            userStats.pendingEarnings = parseFloat(earningsData.earnings.pendingEarnings || 0);
            userStats.tasksCompleted = parseInt(earningsData.earnings.completedTasks || 0);
            userStats.activeTasks = myTasksData.tasks.filter(t => t.status === 'IN_PROGRESS' || t.status === 'PENDING_VERIFICATION' || t.status === 'REJECTED').length;
            cache.statsLoaded = true;
        } catch (e) {
            console.warn("Stats fetch failed, using defaults:", e.message);
            userStats = { totalEarned: 0, availableBalance: 0, pendingEarnings: 0, tasksCompleted: 0, activeTasks: 0 };
        }
    }

    async function fetchDailyTask() {
        try {
            const data = await fetchData('/tasks/daily', { method: 'GET' });
            return data.task;
        } catch (error) {
            console.warn("Daily task fetch failed, using mock:", error.message);
            return MOCK_TASK_DEFINITIONS.find(t => t.id === 1) || null;
        }
    }

    // ============================================
    // TASK ACTION HANDLERS ← UNCHANGED
    // ============================================
    async function acceptTask(taskId) {
        try {
            showAlert('Accepting task...', true);
            const response = await fetchData(`/tasks/${taskId}/accept`, { method: 'POST' });
            if (response.message.includes('already in your active list')) {
                showModal('Task Already Active!', 'This task is already in your "My Tasks" list. We are refreshing to the detail screen.', 'warning');
            } else {
                showModal('Task Accepted!', 'You can now start working on this task. Loading details...', 'success');
            }
            window.location.search = `?taskid=${taskId}`;
            window.location.hash = '';
            setTimeout(() => { closeModal(); window.location.reload(); }, 2000);
        } catch (error) {
            showAlert(error.message, false);
        }
    }

    function acceptAndNavigateToSurvey(taskId) { acceptTask(taskId); }

    async function submitGenericFileTask(taskId, type) {
        const textInput = document.getElementById(`submission-text-field-${taskId}`);
        const fileInput = document.getElementById(`submission-file-input-${taskId}`);
        const submitBtn = document.getElementById(`submit-btn-generic-${taskId}`);
        let accountsList = [];
        let commonPassword = '';
        if (type === 'TEXT' || type === 'BOTH') {
            const textValue = textInput?.value?.trim();
            if (!textValue) { showAlert('Text submission field is required.', false); return; }
            accountsList.push(textValue);
            if (type === 'TEXT') commonPassword = textValue;
        }
        if (type === 'IMAGE_URL' || (type === 'BOTH' && fileInput?.files.length > 0)) {
            if (!fileInput || !fileInput.files.length) { showAlert('Image/Screenshot proof is required.', false); return; }
            const file = fileInput.files[0];
            if (file.size > 5 * 1024 * 1024) { showAlert('File size must be less than 5MB.', false); return; }
            if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Uploading...</span>'; lucide.createIcons(); }
            const reader = new FileReader();
            reader.onload = async function(e) {
                commonPassword = e.target.result.split(',')[1];
                if (type === 'IMAGE_URL') accountsList.push(`File Name: ${file.name}`);
                await sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn);
            };
            reader.onerror = () => {
                showAlert('Failed to read file.', false);
                if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Task for Review</span>'; lucide.createIcons(); }
            };
            reader.readAsDataURL(file);
            return;
        }
        await sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn);
    }

    async function sendSubmissionToBackend(taskId, accountsList, commonPassword, submitBtn) {
        try {
            if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Submitting...</span>'; lucide.createIcons(); }
            await fetchData(`/tasks/submit-gmail-accounts`, { method: 'POST', body: { taskId, accountsList, commonPassword } });
            showModal('Submission Sent!', 'Your task submission has been received and is under admin review.', 'success');
            setTimeout(() => { closeModal(); setRoute('my-tasks'); }, 2500);
        } catch (error) {
            showAlert(error.message, false);
        } finally {
            if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Task for Review</span>'; lucide.createIcons(); }
        }
    }

    async function submitDailySurvey(taskId) {
        const form = document.getElementById(`survey-form-${taskId}`);
        const formData = new FormData(form);
        const surveyData = Object.fromEntries(formData);
        if (!surveyData.satisfaction || !surveyData.ease_of_finding || !surveyData.suggestions) { showAlert('Please answer all questions.', false); return; }
        try {
            showAlert('Submitting survey...', true);
            await fetch(FORMSPREE_SURVEY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(surveyData) });
            const response = await fetchData(`/tasks/submit-daily-task`, { method: 'POST', body: { taskId: taskId } });
            showModal('Survey Submitted!', response.message, 'success');
            setTimeout(() => { closeModal(); setRoute('tasks'); }, 2500);
        } catch (error) {
            showAlert(error.message, false);
        }
    }

    function handleFileSelectForGeneric(taskId) {
        const fileInput = document.getElementById(`submission-file-input-${taskId}`);
        const filePreview = document.getElementById(`file-preview-generic-${taskId}`);
        const fileName = document.getElementById(`file-name-generic-${taskId}`);
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            fileName.textContent = `✓ ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
            filePreview.classList.remove('hidden');
        } else {
            filePreview.classList.add('hidden');
        }
    }

    // ============================================
    // RENDERING ← UPGRADED UI ONLY
    // ============================================
    function renderTaskCard(task, index) {
        const dailyTask = JSON.parse(localStorage.getItem('dailyTask') || 'null');
        if (dailyTask && task.id === dailyTask.id) return '';
        const payoutText = typeof task.payment === 'string' ? task.payment : `KES ${getTaskPayout(task)}`;
        const diff = getTaskDifficulty(task);

        return `
        <div class="task-card p-5 fade-in-up" style="animation-delay:${index * 0.08}s;">
            ${task.featured ? `<div class="featured-ribbon"><i data-lucide="star" class="w-3 h-3"></i> Featured</div>` : ''}
            <div class="flex items-start justify-between mb-4 ${task.featured ? 'mt-6' : ''}">
                <div class="cat-icon"><i data-lucide="${getCategoryIcon(task.category)}" class="w-5 h-5"></i></div>
                <span class="badge badge-${diff}">${task.difficulty || 'Easy'}</span>
            </div>
            <h3 class="font-bold mb-1 line-clamp-2" style="font-family:Syne,sans-serif;font-size:1rem;color:var(--text-1);">${task.title || 'N/A'}</h3>
            <p class="text-xs mb-4 line-clamp-2" style="color:var(--text-2);">${task.description || 'No description.'}</p>
            <div class="payout-text mb-4">${payoutText}</div>
            <div class="flex items-center justify-between text-xs mb-3" style="color:var(--text-3);">
                <div class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i><span>${task.estimatedTime || 'Varies'}</span></div>
                <div class="flex items-center gap-1"><i data-lucide="users" class="w-3 h-3"></i><span>${task.tasksAvailable || 0} slots</span></div>
            </div>
            <div class="progress-track mb-4"><div class="progress-fill" style="width:${task.completionRate || 0}%;"></div></div>
            <button onclick="acceptTask(${task.id})" class="btn-primary text-sm py-3">
                <i data-lucide="play-circle" class="w-4 h-4"></i><span>Accept Task</span>
            </button>
        </div>`;
    }

    function renderTasksList(tasks, dailyTask) {

        const dailyTaskHtml = dailyTask ? `

                <span class="font-semibold">Category:</span> ${dailyTask.category || 'N/A'} &nbsp;·&nbsp;

        </div>` : `
        <div class="card p-6 mb-6 text-center fade-in-up">
            <i data-lucide="calendar-x" class="w-8 h-8 mx-auto mb-2" style="color:var(--text-3);"></i>
            <p class="text-sm" style="color:var(--text-2);">No new microtasks today. Check back tomorrow!</p>
        </div>`;

        appContainer.innerHTML = `

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-8">
                <div class="stat-card p-4 md:p-5 stagger-1 fade-in-up">
                    <div class="mb-3"><i data-lucide="trending-up" class="w-5 h-5" style="color:rgba(255,255,255,0.6);"></i></div>
                    <div class="stat-label">Total Earned</div>
                    <div class="stat-value mt-1">KES ${userStats.totalEarned.toFixed(0)}</div>
                </div>
                <div class="stat-card orange p-4 md:p-5 stagger-2 fade-in-up">
                    <div class="mb-3"><i data-lucide="wallet" class="w-5 h-5" style="color:rgba(255,255,255,0.6);"></i></div>
                    <div class="stat-label">Available</div>
                    <div class="stat-value mt-1">KES ${userStats.availableBalance.toFixed(0)}</div>
                </div>

    async function renderTaskDetail(taskId) {
        const numericTaskId = parseInt(taskId);
        let task = null;
        let userTaskStatus = null;

        try {
            const myTasksData = await fetchData('/tasks/my-tasks');
            const myTaskEntry = myTasksData.tasks.find(t => t.taskId === numericTaskId);
            if (myTaskEntry) {
                task = {
                    id: myTaskEntry.taskId, title: myTaskEntry.title, description: myTaskEntry.description,
                    category: myTaskEntry.category, payment: myTaskEntry.payment, estimatedTime: myTaskEntry.estimatedTime,
                    difficulty: myTaskEntry.difficulty, deadline: myTaskEntry.deadline,
                    submission_type: myTaskEntry.submission_type, submission_guide: myTaskEntry.submission_guide,
                    status: myTaskEntry.status, startedDate: myTaskEntry.startedDate
                };
                userTaskStatus = myTaskEntry.status;
            }
        } catch (e) { console.warn("Could not fetch user history:", e); }

        if (!task) {
            task = cachedTasks.find(t => t.id === numericTaskId) || MOCK_TASK_DEFINITIONS.find(t => t.id === numericTaskId);
            if (!task) {
                try {
                    const tasksData = await fetchData('/tasks/available');
                    cachedTasks = tasksData.tasks;
                    task = cachedTasks.find(t => t.id === numericTaskId);
                } catch (e) {}
            }
        }

        if (!task || !task.title) { showAlert('Task details unavailable. It may have expired.', false); setRoute('tasks'); return; }

        const payoutText = typeof task.payment === 'string' ? task.payment : `KES ${getTaskPayout(task)}`;
        const statusClass = userTaskStatus ? `status-${userTaskStatus.toLowerCase()}` : '';
        const statusText = userTaskStatus ? userTaskStatus.replace('_', ' ') : 'Not Accepted';

        let submissionSection;
        if (userTaskStatus === 'COMPLETED') {
            submissionSection = `<div style="text-align:center;padding:40px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);border-radius:16px;">
                <i data-lucide="check-circle" class="w-14 h-14 mx-auto mb-3" style="color:#34d399;"></i>
                <p class="font-bold" style="color:#34d399;font-size:1.1rem;">Task Completed!</p>
                <p class="text-sm mt-1" style="color:var(--text-2);">You have successfully finished this task.</p></div>`;
        } else if (userTaskStatus === 'PENDING_VERIFICATION') {
            submissionSection = `<div style="text-align:center;padding:40px;background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.2);border-radius:16px;">
                <i data-lucide="clock" class="w-14 h-14 mx-auto mb-3" style="color:#fbbf24;"></i>
                <p class="font-bold" style="color:#fbbf24;font-size:1.1rem;">Awaiting Review</p>
                <p class="text-sm mt-1" style="color:var(--text-2);">Your submission is being reviewed by the admin.</p></div>`;
        } else if (userTaskStatus === 'REJECTED') {
            submissionSection = `<div style="text-align:center;padding:32px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:16px;margin-bottom:24px;">
                <i data-lucide="x-circle" class="w-12 h-12 mx-auto mb-3" style="color:#f87171;"></i>
                <p class="font-bold" style="color:#f87171;">Submission Rejected</p>
                <p class="text-sm mt-1" style="color:var(--text-2);">Please review the requirements and try again.</p></div>${renderSubmissionForm(task)}`;
        } else {
            submissionSection = renderSubmissionForm(task);
        }

        const appContainer = document.getElementById('app-container');
        appContainer.innerHTML = `
        <div class="fade-in-up">
            <button onclick="setRoute('tasks')" class="flex items-center gap-2 mb-6 text-sm font-semibold" style="color:var(--text-2);background:none;border:none;cursor:pointer;padding:0;" onmouseover="this.style.color='var(--text-1)'" onmouseout="this.style.color='var(--text-2)'">
                <i data-lucide="arrow-left" class="w-4 h-4"></i><span>Back to Tasks</span>
            </button>

            <div class="card p-6 mb-4">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
                    <div style="flex:1;min-width:0;">
                        <p class="text-xs font-semibold mb-1" style="color:var(--text-3);text-transform:uppercase;letter-spacing:0.05em;">${task.category || 'General'}</p>
                        <h1 style="font-family:Syne,sans-serif;font-size:clamp(1.2rem,3vw,1.6rem);font-weight:800;color:var(--text-1);line-height:1.2;">${task.title}</h1>
                    </div>
                    <div style="text-align:right;flex-shrink:0;">
                        <div class="payout-text">${payoutText}</div>
                        <span class="badge ${statusClass} mt-1">${statusText}</span>
                    </div>
                </div>
                <div style="margin-top:16px;padding:16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;">
                    <p style="color:var(--text-2);font-size:0.9rem;white-space:pre-wrap;line-height:1.6;">${task.description || 'No description available.'}</p>
                </div>
            </div>

            <div class="card p-6">${submissionSection}</div>
        </div>`;
        lucide.createIcons();
    }

    function renderSubmissionForm(task) {
        if (task.status !== 'IN_PROGRESS' && task.status !== 'REJECTED' && task.status !== 'PENDING_VERIFICATION') {
            return `
            <div style="text-align:center;padding:32px;">
                <i data-lucide="play-circle" class="w-12 h-12 mx-auto mb-3" style="color:var(--brand-light);"></i>
                <p class="mb-2 font-semibold" style="color:var(--text-1);">Ready to start?</p>
                <p class="text-sm mb-6" style="color:var(--text-2);">Click below to reserve the slot and open the submission form.</p>
                <button onclick="acceptTask(${task.id})" class="btn-primary" style="max-width:240px;margin:0 auto;">Accept Task Now</button>
            </div>`;
        }

        let rawType = task.submission_type || task.submissionType || 'NONE';
        const type = rawType !== 'NONE' ? rawType : 'NONE';
        const guide = task.submission_guide || task.submissionGuide || 'Please follow the instructions in the task description.';
        const taskId = task.id || task.taskId;

        if (taskId == 1 || task.category === 'Survey') return renderDailySurveyForm(taskId);

        if (type === 'NONE') {
            return `<div style="text-align:center;padding:32px;">
                <p class="font-bold mb-2" style="color:var(--text-1);">No Submission Required</p>
                <p class="text-sm mb-4" style="color:var(--text-2);">This task is tracked automatically. Your status will update soon.</p>
                <button onclick="setRoute('my-tasks')" class="btn-primary" style="max-width:220px;margin:0 auto;">View My Tasks</button>
            </div>`;
        }

        let submissionHtml = '';
        let formAction = `submitGenericFileTask(${taskId}, '${type}')`;

        if (type === 'TEXT' || type === 'BOTH') {
            submissionHtml += `
            <div style="margin-bottom:20px;">
                <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text-2);margin-bottom:8px;">${type==='TEXT'?'1.':'A.'} Text / Link / Credential Submission</label>
                <textarea id="submission-text-field-${taskId}" rows="4" class="form-input" placeholder="Enter proof, links, or credentials here..." ${type==='TEXT'?'required':''}></textarea>
            </div>`;
        }

        if (type === 'IMAGE_URL' || type === 'BOTH') {
            submissionHtml += `
            <div style="margin-bottom:20px;${type==='BOTH'?'border-top:1px solid var(--border);padding-top:20px;':''}">
                <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text-2);margin-bottom:8px;">${type==='IMAGE_URL'?'1.':'B.'} Screenshot Proof (Max 5MB, JPEG/PNG)</label>
                <div style="border:2px dashed rgba(91,94,244,0.3);border-radius:14px;padding:32px;text-align:center;transition:border-color 0.2s;" 
                     onmouseover="this.style.borderColor='rgba(91,94,244,0.6)'" onmouseout="this.style.borderColor='rgba(91,94,244,0.3)'">
                    <input type="file" id="submission-file-input-${taskId}" class="hidden" ${type==='IMAGE_URL'?'required':''} accept="image/jpeg,image/png" onchange="handleFileSelectForGeneric(${taskId})">
                    <label for="submission-file-input-${taskId}" style="cursor:pointer;">
                        <i data-lucide="upload-cloud" class="w-10 h-10 mx-auto mb-2" style="color:var(--brand-light);"></i>
                        <p class="text-sm font-semibold" style="color:var(--text-1);">Click to upload screenshot</p>
                        <p class="text-xs mt-1" style="color:var(--text-3);">JPEG or PNG, max 5MB</p>
                    </label>
                    <div id="file-preview-generic-${taskId}" class="hidden mt-3">
                        <p class="text-sm font-semibold" id="file-name-generic-${taskId}" style="color:#34d399;"></p>
                    </div>
                </div>
            </div>`;
        }

        return `
        <div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
                <i data-lucide="upload" class="w-5 h-5" style="color:var(--brand-light);"></i>
                <h3 style="font-family:Syne,sans-serif;font-size:1.1rem;font-weight:700;color:var(--text-1);">Task Submission Portal</h3>
            </div>
            <div style="padding:12px 16px;background:rgba(91,94,244,0.08);border:1px solid rgba(91,94,244,0.2);border-radius:12px;margin-bottom:20px;">
                <p style="font-size:0.85rem;color:var(--text-2);"><span style="font-weight:600;color:var(--brand-light);">Guide:</span> ${guide}</p>
            </div>
            <form onsubmit="event.preventDefault(); ${formAction};">
                ${submissionHtml}
                <button type="submit" id="submit-btn-generic-${taskId}" class="btn-primary py-4">
                    <i data-lucide="send" class="w-5 h-5"></i><span>Submit Task for Review</span>
                </button>
            </form>
        </div>`;
    }

    function renderDailySurveyForm(taskId) {
        const selClass = 'form-input';
        const questions = [
            { name:'satisfaction', label:'1. How satisfied are you with the platform?', opts:['very_satisfied:Very Satisfied','satisfied:Satisfied','neutral:Neutral','dissatisfied:Dissatisfied','very_dissatisfied:Very Dissatisfied'] },
            { name:'ease_of_finding', label:'2. How easy is it to find tasks?', opts:['very_easy:Very Easy','easy:Easy','moderate:Moderate','difficult:Difficult','very_difficult:Very Difficult'] }
        ];
        return `
        <div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
                <i data-lucide="clipboard-list" class="w-5 h-5" style="color:var(--brand-light);"></i>
                <h3 style="font-family:Syne,sans-serif;font-size:1.1rem;font-weight:700;color:var(--text-1);">Daily Survey Questions</h3>
            </div>
            <form id="survey-form-${taskId}" onsubmit="event.preventDefault(); submitDailySurvey(${taskId});">
                <div style="display:flex;flex-direction:column;gap:20px;">
                    ${questions.map(q => `
                    <div>
                        <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text-2);margin-bottom:8px;">${q.label}</label>
                        <select name="${q.name}" class="${selClass}" required>
                            <option value="">Select an option</option>
                            ${q.opts.map(o => `<option value="${o.split(':')[0]}">${o.split(':')[1]}</option>`).join('')}
                        </select>
                    </div>`).join('')}
                    <div>
                        <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text-2);margin-bottom:8px;">3. What improvements would you suggest?</label>
                        <textarea name="suggestions" rows="4" class="form-input" placeholder="Share your thoughts..." required></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-primary py-4 mt-6">
                    <i data-lucide="send" class="w-5 h-5"></i><span>Submit Survey</span>
                </button>
            </form>
        </div>`;
    }

    // ============================================
    // FILTERING ← UNCHANGED LOGIC
    // ============================================
    function applyFilters() {
        const categoryFilter = document.getElementById('category-filter')?.value || 'all';
        const difficultyFilter = document.getElementById('difficulty-filter')?.value || 'all';
        const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
        currentFilters = { category: categoryFilter, difficulty: difficultyFilter, search: searchTerm };
        const filteredTasks = cachedTasks.filter(task => {
            const matchesCategory = categoryFilter === 'all' || task.category === categoryFilter;
            const matchesDifficulty = difficultyFilter === 'all' || getTaskDifficulty(task) === difficultyFilter.toLowerCase();
            const matchesSearch = searchTerm === '' || task.title.toLowerCase().includes(searchTerm) || (task.description || '').toLowerCase().includes(searchTerm);
            return matchesCategory && matchesDifficulty && matchesSearch;
        });
        renderFilteredTasks(filteredTasks);
    }

    function renderFilteredTasks(tasks) {
        const container = document.getElementById('tasks-grid');
        if (!container) return;
        if (tasks.length === 0) {
            container.innerHTML = `
            <div class="card p-12 text-center" style="grid-column:1/-1;">
                <i data-lucide="search-x" class="w-14 h-14 mx-auto mb-4" style="color:var(--text-3);"></i>
                <h3 class="font-bold mb-2" style="font-family:Syne,sans-serif;color:var(--text-1);">No Tasks Found</h3>
                <p class="text-sm mb-6" style="color:var(--text-2);">Try adjusting your filters or search terms.</p>
                <button onclick="resetFilters()" class="btn-primary" style="max-width:180px;margin:0 auto;">Reset Filters</button>
            </div>`;
            lucide.createIcons();
            return;
        }
        container.innerHTML = tasks.map((task, i) => renderTaskCard(task, i)).join('');
        lucide.createIcons();
    }

    function resetFilters() {
        if (document.getElementById('category-filter')) document.getElementById('category-filter').value = 'all';
        if (document.getElementById('difficulty-filter')) document.getElementById('difficulty-filter').value = 'all';
        if (document.getElementById('search-input')) document.getElementById('search-input').value = '';
        applyFilters();
    }

    // ============================================
    // ROUTING & INIT ← UNCHANGED LOGIC
    // ============================================
    function setRoute(path) {
        window.location.hash = `#${path}`;
        updateMobileNav(path);
        loadContent();
    }

    async function loadContent() {
        const appContainer = document.getElementById('app-container');
        appContainer.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;padding:80px 0;">
            <div style="text-align:center;">
                <i data-lucide="loader-2" class="w-12 h-12 animate-spin mx-auto mb-4" style="color:var(--brand-light);"></i>
                <p style="color:var(--text-2);font-weight:500;">Loading your dashboard...</p>
            </div>
        </div>`;
        lucide.createIcons();

        try {
            const [profileData, statsData, tasksData, dailyTaskData] = await Promise.all([
                fetchUserProfile().catch(e => { console.warn("Profile load failed:", e); return null; }),
                fetchUserStats().catch(e => { console.warn("Stats load failed:", e); return null; }),
                fetchData('/tasks/available').catch(e => {
                    console.warn("Tasks fetch failed, using mock:", e.message);
                    return { tasks: MOCK_TASK_DEFINITIONS, success: true };
                }),
                fetchDailyTask(),
            ]);

            cachedTasks = tasksData.tasks;
            if (dailyTaskData && dailyTaskData.id) {
                localStorage.setItem('dailyTask', JSON.stringify(dailyTaskData));
            } else {
                localStorage.removeItem('dailyTask');
            }

            const hash = window.location.hash.slice(1);
            const route = hash || 'tasks';

            if (route === 'tasks') {
                renderTasksList(cachedTasks, dailyTaskData);
            } else if (route === 'my-tasks') {
                const myTasksData = await fetchData('/tasks/my-tasks');
                renderMyTasks(myTasksData.tasks);
            } else if (route === 'earnings') {
                renderEarnings();
            } else if (route === 'affiliate') {
                renderAffiliateProfile();
            } else if (route === 'achievements') {
                renderAchievements();
            } else if (route.startsWith('tasks/')) {
                const taskId = route.split('/')[1];
                await renderTaskDetail(taskId);
            }
        } catch (error) {
            console.error("Critical Load Error:", error);
            if (!AUTH_TOKEN) return;
            appContainer.innerHTML = `
            <div class="card p-12 text-center mt-8">
                <i data-lucide="wifi-off" class="w-16 h-16 mx-auto mb-4" style="color:#f87171;"></i>
                <h3 style="font-family:Syne,sans-serif;font-size:1.4rem;font-weight:800;color:#f87171;margin-bottom:8px;">Connection Error</h3>
                <p class="mb-6" style="color:var(--text-2);">Unable to load dashboard data. Please check your connection.</p>
                <button onclick="location.reload()" class="btn-primary" style="max-width:180px;margin:0 auto;">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i><span>Retry</span>
                </button>
            </div>`;
            lucide.createIcons();
        }
    }

    async function initializeApp() {
        createStarField();
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token');
        if (urlToken) {
            AUTH_TOKEN = urlToken;
            localStorage.setItem('btech_auth_token', AUTH_TOKEN);
        } else if (localStorage.getItem('btech_auth_token')) {
            AUTH_TOKEN = localStorage.getItem('btech_auth_token');
        }

        if (!AUTH_TOKEN || AUTH_TOKEN.length < 100) {
            renderSignInScreen();
            return;
        }

        const taskIdFromUrl = params.get('taskid');
        if (taskIdFromUrl) {
            window.history.replaceState(null, null, window.location.pathname + window.location.hash);
            updateMobileNav('tasks');
            await renderTaskDetail(taskIdFromUrl);
            return;
        }

        if (window.location.search) {
            window.history.replaceState(null, null, window.location.pathname + window.location.hash);
        }

        const hash = window.location.hash.slice(1);
        updateMobileNav(hash || 'tasks');
        await loadContent();
    }

    function renderSignInScreen() {
        const appContainer = document.getElementById('app-container');
        appContainer.innerHTML = `
        <div class="signin-card fade-in-up">
            <div class="logo-ring mx-auto mb-6" style="width:72px;height:72px;border-radius:20px;">
                <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
            </div>
            <h3 style="font-family:Syne,sans-serif;font-size:clamp(1.5rem,5vw,2rem);font-weight:800;color:var(--text-1);margin-bottom:8px;">Welcome to BTECH PRO</h3>
            <p class="mb-8" style="color:var(--text-2);max-width:340px;margin-left:auto;margin-right:auto;line-height:1.6;">Sign in to access your personalized dashboard and start earning today.</p>

            <div style="max-width:300px;margin:0 auto;display:flex;flex-direction:column;gap:12px;">
                <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>
                <button onclick="location.reload()" class="btn-secondary py-3 text-sm">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i><span>Retry Mobile Session</span>
                </button>
            </div>

            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:320px;margin:32px auto 0;">
                <div class="signin-stat"><div class="val">500+</div><div class="lbl">Active Users</div></div>
                <div class="signin-stat"><div class="val">KES 2M+</div><div class="lbl">Paid Out</div></div>
                <div class="signin-stat"><div class="val">1000+</div><div class="lbl">Tasks Done</div></div>
            </div>
        </div>`;
        lucide.createIcons();
    }

    window.addEventListener('hashchange', loadContent);
    window.onload = initializeApp;

    // Global exposures ← UNCHANGED
    window.handleCredentialResponse = handleCredentialResponse;
    window.setRoute = setRoute;
    window.simulateLogout = simulateLogout;
    window.toggleNotifications = function() {
        document.getElementById('notifications-dropdown').classList.toggle('hidden');
        lucide.createIcons();
    };
    window.closeAlert = closeAlert;
    window.closeModal = closeModal;
    window.acceptTask = acceptTask;
    window.acceptAndNavigateToSurvey = acceptAndNavigateToSurvey;
    window.submitGenericFileTask = submitGenericFileTask;
    window.handleFileSelectForGeneric = handleFileSelectForGeneric;
    window.submitDailySurvey = submitDailySurvey;
    window.applyFilters = applyFilters;
    window.resetFilters = resetFilters;
    window.navigateToTaskDetail = function(taskId) { setRoute(`tasks/${taskId}`); };
    window.copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => showAlert('Copied to clipboard!', true)).catch(() => showAlert('Failed to copy', false));
    };
    window.shareReferral = (link) => {
        const message = `Join BTECH Earning Network and start earning today! Use my referral link: ${link}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
    };
    window.showWithdrawalModal = showWithdrawalModal;
</script>
</body>
</html>
