        /* CSS STYLES (Kept consistent with your design) */

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        * { font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: #0a0e27; position: relative; overflow-x: hidden; }

        .animated-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); opacity: 0.9; }

        .animated-bg::before { content: ''; position: absolute; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px; animation: moveGrid 20s linear infinite; }

        .ultra-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }

        .btn-premium::after { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.3); transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s; }

        .btn-premium:active::after { width: 300px; height: 300px; }

        .btn-premium:hover { transform: translateY(-3px); box-shadow: 0 15px 50px -10px rgba(102, 126, 234, 0.8); }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }

        .float-animation { animation: float 3s ease-in-out infinite; }

        @keyframes progressShine { 0% { left: -100%; } 100% { left: 200%; } }

        .mobile-nav { background: rgba(10, 14, 39, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1); }

    // --- Core Web Sign-In and Initialization Logic ---

    // NEW: Handles the Google Sign-In response (receives Google JWT)
    async function handleCredentialResponse(response) {
        if (response.credential) {
            showAlert('Google Sign-In successful. Syncing account...', true);
            
            // Send the Google JWT to your backend for Firebase verification and provisioning
            try {
                const apiResponse = await fetch(`${BACKEND_URL}/auth/provision`, {
                    method: 'GET', // Provision endpoint uses GET based on your server.js
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${response.credential}` // Send Google JWT
                    }
                });

                const data = await apiResponse.json();

                if (apiResponse.ok && data.success) {
                    // NOTE: Your current API design provisions the user but doesn't return a new JWT.
                    // Assuming the next request relies on the *current* Firebase session or mobile token.
                    // For now, we will simply reload to ensure the new user state is recognized.
                    showAlert(`Welcome, ${data.user.fullName || data.user.email}! Loading dashboard.`, true);
                    location.reload(); 
                } else {
                    showAlert(data.error || 'Account provisioning failed on the server.', false);
                }

            } catch (error) {
                showAlert('Network error during provisioning.', false);
                console.error("Provisioning network error:", error);
            }
        }
    }

    async function initializeApp() {
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token');
        
        // 1. Check for Mobile Auth Token
        if (urlToken) {
            AUTH_TOKEN = urlToken;
            localStorage.setItem('btech_auth_token', AUTH_TOKEN);
            console.log("AUTH_DEBUG: Token initialized from URL query parameter.");
        } else if (localStorage.getItem('btech_auth_token')) {
             AUTH_TOKEN = localStorage.getItem('btech_auth_token');
             console.log("AUTH_DEBUG: Token loaded from local storage.");
        } 
        
        const appContainer = document.getElementById('app-container');
        
        // 2. Check if a valid session exists
        if (!AUTH_TOKEN || AUTH_TOKEN.length < 100) {
             // Show Sign-In Screen with Google Button
             appContainer.innerHTML = `
                 <div class="ultra-card p-8 md:p-12 text-center mt-12">
                     <div class="empty-state-icon mb-6">
                         <i data-lucide="shield-alert" class="w-20 h-20 md:w-24 md:h-24 text-red-500 mx-auto"></i>
                     </div>
                     <h3 class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Sign In to Continue</h3>
                     <p class="text-gray-600 text-sm md:text-base mb-6">Please use your mobile app session or sign in below via Google to access the dashboard.</p>
                     
                     <div id="g_id_onload"
                        data-client_id="YOUR_GOOGLE_CLIENT_ID" 
                        data-callback="handleCredentialResponse"
                        data-auto_prompt="false"
                        data-context="signin"
                        data-login_uri="${window.location.href}"
                    ></div>
                    <div class="g_id_signin" 
                        data-type="standard" 
                        data-size="large" 
                        data-theme="outline" 
                        data-text="sign_in_with" 
                        data-shape="rectangular" 
                        data-logo_alignment="left">
                    </div>
                    <button onclick="location.reload()" class="btn-premium text-white font-bold py-3 px-8 rounded-2xl ripple mt-6">
                         Retry Mobile Session
                    </button>
                 </div>
             `;
             lucide.createIcons();
             return; 
        }
        
        // 3. Valid Session Exists: Proceed to load content
        await Promise.all([
            checkAuthToken(),
            fetchUserProfile(), 
            fetchUserStats()
        ]);
        
        if (window.location.search) {
             window.history.replaceState(null, null, window.location.pathname + window.location.hash);
        }

        const hash = window.location.hash.slice(1);
        setRoute(hash || 'tasks');
    }

    async function fetchUserProfile() {
        if (cache.profileLoaded) { return; }
        try {
            const result = await fetchData('/user/profile', { method: 'GET' });
            if (result.success && result.user) {
                currentUserEmail = result.user.email;
                userProfile = result.user; 
                cache.profileLoaded = true;
            }
        } catch (error) {
            console.error("Warning: Failed to fetch full user profile (likely rate limit). Using defaults.");
        }
    }
    
    async function checkAuthToken() {
        try {
            await fetchData('/earnings/summary', { method: 'GET' });
            return true; 
        } catch (error) {
            console.error("CRITICAL AUTH CHECK FAILED:", error.message);
            return true; 
        }
    }

    // --- Utility Functions (Only changed fetch methods shown) ---

    function showAlert(message, isSuccess = true) { /* ... */ }
    function simulateLogout() { /* ... */ }
    function setRoute(path) { /* ... */ }
    function updateMobileNav(route) { /* ... */ }

    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN) { throw new Error('Authentication token missing.'); }
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${AUTH_TOKEN}`, ...options.headers };
        const config = { method: options.method || 'GET', headers: headers, ...(options.body && { body: JSON.stringify(options.body) }), };

        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`, config);
            const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));
            
            if (!response.ok) {
                if (response.status === 401 || response.status === 403) { throw new Error("Token expired or invalid. Please re-login."); }
                if (response.status === 429) { throw new Error("Rate limit exceeded. Please wait a moment and try again."); }
                if (response.status === 402 && data.error) { throw new Error(data.error); }
                throw new Error(data.error || `Error: ${response.status}`);
            }
            if (!data.success && data.error) { throw new Error(data.error); }
            return data;
        } catch (error) {
            console.error('API Error:', error.message);
            showAlert(`Error: ${error.message}`, false);
            throw error;
        }
    }
    
    async function fetchDailyTask() {
        try {
            const data = await fetchData('/tasks/daily', { method: 'GET' });
            return data.task;
        } catch (error) {
            console.error("Failed to fetch daily task:", error);
            // Fallback to local mock data definition
            return MOCK_TASK_DEFINITIONS.find(t => t.id === 1) || null;
        }
    }

    async function fetchUserStats() {
        if (cache.statsLoaded) { return; }
        try {
            const earningsData = await fetchData('/earnings/summary');
            const myTasksData = await fetchData('/tasks/my-tasks');

            userStats.totalEarned = parseFloat(earningsData.earnings.totalEarnings || 0);
            userStats.availableBalance = parseFloat(earningsData.earnings.availableBalance || 0);
            userStats.pendingEarnings = parseFloat(earningsData.earnings.pendingEarnings || 0);
            userStats.tasksCompleted = parseInt(earningsData.earnings.completedTasks || 0);
            userStats.activeTasks = myTasksData.tasks.filter(t => t.status === 'IN_PROGRESS' || t.status === 'PENDING_VERIFICATION').length;
            
            cache.statsLoaded = true;
        } catch (e) {
            console.error("Warning: Could not fetch real-time stats/tasks. Displaying 0s.");
            userStats = { totalEarned: 0, availableBalance: 0, pendingEarnings: 0, tasksCompleted: 0, activeTasks: 0 };
        }
    }

    const getTaskPayout = (task) => { /* ... */ return parseFloat(task.payment || task.payout || 0).toFixed(2); }
    const getTaskDifficulty = (task) => { /* ... */ return (task.difficulty || 'Easy').toLowerCase(); }
    function getCategoryIcon(category) { /* ... */ return 'briefcase'; }

</script>
