<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH Earning Network | Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* Custom Styles for Professional Aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e27;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            opacity: 0.9;
        }

        .animated-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        /* Ultra Modern Cards */
        .ultra-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .ultra-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 35px 70px -15px rgba(102, 126, 234, 0.4);
        }

        .ultra-card:hover::before {
            left: 100%;
        }

        /* Glassmorphism Header */
        .glass-header {
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Premium Buttons */
        .btn-premium {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 40px -10px rgba(102, 126, 234, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-premium::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-premium:active::after {
            width: 300px;
            height: 300px;
        }

        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px -10px rgba(102, 126, 234, 0.8);
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }

        /* Progress Bar */
        .progress-glow {
            position: relative;
            overflow: hidden;
        }

        .progress-glow::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: progressShine 2s infinite;
        }

        @keyframes progressShine {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        /* Mobile Bottom Nav */
        .mobile-nav {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: #667eea;
        }

        /* Stats Card Animation */
        .stats-shine {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Fade In Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        /* Badge Styles */
        .badge-glow {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
            50% { box-shadow: 0 0 30px rgba(102, 126, 234, 0.8); }
        }

        /* Input Focus */
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
            transform: scale(1.02);
        }

        /* Scroll Behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .ultra-card {
                border-radius: 20px;
            }
            
            .btn-premium {
                padding: 14px 24px;
                font-size: 15px;
            }

            .mobile-header-title {
                font-size: 20px;
            }
        }

        /* Alert Animation */
        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-slide {
            animation: slideInRight 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Ripple Effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .ripple:active::before {
            width: 400px;
            height: 400px;
        }

        /* Task Category Icons */
        .category-icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(240, 147, 251, 0.1));
        }

        /* Difficulty Badge */
        .difficulty-easy { background: linear-gradient(135deg, #10b981, #34d399); }
        .difficulty-medium { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .difficulty-hard { background: linear-gradient(135deg, #ef4444, #f87171); }

        /* Status Badge */
        .status-pending { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .status-progress { background: linear-gradient(135deg, #667eea, #764ba2); }
        .status-completed { background: linear-gradient(135deg, #10b981, #34d399); }

        /* Empty State */
        .empty-state-icon {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="animated-bg"></div>
    
    <div class="content-wrapper">
        <header class="glass-header sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                            <i data-lucide="zap" class="w-7 h-7 text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-xl md:text-2xl font-black text-white mobile-header-title">BTECH</h1>
                            <p class="text-xs text-gray-300 font-medium">Earning Pro</p>
                        </div>
                    </div>
                    
                    <nav class="hidden md:flex items-center space-x-6">
                        <a href="javascript:void(0)" onclick="setRoute('tasks')" class="text-gray-300 hover:text-white font-medium text-sm transition">
                            Tasks
                        </a>
                        <a href="javascript:void(0)" onclick="setRoute('my-tasks')" class="text-gray-300 hover:text-white font-medium text-sm transition">
                            My Tasks
                        </a>
                        <a href="javascript:void(0)" onclick="setRoute('earnings')" class="text-gray-300 hover:text-white font-medium text-sm transition">
                            Earnings
                        </a>
                        <button onclick="simulateLogout()" class="px-4 py-2 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold text-sm transition">
                            Logout
                        </button>
                    </nav>

                    <button onclick="simulateLogout()" class="md:hidden p-2 rounded-xl bg-red-500 text-white">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 pb-24 md:pb-8">
            <div id="status-alert" class="hidden fixed top-20 right-4 left-4 md:left-auto md:right-4 z-50 max-w-md alert-slide" role="alert">
                <div class="ultra-card p-4">
                    <div class="flex items-center space-x-3">
                        <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" id="alert-icon-bg">
                            <i data-lucide="check-circle" class="w-6 h-6" id="alert-icon"></i>
                        </div>
                        <p class="font-semibold text-gray-800 flex-1" id="alert-message"></p>
                    </div>
                </div>
            </div>

            <div id="app-container"></div>
        </main>

        <nav class="mobile-nav fixed bottom-0 left-0 right-0 z-40 md:hidden">
            <div class="flex justify-around items-center py-3 px-2">
                <button onclick="setRoute('tasks')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-tasks">
                    <i data-lucide="briefcase" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Tasks</span>
                </button>
                <button onclick="setRoute('my-tasks')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-my-tasks">
                    <i data-lucide="list-checks" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">My Tasks</span>
                </button>
                <button onclick="setRoute('earnings')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-earnings">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Earnings</span>
                </button>
                <button onclick="setRoute('affiliate')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-affiliate">
                    <i data-lucide="users" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Affiliate</span>
                </button>
            </div>
        </nav>
    </div>

    <div id="action-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="ultra-card p-8 max-w-md w-full text-center fade-in-up">
            <div class="w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center" id="modal-icon-bg">
                <i id="modal-icon" data-lucide="check-circle" class="w-12 h-12"></i>
            </div>
            <h3 id="modal-title" class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Success!</h3>
            <p id="modal-message" class="text-gray-600 text-sm md:text-base mb-6 leading-relaxed">Your action was completed successfully!</p>
            <button onclick="closeModal()" class="btn-premium text-white font-bold py-4 px-8 rounded-2xl w-full ripple">
                Continue
            </button>
        </div>
    </div>

<script>
    const BACKEND_URL = "https://btech-earning-api.onrender.com/api";
    const FORMSPREE_SURVEY_URL = "https://formspree.io/f/mblolava"; // Your Formspree URL
    let AUTH_TOKEN; 
    let cachedTasks = [];
    let userStats = { totalEarned: 0, availableBalance: 0, pendingEarnings: 0, tasksCompleted: 0, activeTasks: 0 }; 
    let currentUserEmail = ""; // To be fetched and used for Formspree submission identity
    let userProfile = {}; // Store full user profile data

    const appContainer = document.getElementById('app-container');
    const statusAlert = document.getElementById('status-alert');

    // --- Core Initialization Logic ---

    async function initializeApp() {
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token');
        
        if (urlToken) {
            AUTH_TOKEN = urlToken;
            localStorage.setItem('btech_auth_token', AUTH_TOKEN);
            console.log("AUTH_DEBUG: Token initialized from URL query parameter.");
        } else if (localStorage.getItem('btech_auth_token')) {
             AUTH_TOKEN = localStorage.getItem('btech_auth_token');
             console.log("AUTH_DEBUG: Token loaded from local storage.");
        } 
        
        if (!AUTH_TOKEN || AUTH_TOKEN.length < 100) {
             console.error("AUTH_DEBUG: Token is missing or invalid. Access Denied.");
             showAlert("Authentication required. Please log in through the mobile app.", false);
             appContainer.innerHTML = `
                 <div class="ultra-card p-8 md:p-12 text-center mt-12">
                     <div class="empty-state-icon mb-6">
                         <i data-lucide="shield-alert" class="w-20 h-20 md:w-24 md:h-24 text-red-500 mx-auto"></i>
                     </div>
                     <h3 class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Access Denied</h3>
                     <p class="text-gray-600 text-sm md:text-base mb-6">Please log in through the BTECH Plus App to continue.</p>
                     <button onclick="location.reload()" class="btn-premium text-white font-bold py-3 px-8 rounded-2xl ripple">
                         Retry Connection
                     </button>
                 </div>
             `;
             lucide.createIcons();
             return; 
        }
        
        const authValid = await checkAuthToken();
        if (!authValid) {
             return; 
        }

        // 🛠️ Fetch user profile (including referral data) and stats
        await Promise.all([
            fetchUserProfile(),
            fetchUserStats()
        ]);
        

        if (window.location.search) {
             window.history.replaceState(null, null, window.location.pathname + window.location.hash);
        }

        const hash = window.location.hash.slice(1);
        if (!hash || hash === 'tasks' || hash === 'my-tasks' || hash === 'earnings' || hash === 'affiliate') {
            setRoute(hash || 'tasks');
        } else if (hash.startsWith('tasks/')) {
            loadContent();
        }
    }

    async function fetchUserProfile() {
        try {
            const result = await fetchData('/user/profile', { method: 'GET' });
            if (result.success && result.user) {
                currentUserEmail = result.user.email;
                userProfile = result.user; // Store full profile data
                console.log(`User Profile & Referral data fetched.`);
            }
        } catch (error) {
            console.error("Failed to fetch user profile.", error);
        }
    }
    
    async function checkAuthToken() {
        try {
            await fetchData('/earnings/summary', { method: 'GET' });
            return true;
        } catch (error) {
            console.error("AUTH_VALIDATION_FAILED: Stopping content load.", error.message);
            return false;
        }
    }


    // --- Utility Functions ---

    function showAlert(message, isSuccess = true) {
        const iconBg = document.getElementById('alert-icon-bg');
        const icon = document.getElementById('alert-icon');
        const msg = document.getElementById('alert-message');
        
        iconBg.className = isSuccess ? 'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-green-100' : 'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-red-100';
        icon.className = isSuccess ? 'w-6 h-6 text-green-600' : 'w-6 h-6 text-red-600';
        icon.setAttribute('data-lucide', isSuccess ? 'check-circle' : 'alert-circle');
        
        msg.textContent = message;
        statusAlert.classList.remove('hidden');
        lucide.createIcons();
        
        setTimeout(() => {
            statusAlert.style.opacity = '0';
            setTimeout(() => {
                statusAlert.classList.add('hidden');
                statusAlert.style.opacity = '1';
            }, 300);
        }, 5000);
    }
    
    function simulateLogout() {
        localStorage.removeItem('btech_auth_token');
        showAlert("Logged out successfully!", true);
        setTimeout(() => window.location.reload(), 1500);
    }
    
    function setRoute(path) {
        window.location.hash = `#${path}`;
        updateMobileNav(path);
        loadContent();
    }

    function updateMobileNav(route) {
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.classList.remove('active', 'text-indigo-500');
            item.classList.add('text-gray-400');
        });
        
        const baseRoute = route.split('/')[0];

        const activeNav = document.getElementById(`nav-${baseRoute}`);
        if (activeNav) {
            activeNav.classList.add('active', 'text-indigo-500');
            activeNav.classList.remove('text-gray-400');
        }
    }

    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN) {
            throw new Error('Authentication token missing.');
        }

        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${AUTH_TOKEN}`,
            ...options.headers
        };

        const config = {
            method: options.method || 'GET',
            headers: headers,
            ...(options.body && { body: JSON.stringify(options.body) }),
        };

        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`, config);
            const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));
            
            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    throw new Error("Token expired or invalid. Please re-login.");
                }
                if (response.status === 402 && data.error) {
                    throw new Error(data.error);
                }
                throw new Error(data.error || `Error: ${response.status}`);
            }

            if (!data.success && data.error) {
                throw new Error(data.error);
            }
            
            console.log('FETCH_DEBUG: Request successful.');
            return data;
        } catch (error) {
            console.error('API Error:', error.message);
            showAlert(`Error: ${error.message}`, false);
            throw error;
        }
    }
    
    async function fetchDailyTask() {
        try {
            const data = await fetchData('/tasks/daily', { method: 'GET' });
            return data.task;
        } catch (error) {
            console.error("Failed to fetch daily task:", error);
            return null;
        }
    }

    async function fetchUserStats() {
        try {
            const earningsData = await fetchData('/earnings/summary');
            const myTasksData = await fetchData('/tasks/my-tasks');

            userStats.totalEarned = parseFloat(earningsData.earnings.totalEarnings || 0);
            userStats.availableBalance = parseFloat(earningsData.earnings.availableBalance || 0);
            userStats.pendingEarnings = parseFloat(earningsData.earnings.pendingEarnings || 0);
            userStats.tasksCompleted = parseInt(earningsData.earnings.completedTasks || 0);
            userStats.activeTasks = myTasksData.tasks.filter(t => t.status === 'IN_PROGRESS' || t.status === 'PENDING_VERIFICATION').length;
        } catch (e) {
            console.error("Failed to load user stats for dashboard:", e);
        }
    }


    const getTaskPayout = (task) => {
        const value = task.payment || task.payout;
        return parseFloat(value || 0).toFixed(2);
    }
    const getTaskDifficulty = (task) => {
        return (task.difficulty || 'Easy').toLowerCase();
    }


    // --- MAIN RENDER LOGIC ---
    
    function getCategoryIcon(category) {
        switch (category) {
            case 'Data Entry':
            case 'Data Quality Assurance':
                return 'database';
            case 'Transcription':
                return 'mic';
            case 'QA Testing':
                return 'bug';
            case 'Content Creation':
                return 'edit';
            case 'Market Research':
            case 'Survey/Profiling':
                return 'trending-up';
            case 'Account Creation':
                return 'users';
            case 'Local Data Verification':
                return 'map-pin';
            case 'AI Training/Labeling':
                return 'sparkles';
            case 'Translation':
                return 'globe';
            default:
                return 'briefcase';
        }
    }


    function renderTasksList(tasks, dailyTask) {
        cachedTasks = tasks;
        
        // 1. Daily Task Rendering
        const dailyTaskHtml = dailyTask ? `
            <div class="ultra-card p-4 md:p-6 mb-6 border-2 border-indigo-400 bg-indigo-50">
                <h3 class="text-lg md:text-xl font-black text-indigo-700 mb-2 flex items-center space-x-2">
                    <i data-lucide="zap" class="w-5 h-5"></i>
                    <span>Today's Microtask: ${dailyTask.title || 'N/A'}</span>
                </h3>
                <p class="text-sm text-gray-700 mb-3">Category: ${dailyTask.category || 'N/A'} | Payout: KES ${getTaskPayout(dailyTask)}</p>
                
                ${dailyTask.isCompleted ? `
                    <button class="w-full bg-green-500 text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2 opacity-70" disabled>
                        <i data-lucide="check" class="w-5 h-5"></i>
                        <span>COMPLETED TODAY</span>
                    </button>
                ` : `
                    <button onclick="acceptAndNavigateToSurvey(${dailyTask.id})" class="btn-premium w-full text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2 ripple">
                        <i data-lucide="clipboard-list" class="w-5 h-5"></i>
                        <span>Start Survey</span>
                    </button>
                `}
            </div>
        ` : `
             <div class="ultra-card p-4 md:p-6 mb-6 text-center text-gray-500">
                <i data-lucide="calendar-x" class="w-8 h-8 mx-auto mb-2 text-gray-400"></i>
                <p class="text-sm">No new microtasks available today. Check back tomorrow!</p>
             </div>
        `;


        // 2. Main Tasks Rendering
        const mainTasksHtml = Array.isArray(tasks) && tasks.length > 0 ? tasks.map((task, i) => `
            <div class="ultra-card p-5 md:p-6 fade-in-up" style="animation-delay: ${i * 0.1}s">
                <div class="flex justify-between items-start mb-4">
                    <div class="category-icon">
                        <i data-lucide="${getCategoryIcon(task.category)}" class="w-6 h-6 text-indigo-600"></i>
                    </div>
                    <span class="difficulty-${getTaskDifficulty(task)} text-white text-xs font-bold px-3 py-1 rounded-full">
                        ${task.difficulty || 'N/A'}
                    </span>
                </div>
                
                <h3 class="text-lg md:text-xl font-black text-gray-800 mb-3 leading-tight">${task.title || 'N/A'}</h3>
                
                <div class="mb-4">

        const submitBtn = document.getElementById('survey-submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Submitting...</span>';
        lucide.createIcons();

        const surveyQuestions = [
            "q1_app_rating", "q2_task_clarity", "q3_payout_fairness", "q4_ease_of_use",
            "q5_task_variety", "q6_referral_usage", "q7_favorite_feature", "q8_improvement_area",
            "q9_recommendation", "q10_age_group"
        ];
        
        let surveyData = {
            'User Email': currentUserEmail || 'N/A',
            'Task ID': taskId,
            '_subject': `BTECH Daily Survey Submission (ID: ${taskId})`
        };
        let allAnswered = true;

        surveyQuestions.forEach(q => {
            const element = document.getElementById(q);

                surveyData[q] = element.value;
            } else {
                allAnswered = false;
            }
        });
        
        if (!allAnswered) {
            showAlert('Please answer all 10 questions before submitting.', false);

            submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Survey</span>';

            await fetchData('/tasks/submit-daily-task', {

                body: { taskId: taskId }

                closeModal();
                setRoute('my-tasks');

            console.error("Survey submission failure:", error);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Survey</span>';
            lucide.createIcons();
        }
    }

    async function submitFileTask(taskId) {
        const fileInput = document.getElementById(`submission-file-${taskId}`);
        const file = fileInput.files[0];
        
        if (!file) {
            showAlert('Please select a file to upload.', false);
            return;
        }

        const submitBtn = document.getElementById(`submit-file-btn-${taskId}`);
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Uploading...</span>';
        lucide.createIcons();
        
        const formData = new FormData();
        formData.append('document', file);
        formData.append('documentType', `Task-ID-${taskId} Submission`);

        try {
             const response = await fetch(`${BACKEND_URL}/user/verify`, {
                 method: 'POST',
                 headers: {
                     'Authorization': `Bearer ${AUTH_TOKEN}`,
                 },
                 body: formData,
             });

             const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));

             if (response.ok && data.success) {
                 showModal('Submitted!', 'Your file is under review. Check My Tasks for updates.', 'success');
                 setTimeout(() => { closeModal(); setRoute('my-tasks'); }, 2500);
             } else {
                 showAlert(data.error || 'File submission failed.', false);
             }
        } catch (error) {
            showAlert('Upload failed due to network error.', false);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="upload" class="w-5 h-5"></i><span>Upload & Submit for Review</span>';
            lucide.createIcons();
        }
    }

                                <i data-lucide="clock" class="w-4 h-4 text-indigo-600"></i>
                                <span>${task.estimatedTime || 'N/A'}</span>
                            </div>
                            <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-xl">
                                <i data-lucide="calendar" class="w-4 h-4 text-indigo-600"></i>
                                <span>Due: ${task.deadline || 'N/A'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-2 ultra-card p-5 md:p-8">
                         ${isDailyTask ? renderDailySurveyForm(task.id) : renderSubmissionForm(task)}
                    </div>
                </div>
            </div>
        `;
        
        const textarea = document.getElementById('accounts-list');
        if (textarea) {
            textarea.addEventListener('input', updateCountIndicator);
            updateCountIndicator();
        }

        lucide.createIcons();
    }


    // --- LOAD AND RENDER LOGIC ---
    
    async function loadContent() {
        appContainer.innerHTML = `
            <div class="flex items-center justify-center py-20">
                <div class="text-center">
                    <i data-lucide="loader-2" class="w-12 h-12 md:w-16 md:h-16 text-white animate-spin mx-auto mb-4"></i>
                    <p class="text-white font-bold text-sm md:text-base">Loading...</p>
                </div>
            </div>
        `;
        lucide.createIcons();

        const [tasksData, dailyTaskData] = await Promise.all([
            fetchData('/tasks/available').catch(e => { console.error("Major tasks failed:", e); return null; }),
            fetchDailyTask(),
            fetchUserStats(),
        ]);
        
        if (dailyTaskData) {
            localStorage.setItem('dailyTask', JSON.stringify(dailyTaskData));
        } else {
            localStorage.removeItem('dailyTask');
        }


        const hash = window.location.hash.slice(1);
        
        if (hash === 'tasks' || hash === '') {
             if (tasksData) {
                 renderTasksList(tasksData.tasks, dailyTaskData);
             } else {
                 appContainer.innerHTML = `
                     <div class="ultra-card p-8 md:p-12 text-center mt-12">
                         <div class="empty-state-icon mb-6">
                             <i data-lucide="wifi-off" class="w-20 h-20 md:w-24 md:h-24 text-red-500 mx-auto"></i>
                         </div>
                         <h3 class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Connection Error</h3>
                         <p class="text-gray-600 text-sm md:text-base mb-6">Unable to load tasks. Please retry.</p>
                         <button onclick="loadContent()" class="btn-premium text-white font-bold py-3 px-8 rounded-2xl ripple">
                             Retry
                         </button>
                     </div>
                 `;
                 lucide.createIcons();
             }
        } else if (hash === 'my-tasks') {
            const data = await fetchData('/tasks/my-tasks');
            if (data) renderMyTasks(data.tasks);
        } else if (hash === 'earnings') {
            renderEarnings();
        } else if (hash === 'affiliate') {
            renderAffiliateProfile(); // NEW AFFILIATE RENDERER
        }
         else if (hash.startsWith('tasks/')) {
            const taskId = hash.split('/')[1];
            if (cachedTasks.length === 0 && tasksData) {
                 cachedTasks = tasksData.tasks;
            }
            renderTaskDetail(taskId);
        }
    }

    function copyToClipboard(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert('Referral code copied to clipboard!', true);
            }).catch(err => {
                showAlert('Failed to copy code. Try manually.', false);
            });
        } else {
             showAlert('Clipboard access not supported.', false);
        }
    }

    // Initializers
    window.addEventListener('hashchange', loadContent);
    window.onload = initializeApp;
