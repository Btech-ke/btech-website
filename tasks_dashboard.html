<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH Earning Network | Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script> 
    <style>
        /* Custom Styles for Professional Aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e27;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            opacity: 0.9;
        }

        .animated-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        /* Ultra Modern Cards */
        .ultra-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .ultra-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 35px 70px -15px rgba(102, 126, 234, 0.4);
        }

        .ultra-card:hover::before {
            left: 100%;
        }

        /* Glassmorphism Header */
        .glass-header {
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Premium Buttons */
        .btn-premium {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 40px -10px rgba(102, 126, 234, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-premium::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-premium:active::after {
            width: 300px;
            height: 300px;
        }

        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px -10px rgba(102, 126, 234, 0.8);
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }

        /* Progress Bar */
        .progress-glow {
            position: relative;
            overflow: hidden;
        }

        .progress-glow::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: progressShine 2s infinite;
        }

        @keyframes progressShine {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        /* Mobile Bottom Nav */
        .mobile-nav {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: #667eea;
        }

        /* Stats Card Animation */
        .stats-shine {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Fade In Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        /* Badge Styles */
        .badge-glow {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
            50% { box-shadow: 0 0 30px rgba(102, 126, 234, 0.8); }
        }

        /* Input Focus */
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
            transform: scale(1.02);
        }

        /* Scroll Behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .ultra-card {
                border-radius: 20px;
            }
            
            .btn-premium {
                padding: 14px 24px;
                font-size: 15px;
            }

            .mobile-header-title {
                font-size: 20px;
            }
        }

        /* Alert Animation */
        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-slide {
            animation: slideInRight 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Ripple Effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .ripple:active::before {
            width: 400px;
            height: 400px;
        }

        /* Task Category Icons */
        .category-icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(240, 147, 251, 0.1));
        }

        /* Difficulty Badge */
        .difficulty-easy { background: linear-gradient(135deg, #10b981, #34d399); }
        .difficulty-medium { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .difficulty-hard { background: linear-gradient(135deg, #ef4444, #f87171); }

        /* Status Badge */
        .status-pending { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .status-progress { background: linear-gradient(135deg, #667eea, #764ba2); }
        .status-completed { background: linear-gradient(135deg, #10b981, #34d399); }

        /* Empty State */
        .empty-state-icon {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="animated-bg"></div>
    
    <div class="content-wrapper">
        <header class="glass-header sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                            <i data-lucide="zap" class="w-7 h-7 text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-xl md:text-2xl font-black text-white mobile-header-title">BTECH</h1>
                            <p class="text-xs text-gray-300 font-medium">Earning Pro</p>
                        </div>
                    </div>
                    
                    <nav class="hidden md:flex items-center space-x-6">
                        <a href="javascript:void(0)" onclick="setRoute('tasks')" class="text-gray-300 hover:text-white font-medium text-sm transition">
                            Tasks
                        </a>
                        <a href="javascript:void(0)" onclick="setRoute('my-tasks')" class="text-gray-300 hover:text-white font-medium text-sm transition">
                            My Tasks
                        </a>
                        <a href="javascript:void(0)" onclick="setRoute('earnings')" class="text-gray-300 hover:text-white font-medium text-sm transition">
                            Earnings
                        </a>
                        <a href="javascript:void(0)" onclick="setRoute('affiliate')" class="text-gray-300 hover:text-white font-medium text-sm transition">

        <main class="max-w-7xl mx-auto px-4 py-6 pb-24 md:pb-8">

        <nav class="mobile-nav fixed bottom-0 left-0 right-0 z-40 md:hidden">
            <div class="flex justify-around items-center py-3 px-2">
                <button onclick="setRoute('tasks')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-tasks">
                    <i data-lucide="briefcase" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Tasks</span>
                </button>
                <button onclick="setRoute('my-tasks')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-my-tasks">
                    <i data-lucide="list-checks" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">My Tasks</span>
                </button>
                <button onclick="setRoute('earnings')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-earnings">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Earnings</span>
                </button>
                <button onclick="setRoute('affiliate')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-affiliate">

                    <span class="text-xs font-medium">Affiliate</span>

            </div>
        </nav>
    </div>

    <div id="action-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="ultra-card p-8 max-w-md w-full text-center fade-in-up">
            <div class="w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center" id="modal-icon-bg">
                <i id="modal-icon" data-lucide="check-circle" class="w-12 h-12"></i>
            </div>
            <h3 id="modal-title" class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Success!</h3>
            <p id="modal-message" class="text-gray-600 text-sm md:text-base mb-6 leading-relaxed">Your action was completed successfully!</p>
            <button onclick="closeModal()" class="btn-premium text-white font-bold py-4 px-8 rounded-2xl w-full ripple">
                Continue
            </button>
        </div>
    </div>

<script>
    // --- GLOBAL CONSTANTS AND VARIABLES ---
    // FIX: RESTORING BACKEND_URL to include /api, matching the server.js routing definition.
    const BACKEND_URL = "https://btech-earning-api.onrender.com/api"; 
    const FORMSPREE_SURVEY_URL = "https://formspree.io/f/mblolava"; 
    const REFERRAL_BONUS = 200.00; 
    let AUTH_TOKEN; 
    let cachedTasks = [];
    let userStats = { totalEarned: 0, availableBalance: 0, pendingEarnings: 0, tasksCompleted: 0, activeTasks: 0 }; 
    let currentUserEmail = ""; 
    let userProfile = {}; 

    // --- UTILITY AND MODAL FUNCTIONS (Defined first) ---

    function showAlert(message, isSuccess = true) {
        const statusAlert = document.getElementById('status-alert');
        const iconBg = document.getElementById('alert-icon-bg');
        const icon = document.getElementById('alert-icon');
        const msg = document.getElementById('alert-message');
        
        iconBg.className = isSuccess ? 'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-green-100' : 'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-red-100';
        icon.className = isSuccess ? 'w-6 h-6 text-green-600' : 'w-6 h-6 text-red-600';
        icon.setAttribute('data-lucide', isSuccess ? 'check-circle' : 'alert-circle');
        
        msg.textContent = message;
        statusAlert.classList.remove('hidden');
        lucide.createIcons();
        
        setTimeout(() => {
            statusAlert.style.opacity = '0';
            setTimeout(() => {
                statusAlert.classList.add('hidden');
                statusAlert.style.opacity = '1';
            }, 300);
        }, 5000);
    }
    
    function showModal(title, message, type = 'success') {
        const modal = document.getElementById('action-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalIcon = document.getElementById('modal-icon');
        const modalIconBg = document.getElementById('modal-icon-bg');
        
        modalTitle.textContent = title;
        modalMessage.textContent = message;
        
        if (type === 'success') {
            modalIcon.setAttribute('data-lucide', 'check-circle');
            modalIconBg.className = 'w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center bg-gradient-to-br from-green-400 to-emerald-600';
            modalIcon.className = 'w-12 h-12 text-white';
        } else {
            modalIcon.setAttribute('data-lucide', 'alert-circle');
            modalIconBg.className = 'w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center bg-gradient-to-br from-red-400 to-red-600';
            modalIcon.className = 'w-12 h-12 text-white';
        }
        
        modal.classList.remove('hidden');
        lucide.createIcons();
    }

    function closeModal() {
        document.getElementById('action-modal').classList.add('hidden');
    }

    function copyToClipboard(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert('Code copied to clipboard!', true);
            }, (err) => {
                showAlert('Failed to copy text: ' + err, false);
            });
        } else {
            showAlert('Clipboard access not supported by your browser.', false);
        }
    }

    function simulateLogout() {
        localStorage.removeItem('btech_auth_token');
        showAlert("Logged out successfully!", true);
        setTimeout(() => window.location.reload(), 1500);
    }
    
    function setRoute(path) {
        window.location.hash = `#${path}`;
        updateMobileNav(path);
        loadContent();
    }

    function updateMobileNav(route) {
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.classList.remove('active', 'text-indigo-500');
            item.classList.add('text-gray-400');
        });
        
        const baseRoute = route.split('/')[0];

        const activeNav = document.getElementById(`nav-${baseRoute}`);
        if (activeNav) {
            activeNav.classList.add('active', 'text-indigo-500');
            activeNav.classList.remove('text-gray-400');
        }
    }

    // --- Data Calculation Helpers ---
    const getTaskPayout = (task) => {
        const value = task.payment || task.payout;
        return parseFloat(value || 0).toFixed(2);
    }
    const getTaskDifficulty = (task) => {
        return (task.difficulty || 'Easy').toLowerCase();
    }
    
    function getCategoryIcon(category) {
        switch (category) {
            case 'Data Entry':
            case 'Data Quality Assurance':
                return 'database';
            case 'Transcription':
                return 'mic';
            case 'QA Testing':
                return 'bug';
            case 'Content Creation':
                return 'edit';
            case 'Market Research':
            case 'Survey/Profiling':
                return 'trending-up';
            case 'Account Creation':
                return 'users';
            case 'Local Data Verification':
                return 'map-pin';
            case 'AI Training/Labeling':
                return 'sparkles';
            case 'Translation':
                return 'globe';
            default:
                return 'briefcase';
        }
    }
    
    function updateCountIndicator() {
        const textarea = document.getElementById('accounts-list');
        const indicator = document.getElementById('count-indicator');
        const submitBtn = document.getElementById('submit-btn');

        if (!textarea || !indicator || !submitBtn) return;

        const accounts = textarea.value.trim().split('\n').filter(line => line.trim() !== '');
        const count = accounts.length;

        indicator.innerHTML = `<span class="${count === 50 ? 'text-green-600 font-bold' : 'text-red-500'}">${count} accounts</span>`;

        submitBtn.disabled = count !== 50;
        if (count === 50) {
            submitBtn.classList.remove('opacity-50');
        } else {
            submitBtn.classList.add('opacity-50');
        }
    }


    // --- ASYNCHRONOUS DATA FETCHERS ---

    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN) {
            throw new Error('Authentication token missing.');
        }

        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${AUTH_TOKEN}`,
            ...options.headers
        };

        const config = {
            method: options.method || 'GET',
            headers: headers,
            ...(options.body && { body: JSON.stringify(options.body) }),
        };

        try {
            // BACKEND_URL now includes /api. Endpoint starts with / (e.g., /tasks/available)
            // Final URL: https://.../api/tasks/available (Correct path based on server.js)
            const response = await fetch(`${BACKEND_URL}${endpoint}`, config);
            const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));
            
            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    throw new Error("Token expired or invalid. Please re-login.");
                }
                if (response.status === 402 && data.error) {
                    throw new Error(data.error);
                }
                throw new Error(data.error || `Error: ${response.status}`);
            }

            if (!data.success && data.error) {
                throw new Error(data.error);
            }
            
            return data;
        } catch (error) {
            showAlert(`Error: ${error.message}`, false);
            throw error;
        }
    }
    
    async function fetchDailyTask() {
        try {
            // Corrected endpoint: Removed redundant /api
            const data = await fetchData('/tasks/daily', { method: 'GET' });
            return data.task;
        } catch (error) {
            return null;
        }
    }

    async function fetchUserProfile() {
        try {
            // Corrected endpoint: Removed redundant /api
            const result = await fetchData('/user/profile', { method: 'GET' });
            if (result.success && result.user) {
                currentUserEmail = result.user.email;
                userProfile = result.user; 
            }
        } catch (error) {
            console.error("Failed to fetch user profile.", error);
        }
    }
    
    async function checkAuthToken() {
        try {
            // Corrected endpoint: Removed redundant /api
            await fetchData('/earnings/summary', { method: 'GET' });
            return true;
        } catch (error) {
            return false;
        }
    }

    async function fetchUserStats() {
        try {
            // Corrected endpoints: Removed redundant /api
            const earningsData = await fetchData('/earnings/summary');
            const myTasksData = await fetchData('/tasks/my-tasks');

            userStats.totalEarned = parseFloat(earningsData.earnings.totalEarnings || 0);
            userStats.availableBalance = parseFloat(earningsData.earnings.availableBalance || 0);
            userStats.pendingEarnings = parseFloat(earningsData.earnings.pendingEarnings || 0);
            userStats.tasksCompleted = parseInt(earningsData.earnings.completedTasks || 0);
            userStats.activeTasks = myTasksData.tasks.filter(t => t.status === 'IN_PROGRESS' || t.status === 'PENDING_VERIFICATION').length;
        } catch (e) {
            console.error("Failed to load user stats for dashboard:", e);
        }
    }


    // --- SUBMISSION HANDLERS ---
    
    function acceptAndNavigateToSurvey(taskId) {
        acceptTask(taskId); 
        setRoute(`tasks/${taskId}`);
    }

    async function acceptTask(taskId) {
        try {
            // Corrected endpoint: Removed redundant /api
            const data = await fetchData(`/tasks/${taskId}/accept`, { method: 'POST' });
            
            if (data.success) {
                showModal('Task Accepted!', 'Start working and earn your reward.', 'success');
                setTimeout(() => {
                    closeModal();
                    setRoute(`my-tasks`);
                }, 2000);
            } else {
                showAlert(data.message || 'Failed to accept task.', false);
            }
        } catch (error) {
            loadContent();
        }
    }

    async function submitGmailTask(taskId) {
        const password = document.getElementById('common-password').value.trim();
        const accountsText = document.getElementById('accounts-list').value.trim();
        const accountsList = accountsText.split('\n').filter(line => line.trim() !== '');

        if (accountsList.length !== 50 || !password) {
            showAlert('Ensure 50 accounts and password are provided.', false);
            return;
        }

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Submitting...</span>';
        lucide.createIcons();

        try {
            // Corrected endpoint: Removed redundant /api
            const data = await fetchData('/tasks/submit-gmail-accounts', {
                method: 'POST',
                body: { taskId, accountsList, commonPassword: password }
            });

            if (data.success) {
                showModal('Submitted!', 'Your task is under review. Check My Tasks for updates.', 'success');
                setTimeout(() => {
                    closeModal();
                    setRoute('my-tasks');
                }, 2500);
            } else {
                showAlert(data.error || 'Submission failed.', false);
            }
        } catch (error) {
            showAlert('Submission failed due to internal error.', false);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Task</span>';
            lucide.createIcons();
        }

    async function submitFileTask(taskId) {

        const file = fileInput.files[0];
        const documentType = documentTypeInput.value.trim();

        if (!documentType) {

        const formData = new FormData();
        formData.append('document', file);
        formData.append('documentType', documentType); 

        const headers = { 'Authorization': `Bearer ${AUTH_TOKEN}` };
        
        try {
             // This endpoint already includes /api, so it works fine with the corrected BACKEND_URL
             const response = await fetch(`${BACKEND_URL}/user/verify`, {

    // --- Scan-to-Web Functions ---

    async function requestScanToken() {
        const modalId = 'action-modal';
        const modal = document.getElementById(modalId);
        
        showModal('Generating Secure Token...', 'Please wait while we create a single-use login link.', 'info');

        try {
            // Corrected endpoint: Removed redundant /api
            const result = await fetchData('/auth/generate-scan-token', { method: 'POST' });

            if (result.success && result.tempToken) {
                const scanURL = `${window.location.origin}${window.location.pathname}?scan_token=${result.tempToken}#tasks`;
                
                const qrContainer = document.createElement('canvas');
                
                await new Promise((resolve, reject) => {
                    QRCode.toCanvas(qrContainer, scanURL, { width: 256, margin: 2 }, function (error) {
                        if (error) return reject(error);
                        resolve();
                    });
                });

                const expirationTime = new Date(result.expiresAt).toLocaleTimeString();
                
                document.getElementById('modal-icon-bg').style.display = 'none';
                document.getElementById('modal-title').textContent = 'Scan to Login';
                document.getElementById('modal-message').innerHTML = `
                    <p class="mb-4">Scan this code on your desktop or another device to continue your session.</p>
                    <div class="mx-auto w-64 h-64 border-4 border-indigo-500 p-2 rounded-lg mb-4">
                        ${qrContainer.outerHTML}
                    </div>
                    <p class="text-red-500 font-semibold text-sm">Expires in 5 minutes (at ${expirationTime})</p>
                `;
                document.querySelector(`#${modalId} .btn-premium`).textContent = 'Close';
                modal.classList.remove('hidden');

            } else {
                showAlert(result.error || 'Failed to generate token.', false);
            }
        } catch (error) {
            showAlert('Failed to connect to token service.', false);
        }
    }

    async function redeemScanToken(scanToken) {
        try {
            // Corrected endpoint: Removed redundant /api
            const result = await fetchData('/auth/redeem-scan-token', { 
                method: 'POST',
                body: { scanToken: scanToken }
            });

            if (result.success && result.firebaseUid) {
                alert(`Scan Successful! Session confirmed for user ${result.firebaseUid}. Please log in again to sync the session.`);
                
                window.history.replaceState(null, null, window.location.pathname + '#tasks');
                location.reload(); 
            } else {
                showAlert(result.error || 'Token redemption failed.', false);
                window.history.replaceState(null, null, window.location.pathname + '#tasks');
                location.reload();
            }
        } catch (error) {
            showAlert('Token expired or invalid.', false);
            window.history.replaceState(null, null, window.location.pathname + '#tasks');
            location.reload();
        }
    }

    // --- Core Routing Logic ---

    async function loadContent() {
        const appContainer = document.getElementById('app-container');
        appContainer.innerHTML = `
            <div class="flex items-center justify-center py-20">
                <div class="text-center">
                    <i data-lucide="loader-2" class="w-12 h-12 md:w-16 md:h-16 text-white animate-spin mx-auto mb-4"></i>
                    <p class="text-white font-bold text-sm md:text-base">Loading...</p>
                </div>
            </div>
        `;
        lucide.createIcons();

        // 1. Fetch ALL necessary initial data concurrently
        Promise.all([
            fetchUserProfile(),
            fetchUserStats()
        ]).then(() => {
            // 2. Fetch Tasks only after profile/stats are done
            return Promise.all([
                // Corrected endpoint: Removed redundant /api
                fetchData('/tasks/available').catch(e => { console.error("Major tasks failed:", e); return null; }),
                fetchDailyTask(),
            ]);
        }).then(([tasksData, dailyTaskData]) => {
            
            if (dailyTaskData) {
                localStorage.setItem('dailyTask', JSON.stringify(dailyTaskData));
            } else {
                localStorage.removeItem('dailyTask');
            }

            const hash = window.location.hash.slice(1);
            
            // 3. Route Handling
            if (hash === 'tasks' || hash === '') {
                 if (tasksData) {
                     renderTasksList(tasksData.tasks, dailyTaskData);
                 } else {
                     appContainer.innerHTML = `
                         <div class="ultra-card p-8 md:p-12 text-center mt-12">
                             <div class="empty-state-icon mb-6">
                                 <i data-lucide="wifi-off" class="w-20 h-20 md:w-24 md:h-24 text-red-500 mx-auto"></i>
                             </div>
                             <h3 class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Connection Error</h3>
                             <p class="text-gray-600 text-sm md:text-base mb-6">Unable to load tasks. Please retry.</p>
                             <button onclick="loadContent()" class="btn-premium text-white font-bold py-3 px-8 rounded-2xl ripple">
                                 Retry
                             </button>
                         </div>
                     `;
                     lucide.createIcons();
                 }
            } else if (hash === 'my-tasks') {
                // Corrected endpoint: Removed redundant /api
                fetchData('/tasks/my-tasks').then(data => {
                    if (data) renderMyTasks(data.tasks);
                });
            } else if (hash === 'earnings') {
                renderEarnings();
            } else if (hash === 'affiliate') {
                renderAffiliateProfile();
            }
            else if (hash.startsWith('tasks/')) {
                const taskId = hash.split('/')[1];
                if (cachedTasks.length === 0 && tasksData) {
                    cachedTasks = tasksData.tasks;
                }
                renderTaskDetail(taskId);
            }
        }).catch(error => {
            console.error("Critical Load Error:", error);
            if (!AUTH_TOKEN) return; 
            
            const appContainer = document.getElementById('app-container');
            appContainer.innerHTML = `
                <div class="ultra-card p-8 md:p-12 text-center mt-12">
                    <h3 class="text-2xl font-black text-red-600 mb-3">Server Connection Lost</h3>
                    <p class="text-gray-600">Could not retrieve necessary user data. Please check your network and try again.</p>
                </div>
            `;
            lucide.createIcons();
        });
    }

    // --- Modal Functions (for completeness)
    function showModal(title, message, type = 'success') {
        const modal = document.getElementById('action-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalIcon = document.getElementById('modal-icon');
        const modalIconBg = document.getElementById('modal-icon-bg');
        
        modalTitle.textContent = title;
        modalMessage.textContent = message;
        
        if (type === 'success') {
            modalIcon.setAttribute('data-lucide', 'check-circle');
            modalIconBg.className = 'w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center bg-gradient-to-br from-green-400 to-emerald-600';
            modalIcon.className = 'w-12 h-12 text-white';
        } else {
            modalIcon.setAttribute('data-lucide', 'alert-circle');
            modalIconBg.className = 'w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center bg-gradient-to-br from-red-400 to-red-600';
            modalIcon.className = 'w-12 h-12 text-white';
        }
        
        modal.classList.remove('hidden');
        lucide.createIcons();
    }

    function closeModal() {
        document.getElementById('action-modal').classList.add('hidden');
    }

    // --- Other utility functions ---
    function copyToClipboard(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert('Code copied to clipboard!', true);
            }, (err) => {
                showAlert('Failed to copy text: ' + err, false);
            });
        } else {
            showAlert('Clipboard access not supported by your browser.', false);
        }
    }
    
    // Initializers
    function initializeApp() {
        AUTH_TOKEN = localStorage.getItem('btech_auth_token');
        const urlParams = new URLSearchParams(window.location.search);
        const scanToken = urlParams.get('scan_token');

        if (scanToken) {
            // Priority: Redeem scan token first
            redeemScanToken(scanToken);
        } else if (AUTH_TOKEN) {
            // User has a token, proceed to load content
            loadContent();
        } else {
            // No token, simulate a redirect to login page (or show a login error)
            const appContainer = document.getElementById('app-container');
             appContainer.innerHTML = `
                 <div class="ultra-card p-8 md:p-12 text-center mt-12">
                     <div class="empty-state-icon mb-6">
                         <i data-lucide="lock" class="w-20 h-20 md:w-24 md:h-24 text-red-500 mx-auto"></i>
                     </div>
                     <h3 class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Authentication Required</h3>
                     <p class="text-gray-600 text-sm md:text-base mb-6">Please log in via the mobile application to access this dashboard.</p>
                     <button onclick="simulateLogout()" class="btn-premium text-white font-bold py-3 px-8 rounded-2xl">
                         Go to Login
                     </button>
                 </div>
             `;
             lucide.createIcons();
        }
    }

    window.addEventListener('hashchange', loadContent);
    window.onload = initializeApp;
