    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: radial-gradient(ellipse at top, #1e3a8a 0%, transparent 50%),
                        radial-gradient(ellipse at bottom, #7c3aed 0%, transparent 50%);
            opacity: 0.4;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .content-wrapper {
            position: relative;
            z-index: 1;
        }
        
        /* Enhanced Cards */
        .ultra-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        
        .ultra-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .ultra-card:hover::before {
            left: 100%;
        }
        
        .ultra-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 30px 80px -20px rgba(99, 102, 241, 0.4);
        }
        
        /* Glass Header */
        .glass-header {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            background-size: 200% 200%;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* Premium Button */
        .btn-premium {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-premium::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-premium:active::before {
            width: 400px;
            height: 400px;
        }
        
        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px -10px rgba(99, 102, 241, 0.8);
        }
        
        /* Stats Cards Animation */
        .stats-card {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: gradientMove 4s ease infinite;
        }
        
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Fade In Up Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        /* Difficulty Badges */
        .difficulty-easy {
            background: linear-gradient(135deg, #10b981, #34d399);
        }
        
        .difficulty-medium {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
        }
        
        .difficulty-hard {
            background: linear-gradient(135deg, #ef4444, #f87171);
        }
        
        /* Status Badges */
        .status-pending {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
        }
        
        .status-progress {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
        
        .status-completed {
            background: linear-gradient(135deg, #10b981, #34d399);
        }
        
        /* Mobile Navigation */
        .mobile-nav {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .nav-item.active {
            color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }
        
        /* Progress Bar */
        .progress-bar {
            height: 8px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 999px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 999px;
            transition: width 1s ease;
        }
        
        /* Pulse Animation for Notifications */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Task Card Hover Effect */
        .task-card {
            transition: all 0.3s ease;
        }
        
        .task-card:hover {
            transform: translateY(-5px);
        }
        
        /* Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Tooltip */
        .tooltip {
            position: relative;
        }
        
        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            margin-bottom: 8px;
            z-index: 1000;
        }
        
        /* Search Bar Enhancement */
        .search-container {
            position: relative;
        }
        
        .search-container input:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        /* Achievement Badge */
        .achievement-badge {
            position: relative;
            display: inline-block;
        }
        
        .achievement-badge::after {
            content: '';
            position: absolute;
            top: -5px;
            right: -5px;
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid white;
        }
        
        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.7);
        }
    </style>
</head>

    async function handleCredentialResponse(response) {
        if (response.credential) {
            showAlert('Google Sign-In successful. Syncing account...', true);
            
            try {
                const apiResponse = await fetch(`${BACKEND_URL}/auth/provision`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${response.credential}`
                    }
                });

                const data = await apiResponse.json();

                if (apiResponse.ok && data.success) {
                    showAlert(`Welcome, ${data.user.fullName || data.user.email}!`, true);
                    location.reload();
                } else {
                    showAlert(data.error || 'Account provisioning failed.', false);
                }
            } catch (error) {
                showAlert('Network error during provisioning.', false);
                console.error("Provisioning error:", error);
            }
        }
    }

    async function initializeApp() {

        } else if (localStorage.getItem('btech_auth_token')) {
            AUTH_TOKEN = localStorage.getItem('btech_auth_token');
        }
        
        const appContainer = document.getElementById('app-container');
        
        if (!AUTH_TOKEN || AUTH_TOKEN.length < 100) {
            renderSignInScreen();
            return;
        }
        
        await Promise.all([
            checkAuthToken(),
            fetchUserProfile(),
            fetchUserStats()
        ]);
        
        if (window.location.search) {
            window.history.replaceState(null, null, window.location.pathname + window.location.hash);
        }

        const hash = window.location.hash.slice(1);
        setRoute(hash || 'tasks');
    }

    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN) {
            throw new Error('Authentication token missing.');
        }

        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${AUTH_TOKEN}`,
            ...options.headers
        };

        const config = {
            method: options.method || 'GET',
            headers: headers,
            ...(options.body && { body: JSON.stringify(options.body) }),
        };

        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`, config);
            const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));
            
            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    throw new Error("Token expired. Please re-login.");
                }
                if (response.status === 429) {
                    throw new Error("Rate limit exceeded. Please wait.");
                }
                throw new Error(data.error || `Error: ${response.status}`);
            }

            if (!data.success && data.error) {
                throw new Error(data.error);
            }
            
            return data;
        } catch (error) {
            console.error('API Error:', error.message);
            throw error;
        }
    }

        const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';

            category: categoryFilter,

            search: searchTerm
        };
        
        const filteredTasks = cachedTasks.filter(task => {
            const matchesCategory = categoryFilter === 'all' || task.category === categoryFilter;
            const matchesDifficulty = difficultyFilter === 'all' || 
                getTaskDifficulty(task) === difficultyFilter.toLowerCase();
            const matchesSearch = searchTerm === '' || 
                task.title.toLowerCase().includes(searchTerm) ||
                task.description.toLowerCase().includes(searchTerm);

                    </div>
                    <button type="submit" id="submit-wechat-btn-${task.id}" class="btn-premium w-full text-white font-bold py-4 rounded-xl flex items-center justify-center space-x-2">
                        <i data-lucide="key" class="w-5 h-5"></i>
                        <span>Submit Account for Sale</span>
                    </button>
                </form>
            `;
        }


        // Fallback for generic text/file submissions
        const fileUploadCategories = ['Local Data Verification', 'QA Testing'];
        const isFileUpload = fileUploadCategories.includes(task.category);
        const fileDescription = task.category === 'QA Testing' ? 'detailed report/screenshot' : 'photo proof';
        
        if (isFileUpload) {
             return `
                <h3 class="text-xl md:text-2xl font-black text-gray-800 mb-6 flex items-center">
                    <i data-lucide="upload" class="w-6 h-6 mr-3 text-indigo-600"></i>

                </h3>
                <p class="text-gray-600 text-sm mb-4">Submit a ${fileDescription} for verification.</p>
                <form onsubmit="event.preventDefault(); submitFileTask(${task.id});">
                    <div class="mb-5 md:mb-6">

                        <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-indigo-400 transition">
                            <input type="file" id="submission-file-${task.id}" name="document" class="hidden" required accept="image/*,application/pdf,.zip" onchange="handleFileSelect(${task.id})">
                            <label for="submission-file-${task.id}" class="cursor-pointer">
                                <i data-lucide="upload-cloud" class="w-12 h-12 text-gray-400 mx-auto mb-2"></i>
                                <p class="text-sm text-gray-600">Click to upload or drag & drop</p>
                                <p class="text-xs text-gray-500 mt-1">JPEG, PNG, PDF, or ZIP (max 5MB)</p>
                            </label>
                            <div id="file-preview-${task.id}" class="mt-4 hidden">
                                <p class="text-sm font-semibold text-gray-800" id="file-name-${task.id}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="mb-5 md:mb-6">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Description/Proof Type:</label>
                        <input type="text" id="document-type-field-${task.id}" class="w-full p-3 md:p-4 border-2 border-gray-200 rounded-xl transition text-sm md:text-base focus:border-indigo-500" placeholder="e.g., Photo proof of pricing" required>
                    </div>
                    <button type="submit" id="submit-file-btn-${task.id}" class="btn-premium w-full text-white font-bold py-4 rounded-xl flex items-center justify-center space-x-2">
                        <i data-lucide="upload" class="w-5 h-5"></i>
                        <span>Upload & Submit for Review</span>
                    </button>
                </form>
            `;
        }
        
        const outputLabels = {
            'Transcription': 'Transcription Output (Full Text):',
            'Translation': 'Translated Text:',

        const outputLabel = outputLabels[task.category] || outputLabels['default'];
        
        // Default to Text Submission
        return `
            <h3 class="text-xl md:text-2xl font-black text-gray-800 mb-6 flex items-center">
                <i data-lucide="edit" class="w-6 h-6 mr-3 text-indigo-600"></i>
                ${task.category} Submission
            </h3>
            <form onsubmit="event.preventDefault(); submitTextTask(${task.id});">
                <div class="mb-5 md:mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">${outputLabel}</label>
                    <textarea id="task-output-text" rows="15" class="w-full p-3 md:p-4 border-2 border-gray-200 rounded-xl transition text-sm md:text-base focus:border-indigo-500" placeholder="Paste your final output here. Be precise and thorough..." required></textarea>
                    <p class="text-xs text-gray-600 mt-1">${task.category} tasks require careful review. Ensure quality.</p>
                </div>
                <button type="submit" id="submit-text-btn-${task.id}" class="btn-premium w-full text-white font-bold py-4 rounded-xl flex items-center justify-center space-x-2">
                    <i data-lucide="send" class="w-5 h-5"></i>
                    <span>Submit Final Output</span>

    function renderDailySurveyForm(taskId) {
        return `
            <h3 class="text-xl md:text-2xl font-black text-gray-800 mb-6 flex items-center">
                <i data-lucide="clipboard-list" class="w-6 h-6 mr-3 text-indigo-600"></i>
                Daily Survey Questions
            </h3>
            <form id="survey-form-${taskId}" onsubmit="event.preventDefault(); submitDailySurvey(${taskId});">

                    <div>

    function handleFileSelect(taskId) {
        const fileInput = document.getElementById(`submission-file-${taskId}`);
        const filePreview = document.getElementById(`file-preview-${taskId}`);
        const fileName = document.getElementById(`file-name-${taskId}`);
        
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            fileName.textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
            filePreview.classList.remove('hidden');
        }
    }

    // ============================================
    // TASK SUBMISSION HANDLERS
    // ============================================
    
    async function acceptTask(taskId) {
        try {
            showAlert('Accepting task...', true);
            await fetchData(`/tasks/${taskId}/accept`, { method: 'POST' });
            showModal('Task Accepted!', 'You can now start working on this task.', 'success');
            setTimeout(() => {
                closeModal();
                setRoute(`tasks/${taskId}`);
            }, 2000);
        } catch (error) {
            showAlert(error.message, false);
        }
    }

    function acceptAndNavigateToSurvey(taskId) {
        acceptTask(taskId);
    }

    async function submitTextTask(taskId) {
        const outputText = document.getElementById('task-output-text')?.value;
        
        if (!outputText || outputText.trim().length < 50) {
            showAlert('Please provide detailed output (minimum 50 characters).', false);
            return;
        }
        
        try {
            const submitBtn = document.getElementById(`submit-text-btn-${taskId}`);
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Submitting...</span>';
                lucide.createIcons();
            }
            
            // Re-using submit-gmail-accounts for generic text submissions
            await fetchData(`/tasks/submit-gmail-accounts`, {
                method: 'POST',
                body: { taskId: taskId, accountsList: [outputText], commonPassword: 'N/A' }
            });
            
            showModal('Task Submitted!', 'Your work has been submitted for review. You\'ll be notified once it\'s approved.', 'success');
            
            setTimeout(() => {
                closeModal();
                setRoute('my-tasks');
            }, 2500);
        } catch (error) {
            showAlert(error.message, false);
            const submitBtn = document.getElementById(`submit-text-btn-${taskId}`);
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i><span>Submit Final Output</span>';
                lucide.createIcons();
            }
        }
    }

    async function submitFileTask(taskId) {
        const fileInput = document.getElementById(`submission-file-${taskId}`);
        const docType = document.getElementById(`document-type-field-${taskId}`)?.value;
        
        if (!fileInput || !fileInput.files.length) {
            showAlert('Please select a file to upload.', false);
            return;
        }
        
        if (!docType || docType.trim().length < 5) {
            showAlert('Please provide a description or reference URL (minimum 5 characters).', false);
            return;
        }
        
        const file = fileInput.files[0];
        if (file.size > 5 * 1024 * 1024) {
            showAlert('File size must be less than 5MB.', false);
            return;
        }
        
        try {
            const submitBtn = document.getElementById(`submit-file-btn-${taskId}`);
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Uploading...</span>';
                lucide.createIcons();
            }
            
            // Convert file to base64
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    // Re-using submit-gmail-accounts for file-based submissions
                    await fetchData(`/tasks/submit-gmail-accounts`, {
                        method: 'POST',
                        body: {
                            taskId: taskId,
                            // Send description/URL as accountsList entry
                            accountsList: [`Reference/URL: ${docType}`, `File: ${file.name}`], 
                            // Send Base64 data in commonPassword field (Hacky, but works with current backend structure)
                            commonPassword: e.target.result.split(',')[1] 
                        }
                    });
                    
                    showModal('File Uploaded!', 'Your submission has been received and is under review.', 'success');
                    
                    setTimeout(() => {
                        closeModal();
                        setRoute('my-tasks');
                    }, 2500);
                } catch (error) {
                    showAlert(error.message, false);
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i data-lucide="upload" class="w-5 h-5"></i><span>Upload & Submit for Review</span>';
                        lucide.createIcons();
                    }
                }
            };
            // Read file as Base64 data URL
            reader.readAsDataURL(file);

        } catch (error) {
            showAlert(error.message, false);
        }
    }

    async function submitWeChatTask(taskId) {
        const phone = document.getElementById(`wechat-phone-${taskId}`)?.value;
        const password = document.getElementById(`wechat-password-${taskId}`)?.value;

        if (!phone || !password || phone.trim().length < 5 || password.trim().length < 6) {
            showAlert('Please provide valid phone number and password.', false);
            return;
        }
        
        // Combine data into a structured string for the 'output' field
        const outputText = `Phone: ${phone}\nPassword: ${password}\nAgreed Price: KES 1000.00`;

        try {
            const submitBtn = document.getElementById(`submit-wechat-btn-${taskId}`);
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Submitting...</span>';
                lucide.createIcons();
            }
            
            // Use the generic submission endpoint
            await fetchData(`/tasks/submit-gmail-accounts`, {
                method: 'POST',
                body: {
                    taskId: taskId, 
                    accountsList: [outputText], // Wrap the output in an array for the backend format
                    commonPassword: password // Use password for quick admin reference
                }
            });
            
            showModal('Account Submitted!', 'Your WeChat account details are being verified. KES 1000.00 will be credited once confirmed.', 'success');
            
            setTimeout(() => {
                closeModal();
                setRoute('my-tasks');
            }, 3500);
        } catch (error) {
            showAlert(error.message, false);
            const submitBtn = document.getElementById(`submit-wechat-btn-${taskId}`);
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i data-lucide="key" class="w-5 h-5"></i><span>Submit Account for Sale</span>';
                lucide.createIcons();
            }
        }
    }


    async function submitDailySurvey(taskId) {
        const form = document.getElementById(`survey-form-${taskId}`);
        const formData = new FormData(form);
        const surveyData = Object.fromEntries(formData);
        
        if (!surveyData.satisfaction || !surveyData.ease_of_finding || !surveyData.suggestions) {
            showAlert('Please answer all questions.', false);
            return;
        }
        
        try {
            showAlert('Submitting survey...', true);
            
            // Submit to Formspree
            await fetch(FORMSPREE_SURVEY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(surveyData)
            });
            
            // Submit to backend
            await fetchData(`/tasks/submit-daily-task`, {
                method: 'POST',
                body: { taskId: taskId }
            });
            
            showModal('Survey Submitted!', 'Thank you for your feedback! Your reward has been credited.', 'success');
            
            setTimeout(() => {
                closeModal();
                setRoute('tasks');
            }, 2500);
        } catch (error) {
            showAlert(error.message, false);
        }
    }

    // ============================================
    // MAIN CONTENT LOADER
    // ============================================
    
    function loadContent() {
        const appContainer = document.getElementById('app-container');
        appContainer.innerHTML = `
            <div class="flex items-center justify-center py-20">
                <div class="text-center">
                    <i data-lucide="loader-2" class="w-12 h-12 md:w-16 md:h-16 text-white animate-spin mx-auto mb-4"></i>
                    <p class="text-white font-bold text-sm md:text-base">Loading your dashboard...</p>
                </div>
            </div>
        `;
        lucide.createIcons();

        Promise.all([
            fetchUserProfile(),
            fetchUserStats()
        ]).then(() => {
            return Promise.all([
                fetchData('/tasks/available').catch(e => {
                    console.warn("Tasks fetch failed, using mock:", e.message);
                    return { tasks: MOCK_TASK_DEFINITIONS, success: true };
                }),
                fetchDailyTask(),
            ]);
        }).then(([tasksData, dailyTaskData]) => {
            
            if (dailyTaskData && dailyTaskData.id) {
                localStorage.setItem('dailyTask', JSON.stringify(dailyTaskData));
            } else {
                localStorage.removeItem('dailyTask');
            }

            const hash = window.location.hash.slice(1);
            
            if (hash === 'tasks' || hash === '') {
                renderTasksList(tasksData.tasks, dailyTaskData);
            } else if (hash === 'my-tasks') {
                fetchData('/tasks/my-tasks').then(data => {
                    if (data) renderMyTasks(data.tasks);
                }).catch(() => {
                    renderMyTasks([]);
                });
            } else if (hash === 'earnings') {
                renderEarnings();
            } else if (hash === 'affiliate') {
                renderAffiliateProfile();
            } else if (hash === 'achievements') {
                renderAchievements();
            } else if (hash.startsWith('tasks/')) {
                const taskId = hash.split('/')[1];
                if (cachedTasks.length === 0 && tasksData) {
                    cachedTasks = tasksData.tasks;
                }
                renderTaskDetail(taskId);
            }
        }).catch(error => {
            console.error("Critical Load Error:", error);
            if (!AUTH_TOKEN) return;
            
            const appContainer = document.getElementById('app-container');
            appContainer.innerHTML = `
                <div class="ultra-card p-8 md:p-12 text-center mt-12 fade-in-up">
                    <i data-lucide="wifi-off" class="w-20 h-20 text-red-500 mx-auto mb-4"></i>
                    <h3 class="text-2xl font-black text-red-600 mb-3">Connection Error</h3>
                    <p class="text-gray-600 mb-6">Unable to load dashboard data. Please check your connection and try again.</p>
                    <button onclick="location.reload()" class="btn-premium text-white font-bold py-4 px-8 rounded-xl">
                        <i data-lucide="refresh-cw" class="w-5 h-5 inline mr-2"></i>
                        Retry
                    </button>
                </div>
            `;
            lucide.createIcons();
        });
    }

    // ============================================
    // EVENT LISTENERS & INITIALIZATION
    // ============================================
    
    window.addEventListener('hashchange', loadContent);
    window.onload = initializeApp;
    
    // Global function exposure
    window.handleCredentialResponse = handleCredentialResponse;
    window.setRoute = setRoute;
    window.simulateLogout = simulateLogout;
    window.toggleNotifications = toggleNotifications;
    window.closeAlert = closeAlert;
    window.closeModal = closeModal;
    window.acceptTask = acceptTask;
    window.acceptAndNavigateToSurvey = acceptAndNavigateToSurvey;
    window.submitTextTask = submitTextTask;
    window.submitFileTask = submitFileTask;
    window.submitDailySurvey = submitDailySurvey;
    window.submitWeChatTask = submitWeChatTask; // NEW
    window.handleFileSelect = handleFileSelect;
    window.applyFilters = applyFilters;
    window.resetFilters = resetFilters;
    window.copyToClipboard = copyToClipboard;
    window.shareReferral = shareReferral;
    window.showWithdrawalModal = showWithdrawalModal;
</script>
