<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH Earning Network | Tasks</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        /* Custom Styles for Professional Aesthetic */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc; /* Light background for professionalism */
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .card-shadow:hover {
            box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.1), 0 10px 12px -7px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }
        .progress-bar {
            transition: width 0.5s ease-out;
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- Navbar/Header -->
    <header class="bg-white card-shadow sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-700">BTECH <span class="text-gray-900">Tasks</span></h1>
            <nav class="flex items-center space-x-6 text-sm font-medium">
                <!-- Use JS routing method -->
                <a href="javascript:void(0)" onclick="setRoute('tasks')" class="text-gray-500 hover:text-indigo-600 transition">Available Tasks</a>
                <a href="javascript:void(0)" onclick="setRoute('my-tasks')" class="text-gray-500 hover:text-indigo-600 transition">My Tasks</a>
                <span class="text-gray-400">|</span>
                <button onclick="simulateLogout()" class="text-red-500 hover:text-red-700 transition flex items-center">
                    <i data-lucide="log-out" class="w-4 h-4 mr-1"></i>
                    Logout
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <!-- Status / Alert Area -->
        <div id="status-alert" class="hidden fixed top-16 right-4 z-50 p-4 rounded-lg text-white font-medium card-shadow" role="alert"></div>

        <!-- Dynamic Content Container -->
        <div id="app-container">
            <!-- Content will be injected here based on URL -->
            <div id="loading-spinner" class="text-center py-20 text-indigo-600">
                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto"></i>
                <p class="mt-4 text-lg">Loading Tasks...</p>
            </div>
        </div>
    </main>

    <!-- Modal for Dynamic Actions (Accept/Submit Success) -->
    <div id="action-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl card-shadow max-w-sm w-full text-center">
            <i id="modal-icon" data-lucide="check-circle" class="w-12 h-12 text-green-500 mx-auto mb-4"></i>
            <h3 id="modal-title" class="text-xl font-bold mb-2 text-gray-800">Success</h3>
            <p id="modal-message" class="text-gray-600 mb-6">Task accepted successfully!</p>
            <button onclick="closeModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition">
                Close
            </button>
        </div>
    </div>


<script>
    // --- Global State and Constants ---
    const BACKEND_URL = "https://btech-earning-api.onrender.com/api";
    let AUTH_TOKEN; // Will be set by init function immediately
    let cachedTasks = [];

    const appContainer = document.getElementById('app-container');
    const statusAlert = document.getElementById('status-alert');

    // --- Core Initialization Logic ---

    function initializeApp() {
        // 1. Check URL for token passed by Android
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token');
        
        if (urlToken && urlToken.length > 100) {
            // Found a valid token in the URL: use it and save it.
            AUTH_TOKEN = urlToken;
            localStorage.setItem('btech_auth_token', AUTH_TOKEN);
            console.log("Token successfully initialized from URL.");
        } else if (localStorage.getItem('btech_auth_token')) {
             // Token exists in local storage 
             AUTH_TOKEN = localStorage.getItem('btech_auth_token');
             console.log("Token loaded from local storage.");
        } else { 
            // Token is missing 
             showAlert("Authentication required. Please log in through the mobile app.", false);
             appContainer.innerHTML = '<p class="py-20 text-center text-red-600 font-bold">Access Denied. Please ensure you are logged in via the BTECH Plus App.</p>';
             return; 
        }
        
        // 2. Clear query parameters to clean up the URL for routing
        // This stops the token from showing up in history/logs after the initial transfer
        if (window.location.search) {
             window.history.replaceState(null, null, window.location.pathname + window.location.hash);
        }

        // 3. Initial Routing
        if (!window.location.hash || window.location.hash === '#') {
            setRoute('tasks');
        } else {
            loadContent();
        }
    }

    // --- Utility Functions ---

    function showAlert(message, isSuccess = true) {
        statusAlert.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'opacity-0');
        statusAlert.classList.add(isSuccess ? 'bg-green-500' : 'bg-red-500', 'opacity-100');
        statusAlert.textContent = message;
        setTimeout(() => {
            statusAlert.classList.remove('opacity-100');
            statusAlert.classList.add('opacity-0');
            setTimeout(() => { statusAlert.classList.add('hidden'); }, 300);
        }, 5000);
    }
    
    function simulateLogout() {
        localStorage.removeItem('btech_auth_token');
        showAlert("Logged out. Please sign in again in the BTECH Plus App.", true);
        setRoute('tasks'); 
    }
    
    // CRITICAL FIX: Ensures navigation only updates the hash and doesn't trigger an unwanted file load.
    function setRoute(path) {
        window.location.hash = `#${path}`;
    }


    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN || AUTH_TOKEN.length < 100) {
            showAlert('Authentication token missing. Cannot connect to API.', false);
            throw new Error('No valid token.');
        }

        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${AUTH_TOKEN}`,
            ...options.headers
        };

        const config = {
            method: options.method || 'GET',
            headers: headers,
            ...options
        };

        if (options.body) {
            config.body = JSON.stringify(options.body);
        }

        const url = `${BACKEND_URL}${endpoint}`;
        
        try {
            const response = await fetch(url, config);
            const data = await response.json();
            
            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    showAlert('Authentication failed (401). Please try logging in again.', false);
                }
                throw new Error(data.error || `Server responded with status ${response.status}`);
            }

            if (!data.success && data.error) {
                throw new Error(data.error);
            }
            
            return data;
        } catch (error) {
            console.error('Fetch Error:', error.message);
            showAlert(`API Error: ${error.message}`, false); 
            throw error;
        }
    }

    // --- Renderer Functions ---

    function renderTasksList(tasks) {
        cachedTasks = tasks; 
        
        appContainer.innerHTML = `
            <div class="mb-8">
                <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">Available Tasks</h2>
                <a href="javascript:void(0)" onclick="setRoute('my-tasks')" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium transition flex items-center mt-2">
                     View Accepted Tasks <i data-lucide="chevrons-right" class="w-4 h-4 ml-1"></i>
                </a>
            </div>
            
            <!-- Filters (Basic Placeholder) -->
            <div class="bg-white p-4 rounded-xl card-shadow mb-8 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0">
                <div class="flex items-center space-x-3">
                    <i data-lucide="list-filter" class="w-5 h-5 text-indigo-600"></i>
                    <span class="text-sm font-medium text-gray-700">Filter:</span>
                </div>
                <select id="category-filter" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">All Categories</option>
                    <option value="Account Creation">Account Creation</option>
                    <option value="Data Entry">Data Entry</option>
                </select>
            </div>

            <!-- Task Grid -->
            <div id="tasks-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                ${tasks.map(task => `
                    <div class="bg-white rounded-xl p-6 card-shadow flex flex-col">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xl font-bold text-gray-800">${task.title}</h3>
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${
                                task.difficulty === 'Easy' ? 'bg-green-100 text-green-800' :
                                task.difficulty === 'Medium' ? 'bg-yellow-100 text-yellow-800' :
                                'bg-red-100 text-red-800'
                            }">${task.difficulty}</span>
                        </div>
                        <p class="text-3xl font-extrabold text-indigo-600 mb-2">KES ${task.payment.toFixed(2)}</p>
                        <p class="text-sm text-gray-500 mb-4 flex-grow">${task.description}</p>
                        
                        <div class="text-xs text-gray-400 mb-4 space-y-1">
                            <p class="flex items-center"><i data-lucide="clock" class="w-3 h-3 mr-1"></i> Est. Time: ${task.estimatedTime}</p>
                            <p class="flex items-center"><i data-lucide="calendar" class="w-3 h-3 mr-1"></i> Deadline: ${task.deadline}</p>
                        </div>

                        <button onclick="acceptTask(${task.id})" class="mt-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg transition flex items-center justify-center">
                            <i data-lucide="check-circle" class="w-4 h-4 mr-2"></i> Accept Task
                        </button>
                    </div>
                `).join('')}
            </div>
        `;
        // Rerender icons after updating HTML
        lucide.createIcons();
    }

    function renderTaskDetail(taskId) {
        const task = cachedTasks.find(t => t.id == taskId);
        
        if (!task) {
             appContainer.innerHTML = '<p class="py-10 text-center text-red-600">Task details not found. Please reload the Available Tasks list.</p>';
             lucide.createIcons();
             return;
        }

        const isGmailTask = taskId == 1000;
        
        let formContent;

        if (isGmailTask) {
            formContent = `
                <div class="bg-white p-8 rounded-xl card-shadow">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">Submission Form</h3>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Common Password Used (Confirmation):</label>
                        <input type="password" id="common-password" class="w-full p-3 border border-gray-300 rounded-lg focus:border-indigo-500 focus:ring-indigo-500" placeholder="Enter the password used for all 50 accounts" required>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">List of 50 Gmail Accounts (One per line):</label>
                        <textarea id="accounts-list" rows="10" class="w-full p-3 border border-gray-300 rounded-lg focus:border-indigo-500 focus:ring-indigo-500" placeholder="Enter one email address per line..." required></textarea>
                        <p class="text-xs text-gray-500 mt-1" id="count-indicator">0 accounts entered (Requires 50)</p>
                    </div>

                    <button onclick="submitGmailTask(${taskId})" id="submit-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition disabled:bg-gray-400">
                        Submit Task for Verification
                    </button>
                </div>
            `;
        } else {
            formContent = `<div class="bg-white p-8 rounded-xl card-shadow"><p>This task requires a different submission method.</p></div>`;
        }

        appContainer.innerHTML = `
            <div class="mb-8 flex justify-between items-center">
                <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">${task.title}</h2>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Task Info Card -->
                <div class="lg:col-span-1 bg-white p-6 rounded-xl card-shadow">
                    <h3 class="text-xl font-bold text-indigo-700 mb-4">Task Details</h3>
                    <p class="text-4xl font-extrabold text-gray-900 mb-4">KES ${task.payment.toFixed(2)}</p>
                    <p class="text-gray-600 mb-4">${task.description}</p>
                    
                    <ul class="text-sm space-y-2 text-gray-700">
                        <li class="flex items-center"><i data-lucide="hash" class="w-4 h-4 mr-2 text-gray-400"></i> Task ID: ${task.id}</li>
                        <li class="flex items-center"><i data-lucide="clock" class="w-4 h-4 mr-2 text-gray-400"></i> Est. Time: ${task.estimatedTime}</li>
                        <li class="flex items-center"><i data-lucide="calendar" class="w-4 h-4 mr-2 text-gray-400"></i> Deadline: ${task.deadline}</li>
                    </ul>
                </div>

                <!-- Submission Form/Logic -->
                <div class="lg:col-span-2">
                    ${formContent}
                </div>
            </div>
            
            <a href="javascript:void(0)" onclick="setRoute('tasks')" class="mt-6 inline-flex items-center text-indigo-600 hover:text-indigo-800 font-medium transition">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Back to Available Tasks
            </a>
        `;
        
        // Re-attach listener for the new form
        const accountsTextarea = document.getElementById('accounts-list');
        if (accountsTextarea) {
            accountsTextarea.addEventListener('input', updateCountIndicator);
            updateCountIndicator();
        }

        lucide.createIcons();
    }
    
    function updateCountIndicator() {
        const textarea = document.getElementById('accounts-list');
        const indicator = document.getElementById('count-indicator');
        const submitBtn = document.getElementById('submit-btn');

        if (!textarea || !indicator || !submitBtn) return;

        // Count lines that are not empty
        const accounts = textarea.value.trim().split('\n').filter(line => line.trim() !== '');
        const count = accounts.length;

        indicator.textContent = `${count} accounts entered (Requires 50)`;

        if (count === 50) {
            indicator.classList.remove('text-red-500');
            indicator.classList.add('text-green-600');
            submitBtn.disabled = false;
        } else {
            indicator.classList.remove('text-green-600');
            indicator.classList.add('text-red-500');
            submitBtn.disabled = true;
        }
    }


    // --- Action Functions ---

    async function acceptTask(taskId) {
        try {
            const data = await fetchData(`/tasks/${taskId}/accept`, { method: 'POST' });
            
            if (data.success) {
                showAlert(data.message, true);
                // After successful acceptance, show the detail view
                setRoute(`tasks/${taskId}`);
            } else {
                showAlert(data.message || 'Failed to accept task.', false);
            }
        } catch (error) {
            console.error('Acceptance failed:', error);
        }
    }

    async function submitGmailTask(taskId) {
        const passwordInput = document.getElementById('common-password').value.trim();
        const accountsTextarea = document.getElementById('accounts-list').value.trim();
        const accountsList = accountsTextarea.split('\n').filter(line => line.trim() !== '');

        if (accountsList.length !== 50 || passwordInput.length === 0) {
            showAlert('Please ensure exactly 50 accounts are listed and the password field is filled.', false);
            return;
        }

        const payload = {
            taskId: taskId,
            accountsList: accountsList,
            commonPassword: passwordInput
        };

        try {
            const data = await fetchData(`/tasks/submit-gmail-accounts`, {
                method: 'POST',
                body: payload
            });

            if (data.success) {
                showAlert(data.message, true);
                // After successful submission, navigate to My Tasks to see the status update
                setRoute('my-tasks');
            } else {
                showAlert(data.error || 'Submission failed. Please check inputs.', false);
            }
        } catch (error) {
            console.error('Submission error:', error);
        }
    }
    
    function renderMyTasks(tasks) {
        appContainer.innerHTML = `
            <div class="mb-8">
                <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">My Active Tasks</h2>
                <a href="javascript:void(0)" onclick="setRoute('tasks')" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium transition flex items-center mt-2">
                     Browse Available Tasks <i data-lucide="chevrons-right" class="w-4 h-4 ml-1"></i>
                </a>
            </div>
            <div id="my-tasks-list" class="space-y-6">
                ${tasks.length === 0 ? '<p class="text-gray-500 p-8 bg-white rounded-xl card-shadow">You have no active tasks. Accept one from the list!</p>' : tasks.map(task => {
                    const progress = Math.min(100, task.progress);
                    let statusText, statusClass, progressBarClass;

                    if (task.status === 'PENDING_VERIFICATION') {
                        statusText = 'AWAITING BTECH REVIEW';
                        statusClass = 'bg-yellow-100 text-yellow-800';
                        progressBarClass = 'bg-yellow-500';
                    } else if (task.status === 'IN_PROGRESS') {
                        statusText = 'IN PROGRESS';
                        statusClass = 'bg-indigo-100 text-indigo-800';
                        progressBarClass = 'bg-indigo-500';
                    } else if (task.status === 'COMPLETED') {
                        statusText = 'PAID & COMPLETE';
                        statusClass = 'bg-green-100 text-green-800';
                        progressBarClass = 'bg-green-600';
                    } else {
                        statusText = task.status;
                        statusClass = 'bg-gray-100 text-gray-800';
                        progressBarClass = 'bg-gray-500';
                    }

                    return `
                        <div class="bg-white p-6 rounded-xl card-shadow flex flex-col md:flex-row justify-between items-start md:items-center">
                            <div class="flex-grow">
                                <h3 class="text-xl font-bold text-gray-800 mb-1">${task.title}</h3>
                                <div class="text-sm text-gray-500 mb-3">
                                    <span class="font-medium text-indigo-600">Payout: KES ${task.payment.toFixed(2)}</span> | 
                                    <span class="${statusClass} text-xs font-semibold px-2 py-0.5 rounded-full">${statusText}</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2.5">
                                    <div class="${progressBarClass} h-2.5 rounded-full progress-bar" style="width: ${progress}%"></div>
                                </div>
                                <p class="text-xs text-gray-500 mt-1">${progress}% Complete (Started: ${task.startedDate})</p>
                            </div>
                            <button onclick="setRoute('tasks/${task.taskId}')" class="mt-4 md:mt-0 md:ml-6 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded-lg transition">
                                View Details
                            </button>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
        lucide.createIcons();
    }


    // --- Routing and Initialization ---

    async function loadContent() {
        const hash = window.location.hash.slice(1);
        appContainer.innerHTML = document.getElementById('loading-spinner').outerHTML;
        lucide.createIcons(); 

        if (hash === 'tasks' || hash === '') {
            try {
                const data = await fetchData('/tasks/available');
                renderTasksList(data.tasks);
            } catch (error) {
                // Handled in fetchData
                appContainer.innerHTML = '<p class="py-20 text-center text-red-600">Failed to load available tasks. Check console for details.</p>';
            }
        } else if (hash === 'my-tasks') {
             try {
                const data = await fetchData('/tasks/my-tasks');
                renderMyTasks(data.tasks);
            } catch (error) {
                // Handled in fetchData
                appContainer.innerHTML = '<p class="py-20 text-center text-red-600">Failed to load your active tasks. Please try again later.</p>';
            }
        } else if (hash.startsWith('tasks/')) {
            const taskId = hash.split('/')[1];
            // If cache is empty, reload tasks list first to populate cache
            if (cachedTasks.length === 0) {
                 try {
                     const data = await fetchData('/tasks/available');
                     cachedTasks = data.tasks;
                 } catch (e) {
                     // If fetching available tasks fails, stop here
                     appContainer.innerHTML = '<p class="py-20 text-center text-red-600">Failed to fetch required task details.</p>';
                     return;
                 }
            }
            
            // Check if the accepted task exists in the 'my-tasks' list to determine submission status
            const myTasksData = await fetchData('/tasks/my-tasks');
            const acceptedTask = myTasksData.tasks.find(t => t.taskId == taskId);

            const taskTitle = cachedTasks.find(t => t.id == taskId)?.title || `Task #${taskId}`;
            
            // Check if task exists and has been submitted (progress == 100)
            const isSubmitted = acceptedTask && acceptedTask.status === 'PENDING_VERIFICATION'; 
            
            renderTaskDetail(taskId, taskTitle, isSubmitted ? acceptedTask.accountsList : null);

        }
    }

    // Initialize routing based on hash
    window.addEventListener('hashchange', loadContent);
    window.onload = initializeApp; 
</script>
</body>
</html>
