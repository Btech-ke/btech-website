<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH Earning Network | Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* CSS STYLES (Kept consistent with your design) */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0e27; position: relative; overflow-x: hidden; }
        .animated-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); opacity: 0.9; }
        .animated-bg::before { content: ''; position: absolute; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px; animation: moveGrid 20s linear infinite; }
        @keyframes moveGrid { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }
        .content-wrapper { position: relative; z-index: 1; }
        .ultra-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; }
        .ultra-card:hover { transform: translateY(-12px) scale(1.02); box-shadow: 0 35px 70px -15px rgba(102, 126, 234, 0.4); }
        .glass-header { background: rgba(10, 14, 39, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #f093fb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .btn-premium { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 10px 40px -10px rgba(102, 126, 234, 0.6); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-premium::after { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.3); transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s; }
        .btn-premium:active::after { width: 300px; height: 300px; }
        .btn-premium:hover { transform: translateY(-3px); box-shadow: 0 15px 50px -10px rgba(102, 126, 234, 0.8); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .float-animation { animation: float 3s ease-in-out infinite; }
        @keyframes progressShine { 0% { left: -100%; } 100% { left: 200%; } }
        .mobile-nav { background: rgba(10, 14, 39, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-item.active { color: #667eea; }
        .stats-shine { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); background-size: 200% 200%; animation: gradientShift 3s ease infinite; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        .difficulty-easy { background: linear-gradient(135deg, #10b981, #34d399); }
        .difficulty-medium { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .difficulty-hard { background: linear-gradient(135deg, #ef4444, #f87171); }
        .status-pending { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .status-progress { background: linear-gradient(135deg, #667eea, #764ba2); }
        .status-completed { background: linear-gradient(135deg, #10b981, #34d399); }
    </style>
</head>

<body class="min-h-screen">
    <div class="animated-bg"></div>
    
    <div class="content-wrapper">
        <header class="glass-header sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                            <i data-lucide="zap" class="w-7 h-7 text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-xl md:text-2xl font-black text-white mobile-header-title">BTECH</h1>
                            <p class="text-xs text-gray-300 font-medium">Earning Pro</p>
                        </div>
                    </div>
                    
                    <nav class="hidden md:flex items-center space-x-6">
                        <a href="javascript:void(0)" onclick="setRoute('tasks')" class="text-gray-300 hover:text-white font-medium text-sm transition">Tasks</a>
                        <a href="javascript:void(0)" onclick="setRoute('my-tasks')" class="text-gray-300 hover:text-white font-medium text-sm transition">My Tasks</a>
                        <a href="javascript:void(0)" onclick="setRoute('earnings')" class="text-gray-300 hover:text-white font-medium text-sm transition">Earnings</a>
                        <a href="javascript:void(0)" onclick="setRoute('affiliate')" class="text-gray-300 hover:text-white font-medium text-sm transition">Affiliate</a>
                        <button onclick="simulateLogout()" class="px-4 py-2 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold text-sm transition">Logout</button>
                    </nav>

                    <button onclick="simulateLogout()" class="md:hidden p-2 rounded-xl bg-red-500 text-white">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>

            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 pb-24 md:pb-8">
            <div id="status-alert" class="hidden fixed top-20 right-4 left-4 md:left-auto md:right-4 z-50 max-w-md alert-slide" role="alert">
                <div class="ultra-card p-4">
                    <div class="flex items-center space-x-3">
                        <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" id="alert-icon-bg">

            </div>

            <div id="app-container"></div>
        </main>

        <nav class="mobile-nav fixed bottom-0 left-0 right-0 z-40 md:hidden">
            <div class="flex justify-around items-center py-3 px-2">
                <button onclick="setRoute('tasks')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-tasks">
                    <i data-lucide="briefcase" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Tasks</span>
                </button>
                <button onclick="setRoute('my-tasks')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-my-tasks">
                    <i data-lucide="list-checks" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">My Tasks</span>
                </button>
                <button onclick="setRoute('earnings')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-earnings">
                    <i data-lucide="wallet" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Earnings</span>
                </button>
                <button onclick="setRoute('affiliate')" class="nav-item flex flex-col items-center space-y-1 py-2 px-4 rounded-xl transition" id="nav-affiliate">
                    <i data-lucide="users" class="w-6 h-6"></i>
                    <span class="text-xs font-medium">Affiliate</span>
                </button>
            </div>
        </nav>
    </div>

    <div id="action-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="ultra-card p-8 max-w-md w-full text-center fade-in-up">
            <div class="w-20 h-20 mx-auto mb-6 rounded-full flex items-center justify-center" id="modal-icon-bg">
                <i id="modal-icon" data-lucide="check-circle" class="w-12 h-12"></i>
            </div>
            <h3 id="modal-title" class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Success!</h3>
            <p id="modal-message" class="text-gray-600 text-sm md:text-base mb-6 leading-relaxed">Your action was completed successfully!</p>
            <button onclick="closeModal()" class="btn-premium text-white font-bold py-4 px-8 rounded-2xl w-full ripple">
                Continue
            </button>
        </div>
    </div>

<script>
    // --- GLOBAL CONSTANTS AND VARIABLES ---
    const BACKEND_URL = "https://btech-earning-api.onrender.com/api"; 
    const FORMSPREE_SURVEY_URL = "https://formspree.io/f/mblolava"; 
    const REFERRAL_BONUS = 200.00; 
    let AUTH_TOKEN; 
    let cachedTasks = [];
    let userStats = { totalEarned: 0, availableBalance: 0, pendingEarnings: 0, tasksCompleted: 0, activeTasks: 0 }; 
    let currentUserEmail = ""; 
    let userProfile = {}; 
    let cache = { profileLoaded: false, statsLoaded: false }; 

    // FINAL STABILITY FIX: Hardcoded Mock Task List for reliable initial load
    const MOCK_TASK_DEFINITIONS = [
        { id: 1, title: 'Daily App Feedback Survey', description: 'A quick 2-minute user experience survey. Instant KES 50 credit upon completion.', category: 'Survey', payment: 50.00, estimatedTime: '2 minutes', difficulty: 'Easy', requiresVerification: false, deadline: '2025-10-29', tasksAvailable: 1, completionRate: 99, clientName: 'BTECH Internal' },
        { id: 1000, title: 'Create 50 Gmail Accounts', description: 'Create 50 new Gmail accounts using the required common password. Submit the list of emails and the password.', category: 'Account Creation', payment: 500.00, estimatedTime: '4 hours', difficulty: 'Medium', requiresVerification: true, deadline: '2025-10-31', tasksAvailable: 5, completionRate: 75, clientName: 'Internal BTECH' },
        { id: 1001, title: 'Bulk Pricing Data Entry (Excel to DB)', description: 'Transfer 500 retail product prices from a spreadsheet into the client database template.', category: 'Data Entry', payment: 450.00, estimatedTime: '2 hours', difficulty: 'Medium', requiresVerification: false, deadline: '2025-10-25', tasksAvailable: 10, completionRate: 85, clientName: 'Retail Solutions Ltd' },
        { id: 1002, title: 'Transcribe 60 min Kiswahili Interview', description: 'Transcribe raw audio of an hour-long research interview from Kiswahili to English text.', category: 'Transcription', payment: 800.00, estimatedTime: '6 hours', difficulty: 'Hard', requiresVerification: true, deadline: '2025-10-28', tasksAvailable: 2, completionRate: 60, clientName: 'Market Research Hub' },
        { id: 1003, title: 'Mobile App Beta Testing (Bug Reporting)', description: 'Test a new mobile application for critical bugs and usability issues. Submit detailed reports.', category: 'QA Testing', payment: 750.00, estimatedTime: '5 hours', difficulty: 'Medium', requiresVerification: true, deadline: '2025-10-26', tasksAvailable: 8, completionRate: 70, clientName: 'Software Innovations' },
        { id: 1004, title: 'Write 5 Product Descriptions (200 words each)', description: 'Create engaging and SEO-friendly product descriptions for high-end electronics.', category: 'Content Creation', payment: 350.00, estimatedTime: '1 hour', difficulty: 'Easy', requiresVerification: false, deadline: '2025-10-24', tasksAvailable: 12, completionRate: 95, clientName: 'E-Commerce Africa' },
        { id: 1005, title: 'Verify Pricing: 10 Supermarket Items (Nairobi)', description: 'Visit a designated supermarket, take photos of pricing labels for 10 items, and submit the proof.', category: 'Local Data Verification', payment: 300.00, estimatedTime: '2 hours', difficulty: 'Easy', requiresVerification: true, deadline: '2025-10-27', tasksAvailable: 20, completionRate: 80, clientName: 'Consumer Insights' },
        { id: 1006, title: 'Translate 1000-word Legal Document (English to French)', description: 'Accurate translation of a basic legal contract. Requires fluency in French.', category: 'Translation', payment: 1200.00, estimatedTime: '8 hours', difficulty: 'Hard', requiresVerification: true, deadline: '2025-10-30', tasksAvailable: 1, completionRate: 50, clientName: 'Global Law Firm' },
        { id: 1007, title: 'Label 500 Image Sets (Traffic Signs)', description: 'Draw bounding boxes around traffic signs in 500 images for an autonomous vehicle training set.', category: 'AI Training/Labeling', payment: 600.00, estimatedTime: '3 hours', difficulty: 'Medium', requiresVerification: false, deadline: '2025-10-29', tasksAvailable: 15, completionRate: 70, clientName: 'AI Data Solutions' },
        { id: 1008, title: 'Cross-Check 200 Contact Records', description: 'Verify phone numbers and email addresses in a CRM list against public records. Report errors.', category: 'Data Quality Assurance', payment: 400.00, estimatedTime: '2 hours', difficulty: 'Medium', requiresVerification: false, deadline: '2025-10-27', tasksAvailable: 18, completionRate: 88, clientName: 'Tech Recruitment' }
    ];
    // --- End of Hardcoded Mock Data ---

    // --- Core Initialization Logic ---

    async function initializeApp() {
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token');
        
        if (urlToken) {
            AUTH_TOKEN = urlToken;
            localStorage.setItem('btech_auth_token', AUTH_TOKEN);
        } else if (localStorage.getItem('btech_auth_token')) {
             AUTH_TOKEN = localStorage.getItem('btech_auth_token');
        } 
        
        if (!AUTH_TOKEN || AUTH_TOKEN.length < 100) {
             const appContainer = document.getElementById('app-container');
             appContainer.innerHTML = `
                 <div class="ultra-card p-8 md:p-12 text-center mt-12">
                     <div class="empty-state-icon mb-6">
                         <i data-lucide="shield-alert" class="w-20 h-20 md:w-24 md:h-24 text-red-500 mx-auto"></i>
                     </div>
                     <h3 class="text-2xl md:text-3xl font-black text-gray-800 mb-3">Access Denied</h3>
                     <p class="text-gray-600 text-sm md:text-base mb-6">Please log in through the BTECH Plus App to continue.</p>
                     <button onclick="location.reload()" class="btn-premium text-white font-bold py-3 px-8 rounded-2xl ripple">
                         Retry Connection
                     </button>
                 </div>
             `;
             lucide.createIcons();
             return; 
        }
        
        // Authenticate and load initial data
        await Promise.all([
            checkAuthToken(), // Ensures token validity (will fail if server is down)
            fetchUserProfile(), 
            fetchUserStats()
        ]);
        
        if (window.location.search) {
             window.history.replaceState(null, null, window.location.pathname + window.location.hash);
        }

        const hash = window.location.hash.slice(1);
        setRoute(hash || 'tasks');
    }

    async function fetchUserProfile() {
        if (cache.profileLoaded) { return; }
        try {
            const result = await fetchData('/user/profile', { method: 'GET' });
            if (result.success && result.user) {
                currentUserEmail = result.user.email;
                userProfile = result.user; 
                cache.profileLoaded = true;
            }
        } catch (error) {
            // Log this error but DON'T crash the page if auth is okay.
            console.error("Warning: Failed to fetch full user profile (likely rate limit). Using defaults.");
        }
    }
    
    async function checkAuthToken() {
        try {
            // Simple call to validate token and server availability
            await fetchData('/earnings/summary', { method: 'GET' });
            return true;
        } catch (error) {
            // If this fails, we can't trust the session.
            console.error("CRITICAL AUTH CHECK FAILED:", error.message);
            // Optionally force logout here, but for now, we let loadContent handle fallback data.
            return true; 
        }
    }

    // --- Utility Functions (Omitted for brevity, assumed stable) ---
    function showAlert(message, isSuccess = true) { /* ... */ }
    function simulateLogout() { /* ... */ }
    function setRoute(path) { /* ... */ }
    function updateMobileNav(route) { /* ... */ }

    // --- FETCH DATA (Modified to handle 429 errors gracefully) ---
    async function fetchData(endpoint, options = {}) {
        if (!AUTH_TOKEN) { throw new Error('Authentication token missing.'); }
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${AUTH_TOKEN}`, ...options.headers };
        const config = { method: options.method || 'GET', headers: headers, ...(options.body && { body: JSON.stringify(options.body) }), };

        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`, config);
            const data = await response.json().catch(() => ({ error: 'Could not parse response.' }));
            
            if (!response.ok) {
                if (response.status === 429) {
                     throw new Error("Rate limit exceeded. Please try again in a few moments.");
                }
                throw new Error(data.error || `Error: ${response.status}`);
            }
            if (!data.success && data.error) {
                throw new Error(data.error);
            }
            return data;
        } catch (error) {
            console.error('API Error:', error.message);
            showAlert(`Error: ${error.message}`, false);
            throw error;
        }
    }
    
    async function fetchDailyTask() {
        try {
            // This is kept as a backend call to verify real-time status (isCompleted)
            const data = await fetchData('/tasks/daily', { method: 'GET' });
            return data.task;
        } catch (error) {
            console.error("Failed to fetch daily task:", error);
            // Fallback for load failure: Assume not completed, use mock data
            return MOCK_TASK_DEFINITIONS.find(t => t.id === 1) || null;
        }
    }

    async function fetchUserStats() {
        if (cache.statsLoaded) { return; }
        try {
            // Attempt to get real data
            const earningsData = await fetchData('/earnings/summary');
            const myTasksData = await fetchData('/tasks/my-tasks');

            userStats.totalEarned = parseFloat(earningsData.earnings.totalEarnings || 0);
            userStats.availableBalance = parseFloat(earningsData.earnings.availableBalance || 0);
            userStats.pendingEarnings = parseFloat(earningsData.earnings.pendingEarnings || 0);
            userStats.tasksCompleted = parseInt(earningsData.earnings.completedTasks || 0);
            userStats.activeTasks = myTasksData.tasks.length; // Use length of returned myTasks
            
            cache.statsLoaded = true;
        } catch (e) {
            console.error("Warning: Could not fetch real-time stats/tasks (using mock display data).");
            // FALLBACK: Use default stats if API fails, so the dashboard displays something
            userStats = { totalEarned: 0, availableBalance: 0, pendingEarnings: 0, tasksCompleted: 0, activeTasks: 0 };
        }
    }

    const getTaskPayout = (task) => { /* ... */ return parseFloat(task.payment || task.payout || 0).toFixed(2); }
    const getTaskDifficulty = (task) => { /* ... */ return (task.difficulty || 'Easy').toLowerCase(); }
    function getCategoryIcon(category) { /* ... */ return 'briefcase'; } // Simplified icons lookup

    // --- MAIN RENDER LOGIC ---
    
    function renderTasksList(tasks, dailyTask) {
        const appContainer = document.getElementById('app-container');
        // FIX: Use hardcoded list if the backend fetch failed
        const availableTasks = tasks || MOCK_TASK_DEFINITIONS; 
        cachedTasks = availableTasks;
        
        // ... (Rendering logic remains the same, using availableTasks and dailyTask)
        
        const mainTasksHtml = Array.isArray(availableTasks) ? availableTasks.map((task, i) => {
            if (dailyTask && task.id === dailyTask.id) return ''; 

            return `
            <div class="ultra-card p-5 md:p-6 fade-in-up" style="animation-delay: ${i * 0.1}s">
                <div class="flex justify-between items-start mb-4">
                    <div class="category-icon">
                        <i data-lucide="${getCategoryIcon(task.category)}" class="w-6 h-6 text-indigo-600"></i>
                    </div>
                    <span class="difficulty-${getTaskDifficulty(task)} text-white text-xs font-bold px-3 py-1 rounded-full">
                        ${task.difficulty || 'N/A'}
                    </span>
                </div>
                
                <h3 class="text-lg md:text-xl font-black text-gray-800 mb-3 leading-tight">${task.title || 'N/A'}</h3>
                
                <div class="mb-4">
                    <p class="text-3xl md:text-4xl font-black gradient-text mb-2">KES ${getTaskPayout(task)}</p>
                    <p class="text-xs md:text-sm text-gray-600 line-clamp-2">${task.description || 'No description provided.'}</p>
                </div>
                
                <div class="space-y-2 mb-5 text-xs md:text-sm text-gray-600">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="clock" class="w-4 h-4 text-gray-400"></i>
                        <span>${task.estimatedTime || 'Varies'}</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <i data-lucide="calendar" class="w-4 h-4 text-gray-400"></i>
                        <span>Due: ${task.deadline || 'N/A'}</span>
                    </div>
                </div>

                <button onclick="acceptTask(${task.id})" class="btn-premium w-full text-white font-bold py-3 md:py-4 rounded-xl flex items-center justify-center space-x-2 ripple">
                    <i data-lucide="play-circle" class="w-5 h-5"></i>
                    <span>Accept Task</span>
                </button>
            </div>
            `;
        }).join('') : `
            <div class="ultra-card p-8 md:p-12 text-center lg:col-span-3">
                 <i data-lucide="inbox" class="w-16 h-16 md:w-20 md:h-20 text-gray-400 mx-auto mb-4"></i>
                 <h3 class="text-xl font-black text-gray-800">No Major Tasks Right Now</h3>
                 <p class="text-gray-600 text-sm mt-2">All major tasks are currently assigned or unavailable.</p>
            </div>
        `;

        const dailyTaskHtml = dailyTask ? `
            <div class="ultra-card p-4 md:p-6 mb-6 border-2 border-indigo-400 bg-indigo-50">
                <h3 class="text-lg md:text-xl font-black text-indigo-700 mb-2 flex items-center space-x-2">
                    <i data-lucide="zap" class="w-5 h-5"></i>
                    <span>Today's Microtask: ${dailyTask.title || 'N/A'}</span>
                </h3>
                <p class="text-sm text-gray-700 mb-3">Category: ${dailyTask.category || 'N/A'} | Payout: KES ${getTaskPayout(dailyTask)}</p>
                
                ${dailyTask.isCompleted ? `
                    <button class="w-full bg-green-500 text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2 opacity-70" disabled>
                        <i data-lucide="check" class="w-5 h-5"></i>
                        <span>COMPLETED TODAY</span>
                    </button>
                ` : `
                    <button onclick="acceptAndNavigateToSurvey(${dailyTask.id})" class="btn-premium w-full text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2 ripple">
                        <i data-lucide="clipboard-list" class="w-5 h-5"></i>
                        <span>Start Survey</span>
                    </button>
                `}
            </div>
        ` : `<div class="ultra-card p-4 md:p-6 mb-6 text-center text-gray-500"><i data-lucide="calendar-x" class="w-8 h-8 mx-auto mb-2 text-gray-400"></i><p class="text-sm">No new microtasks available today. Check back tomorrow!</p></div>`;


        // 3. Final Render (Updated to use global userStats which were loaded first)
        appContainer.innerHTML = `
            <div class="fade-in-up">
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-6 mb-6">
                    <div class="ultra-card p-4 md:p-6 stats-shine text-white">
                        <i data-lucide="dollar-sign" class="w-8 h-8 md:w-10 md:h-10 mb-2 opacity-90"></i>
                        <p class="text-xs md:text-sm font-medium opacity-90">Total Earned</p>
                        <p class="text-xl md:text-3xl font-black mt-1">KES ${userStats.totalEarned.toFixed(2)}</p>
                    </div>
                    <div class="ultra-card p-4 md:p-6 stats-shine text-white">
                        <i data-lucide="check-circle-2" class="w-8 h-8 md:w-10 md:h-10 mb-2 opacity-90"></i>
                        <p class="text-xs md:text-sm font-medium opacity-90">Completed</p>
                        <p class="text-xl md:text-3xl font-black mt-1">${userStats.tasksCompleted}</p>
                    </div>
                    <div class="ultra-card p-4 md:p-6 stats-shine text-white col-span-2 md:col-span-1">
                        <i data-lucide="activity" class="w-8 h-8 md:w-10 md:h-10 mb-2 opacity-90"></i>
                        <p class="text-xs md:text-sm font-medium opacity-90">Active</p>
                        <p class="text-xl md:text-3xl font-black mt-1">${userStats.activeTasks}</p>
                    </div>
