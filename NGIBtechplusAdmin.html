<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTech Plus · Admin Command Centre</title>
    <!-- Google Fonts: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS for rapid, clean layout styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDeep: '#050810',
                        surface: '#0D1117',
                        surfaceElevated: '#1A2130',
                        gold: '#D4AF37',
                    },
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgDeep text-white font-montserrat min-h-screen antialiased">

    <!-- TOP NAVIGATION BAR -->
    <nav class="bg-surface border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-500 to-amber-700 flex items-center justify-center font-bold text-bgDeep text-lg">
                B+
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide">BTech Plus Admin</h1>
                <p class="text-xs text-gray-400">Command & Control Hub</p>
            </div>
        </div>
        <div id="authStatus" class="text-xs text-gray-400">Connecting to Firebase...</div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">

        <!-- TAB NAVIGATION -->
        <div class="flex space-x-4 mb-8 border-b border-white/10 pb-4">
            <button onclick="switchTab('tasks')" id="tabBtnTasks" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-gold text-bgDeep transition shadow-lg">Manage Tasks & Gigs</button>
            <button onclick="switchTab('submissions')" id="tabBtnSubmissions" class="px-5 py-2.5 rounded-xl font-medium text-sm text-gray-400 hover:text-white transition">Review User Submissions</button>
        </div>

        <!-- SECTION 1: MANAGE & CREATE TASKS -->
        <div id="sectionTasks" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Create Task Form -->
            <div class="bg-surface border border-white/10 rounded-2xl p-6 h-fit">
                <h2 class="text-lg font-bold mb-4 text-gold">Publish New Gig / Task</h2>
                <form id="createGigForm" onsubmit="createNewGig(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Gig Title</label>
                        <input type="text" id="gigTitle" required placeholder="e.g., Absa App Account Setup" class="w-full bg-surfaceElevated border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Description</label>
                        <textarea id="gigDesc" required rows="3" placeholder="Explain what the user needs to do..." class="w-full bg-surfaceElevated border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Type</label>
                            <select id="gigType" class="w-full bg-surfaceElevated border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold">
                                <option value="BOUNTY">BOUNTY (Internal Pay)</option>
                                <option value="EXTERNAL">EXTERNAL (Link/Hustle)</option>
                                <option value="IDEA">IDEA / GUIDE</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Submission Requirement</label>
                            <select id="gigSubtype" class="w-full bg-surfaceElevated border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold">
                                <option value="TEXT">TEXT (Logins/Usernames)</option>
                                <option value="NONE">NONE (Just read/click)</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Badge Text</label>
                            <input type="text" id="gigBadge" placeholder="+ KES 50" value="+ KES 50" class="w-full bg-surfaceElevated border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 mb-1">Badge Color (Hex)</label>
                            <input type="text" id="gigColor" placeholder="#22C55E" value="#22C55E" class="w-full bg-surfaceElevated border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Action URL (Referral / Target Link)</label>
                        <input type="url" id="gigUrl" placeholder="https://safaricom.co.ke..." class="w-full bg-surfaceElevated border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Step-by-Step Instructions</label>
                        <textarea id="gigInstructions" rows="3" placeholder="1. Click link&#10;2. Register&#10;3. Submit username" class="w-full bg-surfaceElevated border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gold text-bgDeep font-bold py-3.5 rounded-xl hover:bg-amber-400 transition shadow-lg">Publish Live to App</button>
                </form>
            </div>

            <!-- Active Tasks Feed List -->
            <div class="lg:col-span-2 bg-surface border border-white/10 rounded-2xl p-6">
                <h2 class="text-lg font-bold mb-4 text-gold">Active Gigs in App Feed</h2>
                <div id="tasksListContainer" class="space-y-4">
                    <p class="text-sm text-gray-400">Loading live tasks from Firebase...</p>
                </div>
            </div>

        </div>

        <!-- SECTION 2: REVIEW USER SUBMISSIONS -->
        <div id="sectionSubmissions" class="hidden bg-surface border border-white/10 rounded-2xl p-6">
            <h2 class="text-lg font-bold mb-4 text-gold">Pending User Submissions (Credentials & Proofs)</h2>
            <div id="submissionsListContainer" class="space-y-4">
                <p class="text-sm text-gray-400">Loading submissions...</p>
            </div>
        </div>

    </main>

    <!-- FIREBASE SDKs (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 REPLACE THESE WITH YOUR ACTUAL FIREBASE WEB CONFIG KEYS FROM FIREBASE CONSOLE
       const firebaseConfig = {
  apiKey: "AIzaSyCMJdzsgYU5KgJ0T-7JTKJTqnpvEaFB2Zs",
  authDomain: "n-g-i-761b1.firebaseapp.com",
  projectId: "n-g-i-761b1",
  storageBucket: "n-g-i-761b1.firebasestorage.app",
  messagingSenderId: "375248351958",
  appId: "1:375248351958:web:9b45197e1a1dadeaaa0f77",
  measurementId: "G-G36XSJ4DNQ"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('authStatus').innerText = "Connected to Firebase ✓";

        // Tab Switching Logic
        window.switchTab = function(tab) {
            if (tab === 'tasks') {
                document.getElementById('sectionTasks').classList.remove('hidden');
                document.getElementById('sectionSubmissions').classList.add('hidden');
                document.getElementById('tabBtnTasks').className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-gold text-bgDeep transition shadow-lg";
                document.getElementById('tabBtnSubmissions').className = "px-5 py-2.5 rounded-xl font-medium text-sm text-gray-400 hover:text-white transition";
            } else {
                document.getElementById('sectionTasks').classList.add('hidden');
                document.getElementById('sectionSubmissions').classList.remove('hidden');
                document.getElementById('tabBtnSubmissions').className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-gold text-bgDeep transition shadow-lg";
                document.getElementById('tabBtnTasks').className = "px-5 py-2.5 rounded-xl font-medium text-sm text-gray-400 hover:text-white transition";
                loadSubmissions();
            }
        }

        // Create New Gig
        window.createNewGig = async function(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            btn.innerText = "Publishing...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "btech_gigs"), {
                    title: document.getElementById('gigTitle').value,
                    description: document.getElementById('gigDesc').value,
                    type: document.getElementById('gigType').value,
                    submissionType: document.getElementById('gigSubtype').value,
                    badgeText: document.getElementById('gigBadge').value,
                    badgeColorHex: document.getElementById('gigColor').value,
                    actionUrl: document.getElementById('gigUrl').value,
                    instructions: document.getElementById('gigInstructions').value,
                    mediaUrl: "",
                    buttonText: "Start Gig",
                    isActive: true,
                    timestamp: Date.now()
                });
                alert("Gig published successfully! It will instantly show up in the app.");
                document.getElementById('createGigForm').reset();
                loadTasks();
            } catch (e) {
                alert("Error publishing gig: " + e.message);
            } finally {
                btn.innerText = "Publish Live to App";
                btn.disabled = false;
            }
        }

        // Load Active Tasks
        async function loadTasks() {
            const container = document.getElementById('tasksListContainer');
            container.innerHTML = '<p class="text-sm text-gray-400">Loading tasks...</p>';
            
            try {
                const q = query(collection(db, "btech_gigs"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p class="text-sm text-gray-500">No active gigs found. Create your first one on the left.</p>';
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((document) => {
                    const gig = document.data();
                    const card = document.createElement('div');
                    card.className = "bg-surfaceElevated border border-white/10 rounded-xl p-4 flex justify-between items-center";
                    card.innerHTML = `
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-400">${gig.type}</span>
                                <h3 class="font-bold text-sm">${gig.title}</h3>
                            </div>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-1">${gig.description}</p>
                        </div>
                        <button onclick="deleteGig('${document.id}')" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Delete</button>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                // 🔥 PRINT THE ACTUAL ERROR TO THE UI AND CONSOLE FOR DEBUGGING
                console.error("Firestore Load Error:", e);
                container.innerHTML = `<p class="text-sm text-red-400">Failed to load tasks: ${e.message}</p>`;
            }
        }

        // Delete Gig
        window.deleteGig = async function(id) {
            if (confirm("Are you sure you want to delete this task from the app?")) {
                await deleteDoc(doc(db, "btech_gigs", id));
                loadTasks();
            }
        }

        // Load Submissions
        async function loadSubmissions() {
            const container = document.getElementById('submissionsListContainer');
            container.innerHTML = '<p class="text-sm text-gray-400">Loading user submissions...</p>';

            try {
                const q = query(collection(db, "btech_submissions"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = '<p class="text-sm text-gray-500">No submissions found yet.</p>';
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((document) => {
                    const sub = document.data();
                    const card = document.createElement('div');
                    card.className = "bg-surfaceElevated border border-white/10 rounded-xl p-4";
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs text-gold font-bold">${sub.gigTitle}</span>
                                <p class="text-xs text-gray-500">User ID: ${sub.uid}</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${sub.status === 'Completed' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">${sub.status}</span>
                        </div>
                        <div class="bg-bgDeep p-3 rounded-lg border border-white/5 my-2">
                            <p class="text-xs text-gray-300 font-mono whitespace-pre-wrap">${sub.submissionData}</p>
                        </div>
                        ${sub.status === 'Pending' ? `<button onclick="markComplete('${document.id}')" class="mt-2 bg-green-500 text-bgDeep font-bold px-4 py-2 rounded-lg text-xs hover:bg-green-400 transition">Mark Completed / Paid</button>` : ''}
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<p class="text-sm text-red-400">Failed to load submissions.</p>';
            }
        }

        window.markComplete = async function(id) {
            await updateDoc(doc(db, "btech_submissions", id), { status: "Completed" });
            loadSubmissions();
        }

        // Initial Load
        loadTasks();
    </script>
</body>
</html>
