<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTECH Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; }
        .card-shadow { box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.08); }
        .header-bg { background-color: #1e293b; }
        .text-accent { color: #6366f1; }
        .btn-action { transition: background-color 0.15s; }
        
        /* Custom scrollbar for pre-formatted content */
        .scroll-json::-webkit-scrollbar { height: 8px; }
        .scroll-json::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Glassmorphism/Premium styles removed for clean admin panel */
    </style>
</head>

<body class="min-h-screen">
    
    <!-- Admin Header -->
    <header class="glass-header text-white shadow-lg sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center">
                <i data-lucide="shield-check" class="w-6 h-6 mr-3 text-green-400"></i>
                BTECH <span class="font-normal ml-1 text-gray-400">Admin Panel</span>
            </h1>
            <button onclick="logoutAdmin()" class="text-gray-300 hover:text-white transition text-sm font-medium">
                <i data-lucide="key" class="w-4 h-4 mr-1 inline-block"></i> Logout
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Login Modal (Security Gate) -->
        <div id="login-modal" class="fixed inset-0 bg-gray-900 bg-opacity-95 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-xl card-shadow w-full max-w-md">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Admin Login</h2>
                <input type="password" id="admin-key-input" placeholder="Enter Admin Secret Key" class="w-full p-3 border border-gray-300 rounded-lg focus:border-accent focus:ring-accent mb-4">
                <button onclick="loginAdmin()" class="w-full bg-accent hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                    Access Dashboard
                </button>
                <p id="login-error" class="text-red-500 text-sm mt-3 hidden">Invalid Key. Please try again.</p>
            </div>
        </div>

        <!-- Floating Alert -->
        <div id="status-alert" class="hidden fixed top-4 right-4 z-50 p-4 rounded-lg text-white font-medium card-shadow alert-slide max-w-xs"></div>
        
        <div id="dashboard-content" class="space-y-12 hidden">

            <!-- Title Section -->
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Review Queues</h2>
                <p class="text-gray-500">Manual verification and task finalization required.</p>
            </div>

            <!-- Verification Queue -->
            <section>
                <h3 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <i data-lucide="scan-face" class="w-6 h-6 mr-2 text-red-500"></i>
                    ID Verification Queue (<span id="verification-count">0</span>)
                </h3>
                <div id="verification-list" class="space-y-4">
                    <!-- Verification cards injected here -->
                </div>
            </section>

            <!-- Task Review Queue -->
            <section>
                <h3 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <i data-lucide="file-check" class="w-6 h-6 mr-2 text-green-500"></i>
                    Task Submission Review (<span id="task-review-count">0</span>)
                </h3>
                <div id="task-review-list" class="space-y-4">
                    <!-- Task submission cards injected here -->
                </div>
            </section>

        </div>
        
    </main>

<script>
    // --- Configuration ---
    const BACKEND_URL = "https://btech-earning-api.onrender.com/api";
    // CRITICAL FIX: The key must be hardcoded here to match the Render ENV variable exactly.
    const ADMIN_SECRET_KEY = "s3cr3t-k3y-F0r-Adm1n-B7ECH-2025"; 
    const GEMINI_API_KEY = ""; // Injected by the platform
    
    let IS_LOGGED_IN = false;
    const loginModal = document.getElementById('login-modal');
    const dashboardContent = document.getElementById('dashboard-content');
    const statusAlert = document.getElementById('status-alert');

    // --- Authentication and Utility ---

    function showAlert(message, isSuccess = true) {
        statusAlert.textContent = message;
        statusAlert.className = `fixed top-4 right-4 z-50 p-4 rounded-lg font-medium card-shadow alert-slide max-w-xs ${isSuccess ? 'bg-green-500' : 'bg-red-500'}`;
        setTimeout(() => {
            statusAlert.classList.add('hidden');
        }, 5000);
    }

    function loginAdmin() {
        const input = document.getElementById('admin-key-input');
        const error = document.getElementById('login-error');
        
        if (input.value === ADMIN_SECRET_KEY) {
            // Save key to memory/session for subsequent fetches
            sessionStorage.setItem('admin_key_token', input.value);
            IS_LOGGED_IN = true;
            loginModal.classList.add('hidden');
            dashboardContent.classList.remove('hidden');
            loadQueues();
        } else {
            error.classList.remove('hidden');
            showAlert("Login failed. Check your key.", false);
        }
    }
    
    function logoutAdmin() {
        sessionStorage.removeItem('admin_key_token');
        IS_LOGGED_IN = false;
        dashboardContent.classList.add('hidden');
        document.getElementById('login-modal').classList.remove('hidden');
        document.getElementById('admin-key-input').value = '';
    }

    async function fetchAdminData(endpoint, options = {}) {
        const key = sessionStorage.getItem('admin_key_token');

        if (!key || !IS_LOGGED_IN) {
            showAlert("Admin session expired. Please log in.", false);
            return null;
        }

        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                method: options.method || 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    // Use the key for custom authentication
                    'X-Admin-Secret': key 
                },
                body: options.body ? JSON.stringify(options.body) : null,
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                 if (response.status === 403) {
                     showAlert("Authorization failed. Invalid Admin Key.", false);
                     logoutAdmin();
                 }
                 throw new Error(data.error || `Error: ${response.status}`);
            }
            return data;

        } catch (error) {
            showAlert(`Network Error: ${error.message}`, false);
            console.error('Fetch error:', error);
            return null;
        }
    }

    // --- Gemini LLM Functions ---

    async function callGeminiLLM(systemPrompt, userQuery) {
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${GEMINI_API_KEY}`;

        const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            systemInstruction: {
                parts: [{ text: systemPrompt }]
            },
        };

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            
            if (result.candidates && result.candidates.length > 0 && result.candidates[0].content?.parts?.[0]?.text) {
                return result.candidates[0].content.parts[0].text;
            } else {
                console.error('Gemini API returned an unexpected structure:', result);
                return 'AI analysis failed: Could not process response.';
            }
        } catch (error) {
            console.error('Gemini API Fetch Error:', error);
            return 'AI analysis failed due to network error.';
        }
    }

    // --- Rendering Functions ---

    function renderEmptyState(containerId, message) {
        document.getElementById(containerId).innerHTML = `
            <div class="ultra-card p-6 text-center text-gray-500">
                <i data-lucide="thumbs-up" class="w-8 h-8 mx-auto mb-2 text-green-500"></i>
                <p class="text-sm">${message}</p>
            </div>
        `;
        lucide.createIcons();
    }

    async function loadQueues() {
        const data = await fetchAdminData('/admin/pending-submissions');
        
        if (!data) return;

        // 1. Render Verification Queue
        const verificationList = document.getElementById('verification-list');
        document.getElementById('verification-count').textContent = data.verificationQueue.length;
        verificationList.innerHTML = '';

        if (data.verificationQueue.length === 0) {
            renderEmptyState('verification-list', 'No new IDs awaiting review.');
        } else {
            data.verificationQueue.forEach(item => {
                verificationList.innerHTML += createVerificationCard(item);
            });
        }

        // 2. Render Task Review Queue
        const taskReviewList = document.getElementById('task-review-list');
        document.getElementById('task-review-count').textContent = data.taskReviewQueue.length;
        taskReviewList.innerHTML = '';
        
        if (data.taskReviewQueue.length === 0) {
            renderEmptyState('task-review-list', 'No tasks submitted for review.');
        } else {
            data.taskReviewQueue.forEach(item => {
                taskReviewList.innerHTML += createTaskReviewCard(item);
            });
        }
        
        lucide.createIcons();
    }

    function createVerificationCard(item) {
        const fileUrl = `${BACKEND_URL}/uploads/${item.document_path}`; 
        
        return `
            <div class="ultra-card p-4 md:p-6 flex flex-col md:flex-row justify-between items-start md:items-center">
                <div class="flex-1 space-y-1 mb-4 md:mb-0">
                    <p class="text-gray-800 font-bold">${item.email}</p>
                    <p class="text-sm text-gray-600">User ID: ${item.user_id} | Document: ${item.document_type}</p>
                    <a href="${fileUrl}" target="_blank" class="text-xs text-accent hover:underline">
                        View Document (Temporary Link)
                    </a>
                </div>
                <div class="flex space-x-3">
                    <button onclick="finalizeTask(${item.user_id}, null, 'VERIFIED', true)" class="btn-action bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-xl text-sm">
                        <i data-lucide="check" class="w-4 h-4 inline-block"></i> Approve
                    </button>
                    <button onclick="finalizeTask(${item.user_id}, null, 'REJECTED', true)" class="btn-action bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-xl text-sm">
                        <i data-lucide="x" class="w-4 h-4 inline-block"></i> Reject
                    </button>
                </div>
            </div>
        `;
    }

    function createTaskReviewCard(item) {
        const details = JSON.parse(item.details);
        const submissionId = item.id; 

        return `
            <div class="ultra-card p-4 md:p-6 space-y-3" id="task-card-${submissionId}">
                <div class="flex justify-between items-center border-b pb-3 mb-3">
                    <p class="text-gray-800 font-bold">${item.email} (Task ID: ${item.task_id})</p>
                    <span class="text-xs text-gray-500">${new Date(item.submitted_at).toLocaleDateString()}</span>
                </div>
                
                <div class="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-6 text-sm">
                    <div class="flex-1">
                        <p class="font-semibold text-gray-700 mb-1">Common Password:</p>
                        <span class="text-gray-800 font-mono">${details.commonPassword}</span>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-700 mb-1">Accounts Submitted:</p>
                        <span class="text-gray-800 font-mono">${details.accounts_count || 50}</span>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t text-sm">
                    <p class="font-semibold text-gray-700 mb-2">Submitted Email List (First 5):</p>
                    <pre class="bg-gray-100 p-3 rounded-lg text-xs scroll-json overflow-x-auto">${details.accounts_list.split('\n').slice(0, 5).join('\n')}...</pre>
                </div>
                
                <!-- Gemini LLM Review Section -->
                <div class="pt-3 border-t">
                    <button 
                        onclick="analyzeSubmissionQuality(${submissionId}, ${item.user_id}, ${item.task_id}, \`${details.accounts_list.replace(/`/g, "\\`")}\`)" 
                        id="analyze-btn-${submissionId}" 
                        class="btn-action bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-xl text-sm flex items-center space-x-2">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                        <span>AI Quality Check</span>
                    </button>
                    <div id="ai-critique-${submissionId}" class="mt-3 p-3 bg-indigo-50 rounded-lg text-gray-800 text-sm hidden">
                        <i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i> Analyzing...
                    </div>
                </div>

                <!-- Approval/Rejection Buttons -->
                <div class="flex justify-end space-x-3 pt-3">
                    <button onclick="finalizeTask(${item.user_id}, ${item.task_id}, 'APPROVED', false)" class="btn-action bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-xl text-sm">
                        Approve Task
                    </button>
                    <button onclick="showRejectionModal(${item.user_id}, ${item.task_id}, \`${details.accounts_list.replace(/`/g, "\\`")}\`)" class="btn-action bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-xl text-sm">
                        Reject Task
                    </button>
                </div>
            </div>
        `;
    }

    async function analyzeSubmissionQuality(submissionId, userId, taskId, accountList) {
        const critiqueDiv = document.getElementById(`ai-critique-${submissionId}`);
        const analyzeBtn = document.getElementById(`analyze-btn-${submissionId}`);
        
        critiqueDiv.classList.remove('hidden');
        critiqueDiv.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i> Analyzing...';
        analyzeBtn.disabled = true;
        lucide.createIcons();

        const systemPrompt = "You are an expert fraud detection and data quality analyst for a micro-task platform. Analyze the provided list of 50 Gmail accounts. Provide a concise, professional summary of the submission quality, looking for patterns like numeric sequences, obvious spam generation, or poor structure. If the list looks legitimate, state 'GOOD QUALITY'. If suspicious, state 'FLAGGED: [Reason]'";
        const userQuery = `Analyze the quality of this submitted list of 50 Gmail accounts:\n\n${accountList}`;
        
        const result = await callGeminiLLM(systemPrompt, userQuery);

        critiqueDiv.innerHTML = `<p class="font-semibold mb-1">AI Critique:</p><p>${result}</p>`;
        analyzeBtn.disabled = false;
        lucide.createIcons();
    }

    // --- Helper Functions for Modal (for Rejection) ---

    function showRejectionModal(userId, taskId, accountList) {
        const analysisDiv = document.getElementById(`ai-critique-${taskId}`)?.textContent || 'No AI analysis performed yet.';
        
        showModal('Reject Task Submission', `
            <p class="text-gray-600 mb-4">Generate a clear reason for rejecting Task ${taskId}.</p>
            <textarea id="rejection-reason-input" rows="4" class="w-full p-3 border-2 border-gray-200 rounded-xl mb-3"></textarea>
            <button onclick="generateRejectionReason(${taskId})" class="btn-action bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-xl text-sm mb-3 w-full flex items-center justify-center space-x-2">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>Draft with AI</span>
            </button>
            <button onclick="confirmRejection(${userId}, ${taskId})" class="btn-action bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl w-full">
                Confirm Rejection
            </button>
        `, 'error');
        
        // Pass relevant data to rejection logic
        window._temp_rejection_data = { userId, taskId, accountList, analysis: analysisDiv };
    }

    async function generateRejectionReason(taskId) {
        const data = window._temp_rejection_data;
        const reasonTextarea = document.getElementById('rejection-reason-input');

        reasonTextarea.value = 'Drafting...';
        
        const systemPrompt = "You are a professional customer support agent for a micro-task platform. Draft a single, concise paragraph explaining why a task submission was rejected. Use a polite but firm tone. The reason should be based on suspicious submission data.";
        const userQuery = `Draft a rejection message based on this analysis: ${data.analysis}. The submission was flagged for potential fraud/poor quality data.`;

        const result = await callGeminiLLM(systemPrompt, userQuery);
        reasonTextarea.value = result;
    }

    function confirmRejection(userId, taskId) {
        const reason = document.getElementById('rejection-reason-input').value.trim();
        if (reason) {
            closeModal();
            // NOTE: We are using the existing finalizeTask endpoint
            finalizeTask(userId, taskId, 'REJECTED', false);
        } else {
            showAlert("Please provide a rejection reason.", false);
        }
    }
    
    // --- Finalization Logic ---

    async function finalizeTask(userId, taskId, status, isVerification) {
        const endpoint = '/admin/finalize-task';
        const body = { userId, taskId, status };

        try {
            const data = await fetchAdminData(endpoint, {
                method: 'POST',
                body: body
            });
            
            if (data && data.success) {
                showAlert(`${isVerification ? 'Verification' : 'Task'} finalized as ${status}.`, true);
                loadQueues(); // Reload the queues immediately
            }

        } catch (error) {
            showAlert(`Finalization failed: ${error.message}`, false);
        }
    }


    // --- Initialization ---
    
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Check for stored key
        const storedKey = sessionStorage.getItem('admin_key_token');

        // 2. Automatically log in if key is found
        if (storedKey) {
             // CRITICAL: Set the global variable from session storage
             ADMIN_SECRET_KEY = storedKey; 
             IS_LOGGED_IN = true;
             loginModal.classList.add('hidden');
             dashboardContent.classList.remove('hidden');
             loadQueues();
        } else {
            // Show login modal otherwise
            document.getElementById('login-modal').classList.remove('hidden');
        }
        lucide.createIcons();
    });
    
    window.onload = lucide.createIcons;

</script>
</body>
</html>
